   *      B 哈气打断 → 「能量回收」本该没了
   *      A 再哈气打断 → B 的打断没了 → 「能量回收」又生效了
   *      B 再再哈气打断 → 又没了 …… 一直到最后没人有牌为止
   *
   *  奇数次打断 = 原牌被抵消，偶数次 = 原牌生效。
   *
   *  实现上就是"打断这张牌的时候，递归地问一遍谁要打断它"。
   *  每一层都要消耗一张手牌，所以一定会停（不会死循环）。
   *
   *  @param depth 第几层（0 = 原来的锦囊，1 = 打断它的哈气，2 = 再打断……）
   */
  async function tryNullify(caster, card, def, info = {}) {
    const depth = info.depth || 0;
    //  最外层那张牌的信息要一路带下去 —— AI 要靠它判断
    //  "这张牌到底对谁有利"，才决定要不要把打断打回去。
    const rootCardId = info.rootCardId || def.id;
    const rootCasterIndex =
      typeof info.rootCasterIndex === 'number' ? info.rootCasterIndex : caster.index;

    const text = depth === 0
      ? `${caster.name} 使用了「${def.name}」，是否用「哈气打断」抵消？`
      : `${caster.name} 打出了「哈气打断」，是否再打断它？（打断了「${CARD_DB[rootCardId].name}」就会重新生效）`;

    for (const p of alivePlayers()) {
      if (p === caster) continue; // 没人会打断自己刚打出的牌
      if (!p.hand.some((c) => c.def.id === 'hissStop')) continue;

      const c = await askResponse(p, 'hissStop', text, {
        // 这一张是什么（可能是普通锦囊，也可能是「哈气打断」本身）
        cardId: def.id,
        casterIndex: caster.index,
        // 最外层那张牌是谁用的、是什么 —— AI 判断"值不值得打回去"要看它
        rootCardId,
        rootCasterIndex,
        chainDepth: depth,
        isOwnCard: false,
      });
      if (!c) continue;

      discard(p, c);
      log(`${p.name} 打出「哈气打断」，「${def.name}」被抵消了！`, 'skill');
      await sleep(stepDelay);

      // ★ 递归：这一张「哈气打断」也可能被打断
      const countered = await tryNullify(p, c, CARD_DB.hissStop, {
        depth: depth + 1,
        rootCardId,
        rootCasterIndex,
      });

      if (countered) {
        // 自己的打断被打断了 → 等于自己没打成 → 原来那张牌照常生效
        log(`「哈气打断」也被打断了，「${def.name}」重新生效`, 'info');
        return false;
      }

      // ★ 到这一步才说明这一张「哈气打断」真的拍成了（没被对方再打回去）。
      //   特效挂在**这里**是有意的：连锁里只有最后成功的那一下会放动画，
      //   中间那些"被人家打回去"的不会放 —— 不然屏幕会连着炸好几下。
      //   （界面那边还有一层保险：同一种特效只留最新的一个，见 src/ui/fx.js）
      log(`「哈气打断」稳稳拍掉了「${def.name}」`, 'fx', {
        fx: { kind: 'burst', cardId: 'hissStop', who: p.index },
      });
      return true; // 打断成功，这张牌被抵消
    }

    if (depth === 0) log(`「${def.name}」生效`, 'info');
    return false;
  }

  /**
   * 真正把一张牌用出去
   * @param asDefId 如果传了，说明这张牌被武将技能"变形"成了另一种牌
   * @returns {Promise<boolean>} false = 玩家在选目标那一步取消了，牌没出（还在手里）
   */
  async function useCard(player, card, asDefId = null) {
    const def = asDefId ? CARD_DB[asDefId] : card.def;

    // ★ 先选目标，**再**花牌。
    //   顺序很关键：如果玩家在选人那一步反悔了，牌必须原封不动退回手里。
    //   （以前 1v1 没有这一步，直接 foe 就完事了。）
    const resolved = await resolveTarget(player, def);
    if (!resolved.ok) return false;
    const foe = resolved.target;
    //  ★ v1.5.2（模式 5）：身份局里"对手"是除自己以外的所有人 ——
    //    全场牌（屎到淋头 / 战争践踏）必须一视同仁，不能"刚好绕过同伙"
    //    （那等于告诉玩家谁是队友）。
    const foes = opponentsOf(player);

    const convertedNote = asDefId && asDefId !== card.def.id
      ? `（把「${card.def.name}」当作「${def.name}」使用）`
      : '';
    const targetNote = (def.targetMode && opponentNote(player, foe)) || '';
    // fx.kind='played' 是给界面用的：在那个人的座位附近把这张牌**亮一下**，
    // 让玩家（尤其是看 AI 出牌时）看清用了什么牌。
    // 这里只报"谁、用了哪张"，怎么画由界面决定（见 src/ui/fx.js）。
    log(`${player.name} 使用了「${def.name}」${convertedNote}${targetNote}`, 'use', {
      fx: { kind: 'played', cardId: def.id, who: player.index },
    });
    //  ★ v1.5.2（隐藏关卡）：**"最终之战"形态下，耄耋打出的每一张杀都带哈气特效**
    //    玩家原话：「耄耋打出的每一个杀（无论有没有命中），都有"哈气打断"的
    //    视觉特效，不过光环颜色改成耄耋毛发的颜色」。
    //
    //    ⚠️ "无论有没有命中" —— 所以挂在**出牌这一刻**，不是命中结算里。
    //    ⚠️ 光环颜色由引擎给出（`player.hero.color` = 它自己的毛色），
    //       界面只负责画（见 ui/fx.js 的 hissFur）。
    if (
      player.counters && player.counters.maodieFinal &&
      (def.id === 'scratch' || def.countsAs === 'scratch')
    ) {
      log('😾 ……哈气（每一下都带着古战场的回响）', 'skill', {
        fx: { kind: 'hissFur', color: player.hero.color },
      });
    }
    // ★ v1.5.2（模式 5）：顺手记进"出牌区"（中间信息区那块集中显示）
    notePlay(player, def, def.targetMode === 'enemy' ? [foe] : []);
    await sleep(stepDelay);

    // 0) 装备牌：不进弃牌堆，而是穿到装备区
    //    （同槽已经有装备时，旧的会被挤进弃牌堆，见 equip()）
    if (def.type === CARD_TYPE.EQUIP) {
      removeFromHand(player, card);
      equip(player, card);
      return true;
    }

    const isTrick = def.type === CARD_TYPE.TRICK || def.type === CARD_TYPE.DELAYED;

    // 1) 锦囊先过"哈气打断"（任何玩家都能打断）
    if (isTrick) {
      const negated = await tryNullify(player, card, def);
      if (negated) {
        discard(player, card);
        return true;
      }
    }

    // 2) 再过"目标自己的反制技能"（园区响尾蛇的「失道者」）
    //    只有"冲着你来的"锦囊才会走到这里 —— cards.js 里标了 targetsFoe 的那些
    if (isTrick && def.targetsFoe) {
      const blocked = await tryCancelByTarget(player, card, foe);
      if (blocked) {
        discard(player, card); // 被拍掉了，直接进弃牌堆
        return true;
      }
    }

    // 记一次使用次数（按"变形后"的牌记）
    // 记一次使用次数（按"变形后"的牌记；`countsAs` 让火杀/雷杀记在抓挠头上）
    const limitKey = def.countsAs || def.id;
    player.usedThisTurn[limitKey] = (player.usedThisTurn[limitKey] || 0) + 1;

    if (def.type === CARD_TYPE.DELAYED) {
      // 延时锦囊不进弃牌堆，而是贴到判定区。
      // ★ 默认贴对方（猫薄荷 / 基饿游戏）；
      //   `selfTarget` 的贴自己头上（大狗嚼：赌一把，炸不到就轮到别人）。
      removeFromHand(player, card);
      if (def.selfTarget) {
        player.judgeZone.push(card);
      } else {
        foe.judgeZone.push(card);
      }
    } else {
      discard(player, card);
    }

    sync();
    if (typeof def.use !== 'function') {
      // 理论上不该发生（比如"吴？"这种只能被动打的牌被主动打了出来）。
      // 宁可跳过并留下日志，也不要让整局游戏崩掉。
      log(`⚠️「${def.name}」没有被定义使用效果，已跳过`, 'bad');
      return true;
    }
    await def.use({ G: api, self: player, foe, foes, card, def });
    sync();
    return true;
  }

  /**
   * 日志里补一句"打的是谁"。
   * 1v1 的时候对手只有一个，写出来反而啰嗦，所以只有 2 个以上敌人才加。
   */
  function opponentNote(player, foe) {
    if (!foe || foesOf(player).length <= 1) return '';
    return ` → ${foe.name}`;
  }

  // ----------------------------------------------------------
  //  各个阶段
  // ----------------------------------------------------------
  async function firePhaseHook(player, hookName, phase) {
    for (const { skill, fn } of hooksFor(player, hookName)) {
      await fn({ G: api, self: player, foe: foeOf(player), foes: foesOf(player), phase, skill });
    }
    sync();
  }

  async function enterPhase(player, phase) {
    state.phase = phase;
    log(`── ${player.name} · ${phase} ──`, 'phase');
    await firePhaseHook(player, 'onPhaseStart', phase);
    await sleep(stepDelay);
  }

  async function exitPhase(player, phase) {
    await firePhaseHook(player, 'onPhaseEnd', phase);
  }

  /**
   * 判定阶段：结算判定区里的延时锦囊。
   *
   * 每种延时锦囊的 `resolveJudge` 可以返回：
   *   false / undefined → 没生效，牌进弃牌堆
   *   true / 'play'     → 生效：跳过**出牌**阶段（猫薄荷）
   *   'draw'            → 生效：跳过**摸牌**阶段（基饿游戏）
   *   'transfer'        → 没生效，但牌**不进弃牌堆** —— 传给下一个人（大狗嚼）
   */
  async function resolveJudgeZone(player) {
    let skipPlay = false;
    let skipDraw = false;
    for (const card of [...player.judgeZone]) {
      if (typeof card.def.resolveJudge !== 'function') continue;
      const G = api;
      const r = await card.def.resolveJudge({ G, self: player, card });
      if (r === true || r === 'play') skipPlay = true;
      if (r === 'draw') skipDraw = true;

      // 从自己判定区摘下来（传给别人 / 进弃牌堆都要先摘）
      player.judgeZone = player.judgeZone.filter((c) => c !== card);

      if (r === 'transfer') {
        const next = nextAliveAfter(player);
        if (next && next !== player) {
          next.judgeZone.push(card);
          log(`「${card.def.name}」飘到了 ${next.name} 头上`, 'bad');
        } else {
          state.discard.push(card);
        }
      } else {
        state.discard.push(card);
      }
      sync();
    }
    return { skipPlay, skipDraw };
  }

  /**
   * 按"出手顺序"排在自己后面的下一个活人（大狗嚼传雷用）。
   * 用 turnOrder 而不是座位号 —— 2v2 里出手顺序是各队轮流的，
   * 座位 +1 的那个人不一定真的是"下一个"。
   */
  function nextAliveAfter(player) {
    const order = state.turnOrder;
    const i = order.indexOf(player.index);
    if (i < 0) return null;
    for (let k = 1; k <= order.length; k++) {
      const p = state.players[order[(i + k) % order.length]];
      if (p && p.alive && p !== player) return p;
    }
    return null;
  }

  async function drawPhase(player) {
    let base = 2 + (player.nextDrawBonus || 0);
    if (player.nextDrawBonus) {
      // 这里不写具体技能名：园区老六的「人格切换」和园区响尾蛇的「失道者」
      // 都会往 nextDrawBonus 里加数，各写各的日志在上面。
      log(`${player.name} 额外摸了 ${player.nextDrawBonus} 张牌`, 'skill');
      player.nextDrawBonus = 0;
    }

    // ----------------------------------------------------------
    //  后手补偿：**后手那一队**每个人第一次摸牌多摸一张
    // ----------------------------------------------------------
    //  先手方白赚一个回合，实测约值 3~5 个百分点（1v1）。
    //  2v2 更狠：出手顺序是顺着座位号（[0,1,2,3]），同一队连走两个回合，
    //  所以先手那一队会连着动两次才轮到对面 —— 实测先手优势能到 5~8 个点。
    //  补偿也就跟着"按队给"：后手那一队**每个人**第一次摸牌都摸 3 张。
    //
    //  ⚠️ 是"后手那一队"，不是"第二个行动的人"：2v2 里第二个行动的是
    //     先手方的队友，补给他等于给先手队又送一张（帮倒忙）。
    //  ⚠️ 1v1 时"后手那一队"就是对手一个人，和 v1.4.2 的行为一字不差。
    //
    //  ★ v1.5.2（模式 5，玩家要求）：**身份局不给后手补偿**。
    //     身份局是"固定主公先手"（不摇骰子），而且主公本来就多一滴血；
    //     再给后手那一队各补一张，等于把先手优势抹掉两次。
    //     所以这里判一下"这局有没有身份" —— 模式 1/2/3/4 一点没变。
    let comp = 0;
    if (!isIdentityGame() && player.alive && player.team !== state.firstMoverTeam && !player.gotSecondBonus) {
      comp = 1;
      player.gotSecondBonus = true;
      state.gaveSecondPlayerBonus = true; // 给测试和日志看的汇总标记
    }
    base += comp;

    // ----------------------------------------------------------
    //  ★ v1.5.2（玩家要求）：**队友倒下了 → 自己每回合多摸一张**
    // ----------------------------------------------------------
    //  「2v2 里队友一死就基本没得打了」—— 这条是给"1 打 2"那一方的**长期**补偿。
    //  和 giveComebackChance 那 2 张（一次性）配套：那个是当下救急，
    //  这个是往后每个摸牌阶段都多一点，让他真有机会翻回来。
    //
    //  ⚠️ 只在"**本来有队友、但队友全倒了**"时给：
    //     · 1v1 / 2 座（每人一队、没有队友）→ 永远不触发，模式 1 / 2 一点没变
    //     · 3 座（2 打 1）里那个"落单"的玩家本来就 0 个队友 → 也不给
    //       （不然会变成"人少反而更强"）
    //  ★ v1.5.2（模式 5，玩家报的 bug）：**身份局不发这条补偿**。
    //    "队友全倒了 → 我一个人扛着这一队，摸牌 +1" 是按**队伍**算的，
    //    而身份局的队伍是藏着的 —— 谁摸到 +1、日志里还写着"一个人扛着这一队"，
    //    等于当众承认自己跟刚倒下的那个人同队（玩家原话："反贼队友死亡，
    //    另外一个反贼依旧有摸牌 +1，这会暴露身份的"）。
    //    ⚠️ 模式 1/2/3/4 一点没变（那边队友是谁本来就看得见）。
    let loneBonus = 0;
    if (!isIdentityGame() && player.alive && isLastOfTeam(player)) {
      loneBonus = 1;
      log(`💪 ${player.name} 一个人扛着这一队，摸牌 +1`, 'skill');
    }
    base += loneBonus;

    // ----------------------------------------------------------
    //  ★ v1.5.2（隐藏关卡）：**"最终之战"形态下，双方每回合都多摸一张**
    // ----------------------------------------------------------
    //  玩家原话：「后来玩家和耄耋每回合都多摸一张牌」。
    //  这是个**全场规则**，所以写在引擎里，而不是挂在某个武将的技能上 ——
    //  技能是"自己身上生效"的，而这一条两边都要吃到。
    //
    //  判定方式是看场上有没有人进入第三阶段（`counters.maodieFinal`），
    //  不新增 state 字段：counters 本来就跟着视图发给客户端，
    //  测试也好造（直接种一个 counters 就能测）。
    let finalBonus = 0;
    if (player.alive && state.players.some((p) => p.counters && p.counters.maodieFinal)) {
      finalBonus = 1;
    }
    base += finalBonus;

    const bonus = sumFor(player, 'onDrawCount', {
      G: api, self: player, foe: foeOf(player), foes: foesOf(player), amount: base,
    });
    const total = Math.max(0, base + bonus);

    draw(player, total);
    log(`${player.name} 摸了 ${total} 张牌`, 'draw');
    if (comp > 0) log('（后手补偿：第一个回合多摸一张）', 'skill');
    if (finalBonus > 0) log('（最终之战：双方每回合都多摸一张）', 'skill');
    if (bonus > 0) log(`（其中技能/装备多摸了 ${bonus} 张）`, 'skill');
    await sleep(stepDelay);

    // ★ v1.5.2：**"别人欠他的额外牌"**（臭臭「合并同类项」发的「能量回收」）
    //   · 记在他自己身上 → 发牌的人死了也照发（效果已经生效了）
    //   · 拿到时可以转手给别人（原话："你可以把这张牌给予别人"）
    for (const owed of player.owedCards || []) {
      if (!owed || owed.turns <= 0) continue;
      owed.turns -= 1;
      const got = takeFromDeck();
      if (!got) continue;
      const card = { ...got, def: CARD_DB[owed.defId] };
      //  ★ v1.5.2（玩家报的 bug）：**"给谁"由发牌那个人决定**（比如臭臭），
      //    不是由收件人决定 —— 哪怕现在是收件人（队友）的摸牌阶段。
      //    `pickerIndex` 是发牌时记下来的；那个人死了才退回"收件人自己决定"。
      const picker =
        typeof owed.pickerIndex === 'number' ? state.players[owed.pickerIndex] : null;
      await giveCardAway(player, card, {
        text: owed.text || `额外拿到一张「${CARD_DB[owed.defId] ? CARD_DB[owed.defId].name : '牌'}」，给谁？`,
        logTag: owed.logTag || '额外牌',
        chooser: picker,
      });
      sync();
      await sleep(stepDelay);
    }
    //  发完的条目清掉（列表别无限长）
    if (player.owedCards) player.owedCards = player.owedCards.filter((o) => o && o.turns > 0);

    // ★ 「摸完牌之后」的时机 —— 老吴的「战意」靠它决定那张「吴？」给谁
    for (const { skill, fn } of hooksFor(player, 'onAfterDraw')) {
      await fn({ G: api, self: player, foe: foeOf(player), foes: foesOf(player), skill });
      sync();
      if (state.over) return;
    }
  }

  async function playPhase(player) {
    //  ★ `player.alive` 也要判：人可能在出牌阶段中途出局（逃跑，或者大狗嚼炸自己），
    //    那就别再问他了 —— 他已经不是这局的人了。
    while (!state.over && player.alive) {
      // ★ 2v2 的翻盘规则：这一回合里刚把对面一个人打死的话，
      //   出牌阶段就到此为止（见 giveComebackChance）
      if (player.skipRestOfPlay) {
        player.skipRestOfPlay = false;
        break;
      }

      const playable = player.hand.filter((c) => canPlayNow(player, c));
      const extras = collectExtras(player);

      const answer = await askCards(player, {
        kind: 'play',
        text: '出牌阶段：选一张牌使用',
        filter: (c) => playable.includes(c),
        min: 0,
        max: 1,
        confirmText: '使用',
        cancelText: '结束出牌阶段',
        extras, // 武将的主动技能按钮
      });

      // 玩家点了技能按钮
      if (answer.extra) {
        const ex = extras.find((e) => e.id === answer.extra);
        if (ex) await ex.run();
        if (state.over) return;
        continue;
      }

      if (answer.cards.length === 0) break;

      const card = answer.cards[0];

      // 问一下武将的"卡牌转化"技能要不要用
      const asId = await askConversion(player, card);
      if (asId === '__cancel__') continue; // 玩家改主意了，重新问

      // useCard 返回 false = 玩家在"选目标"那一步反悔了，牌没出，重新问
      const used = await useCard(player, card, asId);
      if (state.over) return;
      if (!used) continue;
    }

    log(`${player.name} 结束了出牌阶段`, 'phase');
  }

  async function discardPhase(player) {
    //  已经出局的人不用弃牌（逃跑 / 死在自己回合里都会走到这儿）
    if (!player.alive) return;

    const bonus = sumFor(player, 'onHandLimit', {
      G: api, self: player, foe: foeOf(player), foes: foesOf(player),
    });
    const limit = Math.max(0, player.hp + bonus);
    const excess = player.hand.length - limit;

    if (excess <= 0) {
      log(`${player.name} 手牌 ${player.hand.length} 张，没超过上限 ${limit}`, 'info');
      return;
    }

    const { cards: picked } = await askCards(player, {
      kind: 'discard',
      text: `手牌上限是 ${limit}，请弃掉 ${excess} 张`,
      filter: () => true,
      min: excess,
      max: excess,
      confirmText: `弃 ${excess} 张`,
      cancelText: null, // 必须弃，不许取消
      // 标一下这是"弃牌阶段"的问题。
      // 引擎里还有别的"弃牌"问题（装备技能的代价），
      // 测试脚本靠这个 purpose 分清是哪一个 —— 不然会把代价当成弃牌阶段误报。
      meta: { purpose: 'handLimit' },
    });

    for (const c of picked) discard(player, c);
    log(`${player.name} 弃掉了 ${picked.length} 张牌`, 'info');
    await sleep(stepDelay);
  }

  // ----------------------------------------------------------
  //  一个回合
  // ----------------------------------------------------------
  async function runTurn(player) {
    const foe = foeOf(player);
    const foes = foesOf(player);
    state.phase = null;
    player.flags = {};        // 清空"本回合用过没"的小本子
    player.drunk = false;
    player.usedThisTurn = {};

    log(`\n🐾 第 ${state.turn + 1} 回合 · ${player.name} 的回合`, 'turn');
    sync();
    await sleep(stepDelay);

    // 回合开始时
    for (const { skill, fn } of hooksFor(player, 'onTurnStart')) {
      await fn({ G: api, self: player, foe, foes, skill });
    }
    if (state.over) return;

    // 判定
    await enterPhase(player, PHASE.JUDGE);
    const { skipPlay, skipDraw } = await resolveJudgeZone(player);
    await exitPhase(player, PHASE.JUDGE);
    if (state.over) return;

    // 摸牌
    if (skipDraw) {
      log(`${player.name} 饿得没力气，跳过摸牌阶段`, 'bad');
      await sleep(stepDelay);
    } else {
      await enterPhase(player, PHASE.DRAW);
      await drawPhase(player);
      await exitPhase(player, PHASE.DRAW);
      if (state.over) return;
    }

    // 出牌
    if (skipPlay) {
      log(`${player.name} 被猫薄荷迷住了，跳过出牌阶段`, 'bad');
      await sleep(stepDelay);
    } else {
      await enterPhase(player, PHASE.PLAY);
      await playPhase(player);
      await exitPhase(player, PHASE.PLAY);
      if (state.over) return;
    }

    // 弃牌
    await enterPhase(player, PHASE.DISCARD);
    await discardPhase(player);
    await exitPhase(player, PHASE.DISCARD);
    // ↑ 注意：园区老六的「人格切换」挂在 onTurnEnd 上，不是这里的阶段结束。
    //   因为被「猫薄荷」跳过出牌阶段时，出牌阶段根本不会开始，
    //   onPhaseEnd 也就不会触发 —— 那样"没出杀"反而拿不到补偿，说不通。

    // 结束
    state.phase = PHASE.END;
    for (const { skill, fn } of hooksFor(player, 'onTurnEnd')) {
      await fn({ G: api, self: player, foe, foes, skill });
    }
    state.phase = null;
    sync();
  }

  // ----------------------------------------------------------
  //  对外的引擎 API（卡牌和武将技能通过它来操作游戏）
  // ----------------------------------------------------------
  const api = {
    state,
    random,
    log,
    notify,
    draw,
    discard,
    discardRandom,
    stealRandom,
    stealEquip,
    equipmentOf,
    takeFromDiscard,
    takeFromDeck,
    heal,
    damage,
    judge,
    askCards,
    askResponse,
    askOne,
    askOption,
    // ★ v1.5.2：看一眼牌堆顶几张（肥波「100连抽」）—— 只看不动，牌还在牌堆上
    peekDeck,
    // ★ v1.5.2：把一张牌给出去（自己留着 / 给场上任何活人）—— 「战意」和
    //   「合并同类项」欠的牌都走它（见 heroes.js）
    giveCardAway,
    scratchDodgeCount,
    // 这张牌现在能不能用（出牌阶段判断"能点什么"靠它）
    canPlayNow,
    // 把一张牌真正"用出去"（装备牌、以及"当作某张牌用"的技能都会走它）
    useCard,
    // 出牌阶段能点的技能按钮（武将技能 + 已装备的牌）
    collectExtras,
    // 装备相关
    equip,
    unequip,
    // ★ v1.5.2：塞一件虚拟装备（隐藏关卡的「神圣的古战场」）
    grantVirtualEquip,
    hooksFor,
    sumFor,
    // 抓挠相关（武器技能要用）
    canStillScratch,
    countScratchUse,
    askScratchDodged,
    fireScratchDamage,
    foeOf,
    foesOf,
    alliesOf,
    alivePlayers,
    aliveTeams,
    checkGameOver,
    // 认输 / 逃跑（界面上的「逃跑」按钮用）
    resign,
    // 结算判定区（延时锦囊）。导出主要是给自动化测试用 ——
    // 用它测"大狗嚼有没有传给下一个人"才不会被 start() 的发牌干扰
    resolveJudgeZone,
    // 摸牌阶段 + "这一队只剩我一个了没"（v1.5.2 的"队友死了多摸一张"）。
    // 导出同样是为了测试：不导的话只能整局跑起来、靠手牌数间接猜
    drawPhase,
    isLastOfTeam,
    // 选目标（2v2 出「抓挠」之前要问"挠谁"）
    askTarget,
    resolveTarget,
    targetCandidates,
    // 卡牌变形（"要不要把这张牌当作另一张用"）—— 出牌阶段里的一步，
    // 导出主要是给自动化测试用：不然测"黑桃当抓挠""黑牌当歪头"只能自己伪造
    askConversion,
    findConversion,
    // 距离 / 攻击范围 / 坐骑
    distanceFrom,
    baseDistance,
    attackRange,
    inRange,
    removeFromHand,
    sync,
  };

  // ----------------------------------------------------------
  //  开局
  // ----------------------------------------------------------
  async function start() {
    // 4 人局回合数会变多（伤害要摊给两个敌人），所以上限按人数放大。
    // 2 人时就是 80，和以前一模一样 —— 模式 1 的兜底行为不能变。
    const limit = maxTurns ?? 80 * (playerCount / 2);

    log(`种子 ${seed}（遇到 bug 把这个数字告诉我，我能复现）`, 'info');
    for (const p of state.players) {
      log(`${p.name}：${p.hero.emoji} ${p.hero.name} · 气势值 ${p.maxHp}`, 'info');
    }

    for (const p of state.players) draw(p, 4);
    log(
      playerCount === 2
        ? '双方各摸 4 张牌，开打！'
        : `${playerCount} 只猫各摸 4 张牌，开打！`,
      'turn'
    );
    log(`${state.players[state.turnOrder[turnCursor]].name} 先手`, 'info');
    sync();
    await sleep(stepDelay);

    // 主循环
    while (!state.over) {
      // 兜底：万一双方都杀不死对方（技能设计失衡），
      // 不能让程序永远转下去，判平局收场。
      if (state.turn >= limit) {
        state.over = true;
        state.winner = null;
        state.winnerTeam = null;
        state.isDraw = true;
        log(`⚖️ 打了 ${limit} 个回合还没分出胜负，判为平局`, 'bad');
        break;
      }

      const player = state.players[state.turnPlayerIndex];
      if (player.alive) {
        await runTurn(player);
      }
      if (state.over) break;
      state.turn++;
      // 顺着"各队轮流"的顺序往下走。
      // 2 人时 turnOrder 就是 [0, 1]，效果和以前那句 `1 - idx` 完全一样。
      state.turnCursor = (state.turnCursor + 1) % state.turnOrder.length;
      state.turnPlayerIndex = state.turnOrder[state.turnCursor];
    }

    state.phase = null;
    sync();
  }

  return { state, start, api };
}

// ══════ src/ai/jimidou.js ══════
// ============================================================
//  jimidou.js —— AI 对手的大脑
// ============================================================
//
//  【设计思路：启发式打分，不用大模型】
//
//  为什么不用 AI 大模型来打牌？
//    · 太慢：每次出牌要等好几秒
//    · 太贵：一局要调用几十次
//    · 最关键：它会违反规则。规则引擎说"这张牌现在不能出"，
//      大模型还是会说"我要出这张"，游戏直接崩掉。
//
//  所以：规则引擎负责"算什么合法"，这里只负责"在合法的里面挑最好的"。
//  大模型更适合拿来做「哈基米的骚话台词」，那是另一回事。
//
//  【AI 唯一能看到的】
//  只有它自己的手牌 + 公开信息（双方气势值、手牌数量、弃牌堆）。
//  它看不到你的手牌 —— 这叫"不完全信息"，和真人打牌一样。
// ============================================================




// ------------------------------------------------------------
//  骚话台词库（纯装饰，想加自己随便加）
// ------------------------------------------------------------
const TAUNTS = {
  scratch: ['哈——！', '看爪！', '这就是哈基米的实力', '喵呜！'],
  dodge: ['吴？', '欸？', '你打不到我~', '溜了溜了'],
  hurt: ['嗷！', '你居然敢打我', '记住了'],
  win: ['哈基米，赢！', '就这？'],
};

// ============================================================
//  造一个 AI 决策器
// ============================================================
/**
 * @param {object} opts
 *   difficulty  'easy' | 'normal' | 'hard'
 *               只影响"判断准不准"，不影响它作弊（它永远不作弊）
 */
function createJimidou(opts = {}) {
  const { difficulty = 'normal' } = opts;

  // 难度对应的"犯傻概率"：越高越容易漏掉该出闪的机会
  const sloppiness =
    difficulty === 'easy' ? 0.45 : difficulty === 'hard' ? 0.0 : 0.15;

  // ---------- 小工具 ----------
  const countId = (p, id) => p.hand.filter((c) => c.def.id === id).length;
  const hasId = (p, id) => p.hand.some((c) => c.def.id === id);

  function taunt(G, me, key) {
    const lines = TAUNTS[key];
    if (!lines) return;
    if (!G.random.chance(0.35)) return;
    // 署名用武将名，不用「园区基米斗」（那是游戏名）
    G.log(`「${G.random.pick(lines)}」 —— ${me.name}`, 'taunt');
  }

  // ==========================================================
  //  决策入口
  // ==========================================================
  async function decide(G, me, question) {
    // "当前最该关注的那个敌人"（1v1 时就是唯一那个）。
    // 2v2 里真正的目标选择交给 targetScore，这里只是个默认值。
    const foe = G.foeOf(me);

    switch (question.kind) {
      case 'play':
        return decidePlay(G, me, foe, question);
      case 'discard':
        return decideDiscard(G, me, question);
      case 'option':
        return decideOption(G, me, foe, question);
      default:
        return decideRespond(G, me, foe, question);
    }
  }

  // ==========================================================
  //  0) 纯选择题（比如"要不要把这张牌变形使用"）
  // ==========================================================
  function decideOption(G, me, foe, question) {
    const opts = question.options || [];

    // ---- 铁索连环："还要再连一只吗"（v1.5.2）----
    //  还有值得连的人就继续（比如 2v2 里第二个敌人），否则收手 ——
    //  免得 AI 手一抖把自己或队友连进去。
    if (question.meta && question.meta.purpose === 'wuji-more') {
      const list = question.meta.candidates || [];
      return list.some((idx) => chainScore(G, me, idx) > 0) ? 'more' : 'stop';
    }

    // ---- 铁索连环：连谁？（v1.5.2）----
    //  这道题**不能**用 targetScore：那个表算的是"打谁最疼"，
    //  而横置的逻辑完全不一样 —— 连敌人是**给他挂个炸弹**（等着火杀/雷杀溅射），
    //  连自己 / 队友是纯亏，反过来"把已经连上的自己解开"才是好事。
    if (question.meta && question.meta.purpose === 'chain') {
      let best = null;
      let bestScore = -Infinity;
      for (const o of opts) {
        if (o.id === '__cancel__') continue;
        const s = chainScore(G, me, Number(o.id));
        if (s > bestScore) {
          bestScore = s;
          best = o;
        }
      }
      // 一个值得连的都没有（比如敌人都已经连上了）→ 能取消就取消
      if (!best || bestScore <= 0) {
        const cancel = opts.find((o) => o.id === '__cancel__');
        return cancel ? '__cancel__' : (best ? best.id : opts[0].id);
      }
      return best.id;
    }

    // ---- 选目标：这道题引擎不会给 aiScore，得自己算 ----
    //  （引擎故意不懂"谁更好打"这种策略判断）
    if (question.meta && question.meta.purpose === 'target') {
      let best = opts[0];
      let bestScore = -Infinity;
      for (const o of opts) {
        if (o.id === '__cancel__') continue; // 取消永远不是首选
        const s = targetScore(G, me, Number(o.id));
        if (s > bestScore) {
          bestScore = s;
          best = o;
        }
      }
      return best.id;
    }

    // 如果选项自带 aiScore（武将作者给的判断），就选分数最高的
    const scored = opts.filter((o) => typeof o.aiScore === 'number');
    if (scored.length > 0) {
      let best = scored[0];
      for (const o of scored) if (o.aiScore > best.aiScore) best = o;
      return best.id;
    }

    const ids = opts.map((o) => o.id);
    // 能正常使用就正常使用，别白白浪费每回合一次的技能
    if (ids.includes('normal')) return 'normal';
    if (ids.includes('convert')) return 'convert';
    return ids[0];
  }

  // ==========================================================
  //  0.4) ★ v1.5.2（模式 5）"我知道谁是自己人吗？"
  // ==========================================================
  /**
   * 判断"这个人是不是我可以认下的同伴"。
   *
   * 【为什么不能直接看 team】
   *   身份局里队伍是**从身份推出来的**，而身份是藏着的 —— AI 直接读 `team`
   *   就等于偷看身份：反贼之间明明是互相不认识的（标准规矩下会互砍），
   *   一读 team 就变成"我们俩一伙的"，一眼就被玩家看出来（玩家原话："不会演"）。
   *
   * 【身份局里 AI 只准用**公开信息**】
   *   · 主公是明牌 → 主公方的 AI（主公自己 / 忠臣）认主公是自己人；
   *     主公自己当然也认自己
   *   · 别的身份谁也不知道 → 一律当成"不认识的人"
   *     （所以反贼 AI 会砍反贼、忠臣 AI 也可能误伤主公以外的人、
   *       内奸更是谁都不认 —— 这就是"演"）
   *
   * ⚠️ 不是身份局（模式 1/2/3/4）→ 还是老规矩按 team 算，一个字节都没变。
   */
  function knownAlly(G, me, other) {
    if (!other) return false;
    if (other === me) return true;
    const identity = G.state.players.some((p) => p.role);
    if (!identity) return other.team === me.team;
    // 身份局：只有"主公"是公开的，主公方自己人认他
    const iAmLordSide = me.role === 'lord' || me.role === 'loyal';
    return iAmLordSide && other.role === 'lord';
  }

  // ==========================================================
  //  0.5) 打谁？—— 2v2 才用得上
  // ==========================================================
  /**
   * 给一个敌人打分，越高越想打他。
   *
   * ⚠️ **只准看公开信息**：气势值、手牌**张数**、装备、座位。
   *    绝对不许看 `hand` 里的具体牌 —— 那是作弊，
   *    和人打牌时偷看别人手牌没区别。
   *
   * 打分逻辑（按重要性排）：
   *   1. 能一击打死 → 极高
   *   2. 血越少越优先（离死越近）
   *   3. 手牌越少越好打（他不容易有「吴？」）
   *   4. 身上装备越好越值得打（打中了能用「生物耋？！」拆）
   *   5. 血多的稍微降一点优先级（别给满血的人挠痒痒）
   */
  function targetScore(G, me, index) {
    const t = G.state.players[index];
    if (!t || !t.alive) return -Infinity;

    let s = 0;

    // 1) 这一下能收人头
    if (t.hp <= 1) s += 100;

    // 2) 血越少越优先
    s += (t.maxHp - t.hp) * 12;

    // 3) 手牌少 = 躲不掉
    s += Math.max(0, 4 - t.hand.length) * 5;

    // 4) 装备值不值得拆
    const gear = ['weapon', 'armor', 'horseMinus', 'horsePlus']
      .filter((k) => t.equip && t.equip[k]).length;
    s += gear * 4;

    // 5) 满血的稍微降一点（先削已经受伤的更划算）
    if (t.hp >= t.maxHp) s -= 6;

    // 6) 一点点随机，免得每局都打得一模一样
    s += G.random.int(5);

    return s;
  }

  /**
   * 「吴基之谈」（铁索连环）连谁？—— 分数越高越想连他。
   *
   * 横置的本质是"挂一个定时炸弹"：谁被连着，我方打出火焰/雷电伤害时他就跟着挨。
   * 所以：
   *   · 敌人**没连上** → 连他（+40）
   *   · 敌人**已经连上** → 千万别再点一次（那是帮他解开，-60）
   *   · 自己被连着 → 解开自己（+35）；没连着 → 死也别连自己（-100）
   *   · 队友：连着就解开（保护），没连就别连（会溅到他）
   */
  function chainScore(G, me, index) {
    const t = G.state.players[index];
    if (!t || !t.alive) return -Infinity;

    if (t === me) return t.chained ? 35 : -100;
    //  ★ v1.5.2（模式 5）：要用"认得的自己人"，不能直接读 team（见 knownAlly）
    const isAlly = knownAlly(G, me, t);
    if (isAlly) return t.chained ? 25 : -40;

    // 敌人
    return t.chained ? -60 : 40;
  }

  // ==========================================================
  //  1) 出牌阶段：给每张能用的牌打分，用最高的那张
  // ==========================================================
  function decidePlay(G, me, foe, question) {
    const legal = me.hand.filter(question.filter);
    const extras = question.extras || [];

    // 先看武将的主动技能值不值得发动（比如园区响尾蛇的「失道者」）
    for (const ex of extras) {
      if (!ex.aiScore) continue;
      if (ex.aiScore({ G, self: me, foe }) > 0) {
        return { cards: [], extra: ex.id };
      }
    }

    if (legal.length === 0) return [];

    let best = null;
    let bestScore = 0; // 分数 <= 0 就结束出牌阶段

    for (const card of legal) {
      const s = scorePlay(G, me, foe, card);
      if (s > bestScore) {
        bestScore = s;
        best = card;
      }
    }

    if (!best) return [];

    if (best.def.id === 'scratch') taunt(G, me, 'scratch');
    return [best];
  }

  /**
   * 打分表。数字越大越想用。
   * 想调 AI 性格，改这里的数字就行。
   *   · 把「抓挠」调高 → 变成莽夫猫
   *   · 把「嚼口香糖」调高 → 变成苟命猫
   */
  function scorePlay(G, me, foe, card) {
    const base = scorePlayAsIs(G, me, foe, card);
    // ★ v1.5.2：变形技能（狗哥「江湖规矩」→ 歪头、响尾蛇「往日荣光」→ 抓挠）
    //
    //   以前 AI 只按"牌本身"打分，于是**它从来不主动变形**：
    //   比如手里一张满血时毫无用处的 ♠「嚼口香糖」（-1 分），
    //   明明可以当「抓挠」打出去换 1 点伤害，AI 却当它是废牌。
    //   （这也是响尾蛇新技能实测没效果的原因 —— 技能没问题，是没人用。）
    //
    //   所以：如果这张牌"变成别的牌用"分数更高，就按那个分数算。
    //   真正出牌时引擎会再问一句"要不要变形"，AI 的 decideOption 默认选 convert。
    const conv = bestConvertedScore(G, me, foe, card);
    return Math.max(base, conv);
  }

  /**
   * 这张牌"变形之后"能打多少分？没有变形技能 / 不值得变就返回 -1。
   *
   * ⚠️ **只认"变出来是「抓挠」"的变形**（响尾蛇「往日荣光」、老吴「战意」）。
   *    为什么不管「江湖规矩」（狗哥：任意牌 → 歪头）？
   *      · 「歪头」是**赌博牌**：输了要挨 1 点，而手里那些废牌留着当
   *        弃牌阶段的"口粮"是有价值的 —— 这种出牌没有确定收益
   *      · 实测过"放开到所有变形"那一版：300×300 两次跑下来，
   *        狗哥 37% / 37%、老吴 62% / 63%、响尾蛇 39% / 40% —— **差别全在噪声里**。
   *        既然量不出好处，就选保守的那个（别让 AI 拿废牌去赌）
   *    「废牌 → 抓挠」不一样：那是**确定**的 1 点输出，稳赚。
   *
   * `can()` 是武将技能自己写的判断（次数、花色、这张牌本身是不是抓挠），
   * 必须原样调它 —— 不然 AI 会以为一张红桃也能用「往日荣光」。
   */
  function bestConvertedScore(G, me, foe, card) {
    let best = -1;
    for (const skill of me.hero.skills) {
      const cv = skill.convert;
      if (!cv || cv.to !== 'scratch') continue;
      let ok = false;
      try {
        ok = !!cv.can({ G, self: me, foe, foes: G.foesOf(me), card });
      } catch {
        ok = false;
      }
      if (!ok) continue;
      const target = CARD_DB[cv.to];
      if (!target) continue;
      // 变形后的牌按"它自己"打分（抓挠就是抓挠的分）
      best = Math.max(best, scorePlayAsIs(G, me, foe, { ...card, def: target }));
    }
    return best;
  }

  /** 按"这张牌本身是什么"打分（原来的 scorePlay，逻辑一个字没动） */
  function scorePlayAsIs(G, me, foe, card) {
    const id = card.def.id;
    const lowHp = me.hp <= 2;

    // ★ 2v2 有不止一个敌人，所以"对方"的这几个数字要按**最好打的那个**算 ——
    //   比如"能斩杀"应该是"有哪个敌人只剩 1 点"，而不是"第一个敌人剩 1 点"。
    const foes = G.foesOf(me);
    const reachable = (card.def.usesRange || card.def.maxDistance)
      ? G.targetCandidates(me, card.def)
      : foes;
    const pool = reachable.length ? reachable : foes;
    const foeHand = Math.min(...pool.map((f) => f.hand.length));
    const canKill = pool.some((f) => f.hp <= 1);
    // 对方身上有没有装备（「生物耋？！」的加成、「粑粑博弈」的目标都要看）
    const foeGear = pool.some((f) => Object.keys(f.equip || {}).length > 0);

    // 装备牌单独一套判断
    if (card.def.type === CARD_TYPE.EQUIP) return scoreEquip(G, me, card);

    switch (id) {
      // 摸两张牌，永远不亏
      case 'recycle':
        return 100;

      // 封掉对方整个出牌阶段，非常强
      case 'catnip':
        return 92;

      // 封掉对方摸牌阶段：不如封出牌阶段狠，但也是白赚一张牌差
      case 'jie':
        return 78;

      // 火攻：能烧 1 点，但要先弃一张同花色的牌 = 两张换一点伤害。
      // 手里牌多才划算；只剩一张牌的时候绝对不该用（那等于白送）。
      case 'shaomi':
        if (foeHand === 0) return -1;
        return me.hand.length >= 4 ? 76 : me.hand.length >= 3 ? 58 : -1;

      // 闪电（大狗嚼）：贴自己头上赌一把。
      // 中了 3 点很赚，没中就传给下一个人 —— 但**血少的时候不赌**
      // （吃到 3 点会直接从 3 血变濒死，这买卖不划算）。
      case 'dagou':
        if (me.judgeZone.some((c) => c.def.id === 'dagou')) return -1;
        return me.hp >= 3 ? 55 : -1;

      // 回血：血越少越想用
      case 'gum':
        if (me.hp >= me.maxHp) return -1;
        return lowHp ? 96 : 68;

      // 偷牌：对方有牌才值得（偷装备的分数略低于拆，因为拿到手还得再穿一次）
      case 'bigRat':
        return foeHand > 0 || foeGear ? 82 : -1;

      // 拆牌（过河拆桥）：不限距离，而且拆装备是确定收益 —— 很好用
      // 手里捏着这张的时候，对方穿了好装备就要倒霉
      case 'baba':
        if (foeGear) return 88;              // 能拆装备 → 很值
        return foeHand > 0 ? 74 : -1;        // 只能拆张手牌 → 一般

      // 扫尾：手里有抓挠才值得先喝
      case 'tailSweep':
        return hasId(me, 'scratch') ? 62 : -1;

      // 抓挠：能斩杀就极其优先
      case 'scratch':
        return canKill ? 130 : 55;

      // 火杀 / 雷杀（v1.5.2）：就是抓挠，但伤害带属性 ——
      // 场上有人被「吴基之谈」连着的时候，这一下等于**打两个人**，
      // 所以比普通抓挠更值得用；没人连着的时候和抓挠一模一样。
      case 'yehuo':
      case 'leisha': {
        const linkedFoes = G.foesOf(me).filter((f) => f.alive && f.chained).length;
        if (canKill) return 130;
        return linkedFoes > 0 ? 88 : 55;
      }

      // 铁索连环（v1.5.2）：单独拿着是废牌，是**配合牌**。
      // 手里有火杀/雷杀/烧基米才值得连；否则不如重铸掉。
      case 'wuji': {
        const linked = G.state.players.filter((p) => p.alive && p.chained).length;
        const hasElement = ['yehuo', 'leisha', 'shaomi'].some((id) => hasId(me, id));
        if (linked >= 2) return -1;          // 都连上了，再来一张只能帮人解开
        if (hasElement) return 72;           // 有属性伤害手段 → 连敌人，等着炸
        return 26;                           // 没配合：勉强用一下（或者重铸）
      }

      // v1.4.4 两张全场牌：一下能打到**每一个**敌人，而且不占"每回合一张抓挠"的名额。
      // 对面有人只剩 1 点气势时就是一张斩杀牌，所以给得很高。
      case 'shidao':
      case 'zhanta': {
        const all = G.foesOf(me).filter((f) => f.alive);
        if (all.length === 0) return -1;
        if (all.some((f) => f.hp <= 1)) return 120; // 能收人头
        return all.length >= 2 ? 70 : 58;           // 人越多越值
      }

      // 歪头：手里抓挠比对方多才敢拼
      // （它不知道你手里有几张，这是它的"猜测"）
      case 'headTilt': {
        const mine = countId(me, 'scratch');
        if (mine === 0) return -1;
        // 血少的时候不拼，血多的时候随便拼
        if (lowHp && mine < 2) return -1;
        return mine >= 2 ? 70 : 40;
      }

      default:
        return -1;
    }
  }

  /**
   * 装备牌的打分。
   *
   * 【思路】装备是"永久收益"，所以空槽的时候几乎无脑穿。
   * 已经有装备了就要犹豫：换装等于把旧的那张扔进弃牌堆（虽然是白赚的），
   * 但会花掉一张手牌 —— 手牌本来就紧张的时候不值得折腾。
   */
  function scoreEquip(G, me, card) {
    const cur = me.equip[card.def.slot];

    // 2v2 专属：够不着后排的时候，武器和进攻坐骑的价值翻倍。
    // 4 个人围一圈，默认攻击范围只有 1，所以"隔着一个人打不到"
    // 是 2v2 里最常见的窘境 —— 一件远程武器能直接解掉它。
    const outOfReach = G.foesOf(me).some((f) => !G.inRange(me, f));
    const isRangeGear = !!card.def.range || card.def.horse === -1;

    if (!cur) {
      if (outOfReach && isRangeGear) return 95; // 空槽 + 正好能解决够不着的问题
      return 80;                                // 空槽：白捡的提升，很值
    }
    if (cur.def.id === card.def.id) return -1;  // 同款，穿了也是白穿

    // 换装：如果新装备能解决"够不着"，那就很值得
    if (outOfReach && isRangeGear && !(cur.def.range || cur.def.horse === -1)) {
      return 88;
    }
    return me.hand.length >= 5 ? 45 : 18;
  }

  // ==========================================================
  //  2) 被动响应：要不要打出某张牌？
  // ==========================================================
  function decideRespond(G, me, foe, question) {
    //  ⚠️ 优先用引擎算好的合法牌：有些牌是"当作这张牌用"才进合法的
    //    （刀哥的「三年不发情」：红桃牌当「吴？」），按 filter 重算会漏掉。
    const legal = question.legalCards || me.hand.filter(question.filter);
    if (legal.length === 0) return [];

    // ---- 支付代价（比如吕布「无双」要弃一张牌）：给最不值钱的那张 ----
    if (question.meta && question.meta.purpose === 'cost') {
      return [cheapest(me, legal)];
    }

    // ---- 救队友（2v2 才有）：这笔账要算清楚 ----
    //  救人 = 白扔一张牌换队友一条命。值不值得看两件事：
    //    · 队友是不是还有用（一起打才有输出）
    //    · 自己手牌够不够用（手牌就是命）
    //  自己救自己走的是下面那条"命最重要"，不受这里影响 ——
    //  所以 1v1 的 AI 行为一个字都没变。
    if (question.meta && question.meta.purpose === 'rescue' && !question.meta.selfRescue) {
      const t = G.state.players[question.meta.targetIndex];
      if (!t) return [];

      //  ★ v1.5.2（模式 5）：身份局里**只救自己认得的人** ——
      //    反贼互相不认识，所以不会掏「嚼口香糖」去救另一个反贼
      //    （这就是玩家要的"演"：不靠偷看队伍来配合）。
      //    ⚠️ 非身份局走下面那套老逻辑，2v2 一个字没变。
      if (G.state.players.some((p) => p.role) && !knownAlly(G, me, t)) return [];

      // 只剩这一个队友了 → 他死了我就得一个人打两个，救的优先级更高
      const alliesLeft = G.state.players.filter((a) => a !== me && knownAlly(G, me, a) && a.alive).length;
      const alone = alliesLeft <= 1;

      const worth = me.hand.length >= 4 || (alone && me.hand.length >= 3);
      if (!worth) return [];

      // 优先用「嚼口香糖」；「扫尾」是拿来加伤害的，救人算浪费
      const gum = legal.find((c) => c.def.id === 'gum');
      return [gum || legal[0]];
    }

    //  ⚠️ v1.5.2：判断"这是在回应哪种牌"不能只看第一张牌的 id ——
    //    · 火杀/雷杀有 `countsAs: 'scratch'`，它们就是抓挠（顶「战争践踏」「歪头」）
    //    · 刀哥的红桃当「吴？」是"转化牌"，那张牌本身可能是「嚼口香糖」
    //    所以：先看牌自己的 countsAs；实在对不上引擎问的 needId 时，
    //    就说明手里这批牌是"顶成 needId 用"的转化牌，按 needId 算。
    const effId = (() => {
      const ids = new Set(legal.map((c) => c.def.countsAs || c.def.id));
      const need = question.needId;
      if (need && !ids.has(need)) return need;
      return legal[0].def.countsAs || legal[0].def.id;
    })();

    // ---- 濒死自救：命最重要，有什么用什么 ----
    if (me.hp <= 0) return [legal[0]];

    switch (effId) {
      // 吴？ —— 躲抓挠。（园区吕布的「无双」一次要两张）
      case 'dodge': {
        const need = question.min || 1;
        if (legal.length < need) return [];

        let willing;
        if (me.hp <= 2) {
          willing = true; // 血少了必须躲
        } else if (countId(me, 'dodge') >= need + 1) {
          willing = true; // 手里闪多，大方一点
        } else {
          // 否则有一定概率舍不得用（难度越低越容易犯傻）
          willing = G.random.chance(1 - sloppiness);
        }

        return willing ? legal.slice(0, need) : [];
      }

      // 抓挠 —— 「歪头」对峙中顶回去（也可能是在顶「战争践踏」）
      case 'scratch': {
        // 拼到底：手里还有就出。
        // ⚠️ v1.5.2：`question.min` 可能是 2（吕布用「歪头」时，对方每次要交两张），
        //    以前这里固定只返回一张 —— 那样 AI 永远"顶不住"，等于白送 1 点伤害。
        return legal.slice(0, question.min || 1);
      }

      // 哈气打断 —— 值不值得抵消对方的锦囊
      case 'hissStop': {
        // 双保险：绝不打断自己的牌。
        // 引擎其实已经不问了（见 engine.js 的 tryNullify），
        // 但这里再挡一层 —— 万一以后引擎改动，也不会出现
        // "AI 打断自己的大号老鼠行动" 这种纯亏操作。
        if (question.meta?.isOwnCard) return [];
        if (question.meta?.casterIndex === me.index) return [];

        const meta = question.meta || {};

        // ---- ★ v1.5.2（玩家定的规则）：**绝不打自己队友的锦囊** ----
        //  2v2 里队友用锦囊牌（冲敌人去的「大号老鼠」「粑粑博弈」「歪头」，
        //  或者全场牌「屎到淋头」）—— 打掉它都是**团队负收益**：
        //  白扔一张哈气打断，还把队友的收益一起抹掉。
        //  （就算是全场牌：队友那张会逼着两个敌人各交一张牌/吃 1 点，
        //    我这边最多挨 1 点，抵掉它反而亏。）
        //  ⚠️ 1v1 里没有队友（每队一人），这条永远不触发 —— 模式 1/2 不变。
        const caster =
          typeof meta.casterIndex === 'number' ? G.state.players[meta.casterIndex] : null;
        //  ★ v1.5.2（模式 5）：身份局里只有"认得的人"才手下留情（见 knownAlly）。
        //    反贼之间不认识 → 反贼 AI 可能真的去打断另一个反贼的锦囊（会"演"）。
        if (caster && caster !== me && knownAlly(G, me, caster)) return [];

        // ---- 这是"打断一张「哈气打断」"（连锁反制）----
        //  规则：哈气打断本身也是锦囊，可以被再打断。
        //  打回去的话，**最外层那张牌会重新生效**。所以要不要打，取决于
        //  "最外层那张牌对我（和我这一队）有没有利"：
        //    · 那是我自己/队友用的牌 → 当然要打回去，让它生效
        //    · 那张牌是冲我来的（我被偷被贴） → 别打，让它继续被抵消
        //    · 跟我没关系 → 基本不管
        if (meta.cardId === 'hissStop') {
          if (meta.rootCasterIndex === me.index) return [legal[0]];
          //  ★ 队友用的最外层牌 → 打回去让队友的牌生效（不然敌人一张打断
          //    就把我方的收益抹了）。这是上面那条队友规则的"另一半"。
          const rootCaster =
            typeof meta.rootCasterIndex === 'number'
              ? G.state.players[meta.rootCasterIndex]
              : null;
          if (rootCaster && rootCaster !== me && knownAlly(G, me, rootCaster)) return [legal[0]];
          const rootIsBad = scoreNullify(me, meta.rootCardId) > 0.5;
          if (rootIsBad) return []; // 那张牌对我不利，抵消着挺好
          return G.random.chance(0.15) ? [legal[0]] : [];
        }

        const targetCard = meta.cardId;
        const score = scoreNullify(me, targetCard);
        return G.random.chance(score) ? [legal[0]] : [];
      }

      default:
        return [];
    }
  }

  /**
   * 值不值得用「哈气打断」。返回 0~1 的概率。
   * 猫薄荷最该打断（不然整个出牌阶段没了）。
   */
  function scoreNullify(me, cardId) {
    switch (cardId) {
      case 'catnip':
        return 1.0;
      case 'jie':
        return 0.85; // 封摸牌阶段也要打断
      case 'shidao':
      case 'zhanta':
        return 0.75; // 全场牌：不打断就得交一张牌或者吃 1 点
      case 'shaomi':
        return 0.6; // 顶多 1 点伤害，别浪费两张牌
      case 'recycle':
        return me.hp <= 2 ? 0.35 : 0.75;
      case 'bigRat':
        return 0.6;
      case 'wuji':
        return 0.3; // 铁索连环：被连上本身不掉血，不值得为它扔一张打断
      case 'headTilt':
        return me.hp <= 2 ? 0.7 : 0.3;
      default:
        return 0.4;
    }
  }

  // ==========================================================
  //  3) 弃牌阶段：把最不值钱的先扔掉
  // ==========================================================
  //  数字 = 保留价值。越小越先被扔掉。
  const KEEP_VALUE = {
    dodge: 9,      // 保命
    gum: 8,        // 回血
    scratch: 7,    // 输出
    catnip: 7,     // 封锁
    jie: 6,        // 封锁（封摸牌）
    hissStop: 6,   // 干扰
    recycle: 6,    // 过牌
    bigRat: 5,
    shaomi: 5,     // 要配花色，稍难用
    shidao: 7,     // 全场 1 点，很值钱
    zhanta: 6,
    dagou: 4,      // 赌运气，随手扔
    headTilt: 4,
    tailSweep: 3,
    //  v1.5.2：火杀/雷杀就是抓挠（还带属性），和抓挠一个价；
    //  铁索连环是配合牌，单独留着没用（宁可拿去重铸）
    yehuo: 7,
    leisha: 7,
    wuji: 3,
  };

  /**
   * 这张牌留着有多值钱？
   * 装备牌要看"身上有没有" —— 空槽的装备是宝贝，
   * 同款的第二张就是纯废牌（穿了也白穿，只能当弃牌代价）。
   */
  function keepValue(me, card) {
    if (card.def.type === CARD_TYPE.EQUIP) {
      const cur = me.equip[card.def.slot];
      if (!cur) return 7;                        // 空槽，穿上就是白赚
      if (cur.def.id === card.def.id) return 1;   // 同款，废牌
      return 3;                                  // 有装备了，换装价值一般
    }
    return KEEP_VALUE[card.def.id] ?? 0;
  }

  /** 手里最不值钱的那张（付代价时优先扔它） */
  function cheapest(me, legal) {
    return [...legal].sort((a, b) => keepValue(me, a) - keepValue(me, b))[0];
  }

  function decideDiscard(G, me, question) {
    const legal = me.hand.filter(question.filter);
    const need = question.min;
    const foe = G.foeOf(me);
    const purpose = question.meta && question.meta.purpose;

    // 按保留价值从低到高排，扔最前面的
    const sorted = [...legal].sort((a, b) => keepValue(me, a) - keepValue(me, b));

    // ---- 「基米不识字」：弃两张牌硬打中 ----
    // 已经骗掉对方一张「吴？」了，所以这其实是"两张换一点伤害"。
    // 能收人头、或者手牌多得溢出来的时候才划算。
    if (purpose === 'force') {
      if (foe.hp <= 1) return sorted.slice(0, need);       // 这一下能打死
      if (me.hand.length >= 5) return sorted.slice(0, need); // 手牌富裕
      return [];
    }

    // ---- 「提抖放哈」：弃三张牌防止这次伤害 ----
    // 三张牌换一次免伤，太贵了。只有"不挡就死"才考虑。
    // 而且如果手里有「嚼口香糖」，宁可挨打进濒死再吃糖 —— 那样只花一张。
    if (purpose === 'prevent') {
      const dmg = (question.meta && question.meta.damage) || 1;
      if (me.hp > dmg) return [];                 // 不致命，不挡
      if (hasId(me, 'gum') && me.hand.length < 6) return []; // 有糖，挨了再吃
      return sorted.slice(0, need);
    }

    return sorted.slice(0, need);
  }

  return decide;
}

// ============================================================
//  assets.js —— 一次性问服务器"现在有哪些素材"
// ============================================================
//
//  图片（art.js）和音频（audio.js）都要知道"有哪些文件可用"。
//  与其各自发一次请求，不如在这里统一拉一次，大家共用。
//
//  两种模式下这份数据长什么样：
//
//    【开发 / 服务器模式】server.mjs 的 /api/assets 动态扫出来
//      key 是「去掉扩展名的文件名」（可能是中文，比如 抓挠）
//      value 是服务器上的真实路径（中文会被百分号编码）
//
//          { cards: { 抓挠: "/assets/cards/art/%E6%8A%93%E6%8C%A0.jpg", ... } }
//
//    【单文件模式】打包时写死在 globalThis.__ASSETS__
//      key 仍然是中文原名（匹配逻辑靠它）
//      value 是**纯 ASCII** 路径 —— 打包时把文件重命名成了 scratch.jpg
//      这样 file:// 下就不会因为百分号编码而加载失败
//
//          { cards: { 抓挠: "assets/cards/art/scratch.jpg", ... } }
//
//  两种模式的 key 一样、匹配逻辑一样，只有 value 不同。
//
//  ★ v1.5.2：多了一类 **video**（隐藏关卡的背景 / 结局动画）。
//    key 还是"去掉扩展名的文件名"（画面背景 / 耄耋的梦该醒了），
//    服务器模式扫 assets/video/**，单文件模式由打包脚本写死 ASCII 路径
//    （apocalypse-bg.mp4 / ending.mp4）。见 ui/video.js。
//
//  为什么不让前端自己猜文件名？
//    浏览器没法列目录，只能一个个试，试错就是一堆 404。
//    服务器扫一次，前端拿准确路径，一个 404 都不会有。
// ============================================================

const EMPTY = { cards: {}, heroes: {}, bgm: {}, sfx: {}, video: {} };

let data = { ...EMPTY };

/**
 * 启动时调一次：问服务器"现在有哪些图片和音频"。
 * 拿不到也没关系（比如没启服务器），会全部当成"没有素材"处理。
 *
 * 【两种模式】
 *   1. 开发/服务器模式（默认）：fetch /api/assets，服务器扫文件夹后返回清单
 *      → 加了新图新音频，刷新就能认出来
 *   2. 单文件模式（发给朋友的压缩包）：清单在打包时就生成好了，
 *      直接放在全局变量 __ASSETS__ 里
 *      → 因为没有服务器，file:// 下 fetch 是被浏览器禁止的
 */
async function loadAssets() {
  // ---- 单文件模式：清单已经打包进去了 ----
  const injected = globalThis.__ASSETS__;
  if (injected) {
    data = { ...EMPTY, ...injected };
    return data;
  }

  // ---- 服务器模式 ----
  try {
    const r = await fetch('/api/assets', { cache: 'no-store' });
    if (r.ok) data = { ...EMPTY, ...(await r.json()) };
  } catch {
    // 静默失败：没有清单就什么素材都不用
  }
  return data;
}

function getAssets() {
  return data;
}

/** 仅供自动化测试：塞一份假清单进来 */
function __setAssetsForTest(partial) {
  data = { ...data, ...partial };
}

/**
 * 按优先级，在清单里找第一个存在的文件。
 *
 * 匹配由严到松分三级，这样文件名怎么起都能认出来：
 *
 *   1. 原样精确       "抓挠"      ↔ 抓挠.jpg
 *   2. 去掉装饰词后    "扣血音效"  ↔ 扣血.mp3
 *      （音效 / 战斗曲 / 背景音乐 / bgm 这类词会被忽略）
 *   3. 包含关系       "抓挠卡图"   ↔ 抓挠.jpg
 *
 * @param map  清单里的某一类，比如 assets.sfx
 * @param keys 候选名字，按优先级排
 */
function pick(map, keys) {
  if (!map) return null;

  const candidates = (keys || []).filter(Boolean);
  if (candidates.length === 0) return null;

  // ---- 1) 原样精确 ----
  for (const k of candidates) {
    if (map[k]) return map[k];
  }

  // 按名字排序保证结果稳定（readdir 的顺序不保证）
  const entries = Object.entries(map).sort((a, b) => a[0].localeCompare(b[0]));
  if (entries.length === 0) return null;

  const normEntries = entries.map(([name, url]) => [normalizeName(name), url]);
  const normKeys = candidates.map(normalizeName).filter((n) => n.length > 0);

  // ---- 2) 去掉装饰词后精确 ----
  for (const n of normKeys) {
    for (const [nn, url] of normEntries) {
      if (nn === n) return url;
    }
  }

  // ---- 3) 包含关系 ----
  for (const n of normKeys) {
    if (n.length < 2) continue;
    for (const [nn, url] of normEntries) {
      if (nn.length < 2) continue;
      if (!nn.includes(n) && !n.includes(nn)) continue;
      // 长度差太多就当误匹配（免得 "ab" 命中一个 20 字的文件名）
      if (Math.abs(nn.length - n.length) > 8) continue;
      return url;
    }
  }

  return null;
}

// 文件名里这些词只是装饰，比对时先去掉。
// 比如你的文件叫「扣血音效.mp3」，去掉「音效」就变成「扣血」。
const NOISE_WORDS = [
  '音效',
  '声音',
  '战斗曲',
  '背景音乐',
  '背景',
  '音乐',
  'bgm',
  'sfx',
];

/** 归一化文件名：转小写 → 去掉装饰词 → 去掉空格和括号 */
function normalizeName(s) {
  let t = String(s).toLowerCase();
  for (const w of NOISE_WORDS) t = t.split(w).join('');
  return t.replace(/[\s_\-·・()（）[\]{}【】]/g, '');
}

// ============================================================
//  art.js —— 图片从哪里来（★★★ 你想换图，先看我 ★★★）
// ============================================================
//
//  【你放的图放这里】
//
//      assets/cards/art/     卡牌图
//      assets/heroes/art/    武将图
//
//  文件名用**中文名**就行，也能用 id。下面几种都认：
//
//      卡牌：  抓挠.jpg          ← 中文名（推荐）
//              吴？.jpg
//              scratch.jpg      ← 内部 id
//
//      武将：  老六.jpg          ← 中文名去掉「园区」
//              园区老六.jpg      ← 完整中文名
//              laoliu.jpg       ← 内部 id
//
//  扩展名随便：jpg / png / webp / gif 都行，混着放也没关系。
//  没放图的会自动退回项目自带的虚线占位图，不会报错。
//
//  【它是怎么知道有哪些图的？】
//  见 src/ui/assets.js —— 服务器扫一遍文件夹，前端拿准确路径。
//  加了新图只要刷新浏览器，不用改代码、也不用重启。
//
//  【尺寸建议】
//  卡牌图 600×560（比例 1.07），武将图 480×640（比例 0.75）。
//  用 tools\统一图片尺寸.cmd 一键裁切。
// ============================================================



const CARD_ART_DIR = 'assets/cards';
const HERO_ART_DIR = 'assets/heroes';

/** 你自己放的图，放在这两个子文件夹里 */
const USER_ART_SUBDIR = 'art';

/** 占位图的格式（项目自带的那 14 张虚线图） */
const PLACEHOLDER_EXT = 'svg';

// 兼容旧写法
const CARD_ART_EXT = PLACEHOLDER_EXT;
const HERO_ART_EXT = PLACEHOLDER_EXT;

/**
 * 卡牌图。
 * 参数可以是一张牌的 def（有 id 和 name），也可以只给 id 字符串。
 */
function cardArt(cardOrId) {
  const isObj = cardOrId !== null && typeof cardOrId === 'object';
  const id = isObj ? cardOrId.id : cardOrId;
  const name = isObj ? cardOrId.name : null;

  // 先按中文名找（你的图就是这么命名的），再按 id 找，最后退回占位图
  return (
    pick(getAssets().cards, [name, id]) || `${CARD_ART_DIR}/${id}.${PLACEHOLDER_EXT}`
  );
}

/**
 * 武将图。
 * 参数可以是一个武将对象，也可以只给 id 字符串。
 * 文件名可以是「园区老六」「老六」「laoliu」。
 */
function heroArt(heroOrId) {
  const isObj = heroOrId !== null && typeof heroOrId === 'object';
  const id = isObj ? heroOrId.id : heroOrId;
  const name = isObj ? heroOrId.name : null;
  const shortName = name ? name.replace(/^园区/, '') : null; // 「园区老六」→「老六」
  //  ★ v1.5.2：武将可以显式指定"立绘用哪张"。
  //    隐藏 Boss（id: maodieTrue，名字: 耄耋）就用它 —— 不然名字少了个
  //    "（园区）"，pick() 会掉进"包含关系"那一级，撞上「耄耋（原初）」那张图
  //    （未觉醒的隐藏耄耋会挂着觉醒立绘出场）。
  const explicit = isObj ? heroOrId.artName : null;

  return (
    pick(getAssets().heroes, [explicit, name, shortName, id]) ||
    `${HERO_ART_DIR}/${id}.${PLACEHOLDER_EXT}`
  );
}

/** 对手手牌的牌背 */
function cardBackArt() {
  return (
    pick(getAssets().cards, ['back', '牌背']) ||
    `${CARD_ART_DIR}/back.${PLACEHOLDER_EXT}`
  );
}

/**
 * 按**任意名字**拿一张卡牌图（拿不到就返回空串，由调用方自己兜底）。
 *
 * 给"屏幕特效"用的：命中特效有自己的图，不叫卡名 ——
 * 比如「闪电（命中）」「哈气打断（命中）」。
 * 这几张图也放在 `assets/cards/art/`，和卡图一个文件夹。
 */
function artByName(name) {
  return pick(getAssets().cards, [name]) || '';
}

/**
 * 按名字找图：**卡图找完再找武将图**。
 *
 * 为什么要两个都找：
 *   「耄耋（原初）」是**武将图**（放在 `assets/heroes/art/`），
 *   但它会出现在"屏幕中间的特效"里 —— 特效以前只查卡图，
 *   结果拿不到 → 掉回那张牌的卡图 → 什么都显示不出来。
 *   （玩家报的：「屏幕中心没有像闪电命中那样的卡图出现」，
 *     而且座位上的立绘也没跟着换。）
 */
function anyArt(name) {
  return pick(getAssets().cards, [name]) || pick(getAssets().heroes, [name]) || '';
}

/** 仅供自动化测试：塞一份假的图片清单进来 */
const __setManifestForTest = __setAssetsForTest;

/** 浏览器控制台敲 __art() 能看到认出了哪些图 */
function getArtManifest() {
  const a = getAssets();
  return { cards: a.cards, heroes: a.heroes };
}

/**
 * 生成一段"图片槽"的 HTML。
 *
 * 结构是两层：
 *   .art-slot  底层 —— 虚线的空框 + 提示文字（图片没放时你看到的就是它）
 *   .art-img   上层 —— 真正的图片，作为 CSS 背景图铺上去
 *
 * 所以：
 *   · 图片存在   → 盖住底下的虚线框，看到的是你的图
 *   · 图片不存在 → 上层是透明的，露出底下的虚线框
 *
 * 完全不需要 JS 判断，两种状态都不会报错。
 */
function artSlot(className, url, hint = '') {
  return (
    `<div class="art-slot ${className}">` +
    `<span class="art-hint">${hint}</span>` +
    `<div class="art-img" style="background-image:url('${url}')"></div>` +
    `</div>`
  );
}

// ============================================================
//  render.js —— 把游戏状态画成网页
// ============================================================
//
//  【核心思路：整体重画】
//  不搞"这里改一点、那里改一点"。
//  每次状态变了，就把整块 HTML 重新生成一遍。
//
//  对新手来说这是最好理解的模型：
//      状态  →  画面
//  状态是唯一真相，画面只是它的一个快照。
//
//  ── 三个界面 ────────────────────────────────────────────
//    renderLevelSelect   选关（AI 用哪只猫）
//    renderHeroPick      选猫（你从剩下三只里挑）
//    renderGame        对局中
// ============================================================







/** 防止文字里的特殊符号把 HTML 弄坏 */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[m]));
}

// ------------------------------------------------------------
//  右上角的声音设置（静音开关 + 两个音量滑块）
// ------------------------------------------------------------
//  三个界面都要有，所以单独抽出来。
//  点它一定算"用户手势"，顺便能解开浏览器对自动播放的拦截。
function renderAudioWidget(ui) {
  const muted = ui.muted;
  const vol = ui.volumes || { bgm: 0.35, sfx: 0.8 };
  const pct = (v) => Math.round(v * 100);

  const panel = ui.audioOpen
    ? `
      <div class="audio-panel">
        
        <button class="audio-mute ${muted ? 'muted' : ''}" data-action="mute">
        
          ${muted ? '🔇 已静音 · 点一下打开' : '🔊 声音开着 · 点一下静音'}
        
        </button>

        
        <label class="audio-row">

// ------------------------------------------------------------
//  「朋友邀请你联机？」输入框 —— 主界面上**一直有**
// ------------------------------------------------------------
//  ★ 它解决的是一个很实际的误会：
//    联机模式里，**朋友什么文件都不需要**。
//    房主在自己电脑上跑服务器，朋友只要用浏览器打开房主给的网址就行。
//    但朋友手里往往只有那个发给他的压缩包，打开 index.html 一看
//    「联机 · 暂不可用」，就会以为"我少装了什么东西"。
//
//  ★ 后来玩家又报了一个更常见的场景：**朋友打完一局，点了「返回主界面」**，
//    落到的其实是**房主那台机器**上的主页（他就是从那儿打开的）——
//    那种情况下服务器是通的，以前这个输入框会被藏起来，
//    于是他既回不到自己的单机版，也没地方粘链接，就卡住了。
//    所以现在**不管有没有服务器都画这个框**，只是文案不一样：
//      · 没有服务器（单文件版）→ "你不需要下载任何东西"
//      · 有服务器（你在房主那台机器上）→ "朋友又发来一条链接？粘这儿"
function joinBox(pvpOnline = false) {
  const note = pvpOnline
    ? `<p class="join-note">
        
         朋友又发来一条链接？粘到下面这里就能直接进他的房间。<br>
        
         想自己开局的话，点上面前两张<b>联机</b>卡片。
       </p>`
    : `<p class="join-note">
        
         <b>你不需要下载任何东西。</b>让房主把网址发给你，
        
         粘到下面这里（或者直接点他发的那条链接）就能进。
       </p>`;

  return `
    <div class="join-box">
      <div class="join-title">📨 朋友邀请你联机？</div>
      ${note}
      <div class="join-row">
        
        <input id="joinUrl" class="pvp-input wide" placeholder="http://192.168.x.x:5173/pvp.html?room=ABCD"
        
               autocapitalize="off" autocomplete="off" spellcheck="false">
        
        <button class="btn btn-main" data-action="goto-url">进入</button>
      </div>
      <p class="join-hint" id="joinHint"></p>
      <p class="join-tip">
        
        ⚠️ <b>要粘"整条链接"</b>，不能只打房间码 ——
        
        房间码（ABCD 那种）里没有房主的地址，浏览器不知道该去哪台电脑找你朋友。
      </p>
    </div>`;
}

/**
 * 摇骰子：2v2 专用（1v1 还是猜拳）。
 *
 * 玩家反馈：「模式 3 不应该使用剪刀石头布，而是使用摇骰子，
 *   1~4 的点数来决定谁开始，再按照数字顺序来进行回合」，
 * 后来又明确：「摇骰子只用房主摇就可以了」。
 *
 * 所以屏幕上是**一颗大骰子**：摇出几点，就是几号位先手，
 * 然后按 1→2→3→4 的顺序转圈。下面那张表只是"几号位是谁"的对照。
 *
 * @param ui.dice        
          { value: 1~4|null, winner: 座位号|null, spinning: bool }
 * @param ui.pendingSeats  座位表（要显示"几号位是谁"）
 */
function renderDice(ui) {
  const d = ui.dice || { value: null, winner: null, spinning: true };
  const seats = ui.pendingSeats || [];

  const whoIs = (i) => {
    const s = seats[i];
    if (i === 0) return '你';
    if (!s) return `${i + 1} 号位`;
    return s.team === 0 ? '队友' : '敌方';
  };

  // 1~4 号位的对照表（摇到几点就高亮哪一行）
  const rows = seats.map((s, i) => {
    const hero = findHero(s.heroId);
    const cls = ['dice-row'];
    if (d.winner === i) cls.push('win');
    if (s.team === 0) cls.push('mate');
    else cls.push('foe');
    return `
      <div class="${cls.join(' ')}">
        
        <span class="dice-no">${i + 1}</span>
        
        <span class="dice-who">${esc(whoIs(i))} · ${esc(hero.emoji)}${esc(hero.name)}</span>
      </div>`;
  }).join('');

  const face = d.value ? '⚀⚁⚂⚃⚄⚅'[d.value - 1] : '';
  const tip = d.winner !== null
    ? `<p class="dice-tip win">🎲 摇到 <b>${d.value}</b> 点 —— ${esc(whoIs(d.winner))}先手！<br>
        
         接下来按 1 → 2 → 3 → 4 的顺序出手</p>`
    : `<p class="dice-tip">摇出几点，就由<b>几号位</b>先手（1~4 点）</p>`;

  return `
    ${renderAudioWidget(ui)}
    <div class="start-screen">
      <h1>🎲</h1>
      <p class="subtitle">摇骰子决定谁先手</p>
      <div class="dice-box">
        
        <div class="dice-big ${d.spinning ? 'spinning' : ''}">${
        
          d.value === null ? '🎲' : `${face} ${d.value}`
        
        }</div>
        
        <div class="dice-list">${rows}</div>
        
        ${tip}
      </div>
      ${
        
        d.spinning
        
          ? '<button class="btn btn-ghost back-btn" data-action="back">← 返回</button>'
        
          : ''
      }
    </div>`;
}

// ============================================================
//  二点五、猜拳决定谁先手（1v1 用）
// ============================================================
//  为什么不写死"玩家先手"？
//  先手方实测约 53~55% 胜率 —— 白赚一个回合。对 AI 来说这是"送分"，
//  对两个人来说就是**不公平**。所以开打前猜一拳，赢的先手。
//
//  后手的那个人第一个摸牌阶段多摸一张（摸 3 张）作为补偿。
const RPS_LABEL = {
  rock: { icon: '✊', name: '石头' },
  scissors: { icon: '✌️', name: '剪刀' },
  paper: { icon: '✋', name: '布' },
};

function renderRps(ui) {
  const r = ui.rps || {};
  const foeName = ui.mode === 'team2v2' ? '对面的猫' : '对手';

  let body;
  if (r.result) {
    const mine = RPS_LABEL[r.myPick] || { icon: '—', name: '' };
    const foe = RPS_LABEL[r.aiPick] || { icon: '—', name: '' };
    const text =
      r.result === 'tie'
        
        ? '平局！再来一拳……'
        
        : r.result === 'win'
        
          ? `🎉 你赢了！你先手（${foeName}第一个回合会多摸一张）`
        
          : `😿 你输了，${foeName}先手（你第一个回合会多摸一张）`;
    body = `
      <div class="rps-faces">
        
        <div><span class="rps-who">你</span> ${mine.icon} ${mine.name}</div>
        
        <div class="rps-vs">vs</div>
        
        <div><span class="rps-who">${esc(foeName)}</span> ${foe.icon} ${foe.name}</div>
      </div>
      <div class="rps-result ${r.result}">${text}</div>`;
  } else {
    body = `
      <p class="rps-note">
        
        赢的人先手。后手的人第一个回合多摸一张牌作为补偿。
      </p>
      <div class="rps-btns">
        
        ${Object.entries(RPS_LABEL)
        
          .map(
        
            ([id, v]) =>
        
              `<button class="rps-btn" data-rps="${id}">${v.icon}<span>${v.name}</span></button>`
        
          )
        
          .join('')}
      </div>`;
  }

  return `
    ${renderAudioWidget(ui)}
    <div class="start-screen">
      <h1>✊✌️✋</h1>
      <p class="subtitle">猜拳决定谁先手</p>
      <div class="rps-box">${body}</div>
      ${
        
        // 出了结果就马上开局了，这时候给返回键反而会跟自动开局打架
        
        r.result ? '' : '<button class="btn btn-ghost back-btn" data-action="back">← 返回</button>'
      }
    </div>`;
}

// ------------------------------------------------------------
//  卡牌一览（选关页下面那个可以点开的折叠块）
// ------------------------------------------------------------
//  有了装备牌之后，"这游戏里一共有哪些牌"就不是一眼能看明白的了。
//  所以直接把 CARD_DB 原样铺出来 —— 加了新卡会自动出现在这里，
//  不用再单独维护一份说明文档（那种东西一定会忘记更新）。
function renderCardGuide() {
  const groups = [
    [CARD_TYPE.BASIC, '基本牌'],
    [CARD_TYPE.TRICK, '锦囊牌'],
    [CARD_TYPE.DELAYED, '延时锦囊'],
    [CARD_TYPE.EQUIP, '装备牌'],
  ];

  const sections = groups
    .map(([type, label]) => {
      const list = Object.values(CARD_DB).filter((d) => d.type === type);
      if (list.length === 0) return '';

      const rows = list
        
        .map((d) => {
        
          const slotTag = d.slot
        
            ? `<span class="guide-slot ${d.slot}">${EQUIP_SLOT_ICON[d.slot]}${EQUIP_SLOT_NAME[d.slot]}</span>`
        
            : '';
        
          return `<li><b>${esc(d.name)}</b>${slotTag}<span>${esc(d.desc || '')}</span></li>`;
        
        })
        
        .join('');

      return `<div class="guide-group"><h3>${label}（${list.length} 种）</h3><ul>${rows}</ul></div>`;
    })
    .join('');

  return `
    <details class="card-guide">
      <summary>📖 卡牌一览 · 点开看看一共有哪些牌</summary>
      ${sections}
    </details>`;
}

// ============================================================
//  一、选关界面
// ============================================================
function renderLevelSelect(ui) {
  //  ★ v1.5.2（隐藏关卡）：两个标记
  //    · perfect —— 第 7 关打出"完美通关"（第三阶段的耄耋也被打死了）
  //    · whisper —— 先把吕布打服了，第 7 关那张卡片上就浮出一句"细微的提示"
  //      玩家要求："给关卡7…写个隐藏关卡（有细微的提示玩家）"
  const perfectSet = ui.perfect || new Set();
  const cleared = ui.cleared || new Set();
  const lvbuDone = cleared.has(HIDDEN_LEVEL.afterLevelId);

  const cards = LEVELS.map((lv) => {
    const done = cleared.has(lv.id);
    const perfect = perfectSet.has(lv.id);
    const whisper =
      lv.id === HIDDEN_LEVEL.levelId && lvbuDone && !perfect
        ? `<div class="level-whisper" title="……好像有什么东西在看着你">🕯️ 笼子里的那只，好像不太一样了……</div>`
        : '';
    return `
      <button class="level-card ${done ? 'done' : ''} ${perfect ? 'perfect' : ''}" data-level="${lv.id}"
        
              style="--hero-color:${lv.aiHeroColor}">
        
        <div class="level-top">
        
          <span class="level-no">第 ${lv.id} 关</span>
        
          ${
            perfect
              ? '<span class="level-badge perfect">★ 完美通关</span>'
              : done
                ? '<span class="level-badge">✓ 已通关</span>'
                : ''
          }
        
        </div>
        
        <div class="level-hero">
        
          ${artSlot('level-avatar', heroArt({ id: lv.aiHeroId, name: lv.aiHeroName }), lv.aiHeroEmoji)}
        
          <span class="level-name">${esc(lv.aiHeroName)}</span>
        
        </div>
        
        <div class="level-desc">${esc(lv.desc)}</div>
        
        ${whisper}
        
        <div class="level-cta">对手是它 → 点这里挑猫开打</div>
      </button>`;
  }).join('');

  const diffs = [
    ['easy', '🐣 简单', '对手会犯傻'],
    ['normal', '🐱 普通', '正常水平'],
    ['hard', '😼 困难', '几乎不失误'],
  ].map(([id, label, note]) => `
      <button class="diff-btn ${ui.difficulty === id ? 'picked' : ''}" data-diff="${id}">
        
        <b>${label}</b><span>${note}</span>
      </button>`).join('');

  return `
    ${renderAudioWidget(ui)}
    <div class="start-screen">
      <h1>🐈 园区基米斗</h1>
      <p class="subtitle">哈基米三国杀 · 一对一单挑 · 六个关卡</p>

      <p class="rule-note">
        
        每一关，对手会使用一只固定的园区猫。<br>
        
        你从<b>剩下的${LEVELS.length - 1}只</b>里挑一只，把它打服。
      </p>

      <div class="level-list">${cards}</div>

      <h2>难度</h2>
      <div class="diff-list">${diffs}</div>

      ${renderSpeedPicker(ui, { compact: true })}

      ${renderCardGuide()}

      <button class="btn btn-ghost back-btn" data-action="modes">← 换玩法</button>
      <p class="version-note">${GAME_VERSION}</p>
    </div>`;
}

// ============================================================
