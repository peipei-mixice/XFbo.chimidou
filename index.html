function renderHeroPick(ui) {
  const teamMode = ui.mode === 'team2v2';
  const level = LEVELS.find((l) => l.id === ui.levelId) || LEVELS[0];

  // 打 AI 的关卡模式：不能选对手正在用的那只（剩下三只里挑）
  // 组队模式：六只随便挑（其余三只随机分给队友和两个敌人）
  //
  //  ★ v1.5.2（隐藏关卡）：这一关打的是隐藏 Boss 时，名单里的「吕布」变成「S1吕布」
  //    —— 判断和开局完全一样（hiddenBossFor），免得"看到的能选、开局又被换掉"。
  const hiddenBoss = !teamMode && !!hiddenBossFor(level.id, ui.cleared || new Set());
  const choices = teamMode ? HEROES : heroesForLevel(level.id, { hiddenBoss });

  const banner = teamMode
    ? `
      <div class="vs-banner team" style="--hero-color:#c026d3">
        
        <div>
        
          <div class="vs-label">模式 3 · 2 打 2</div>
        
          <div class="vs-hero">🤝 你 + 一个 AI 队友  vs  两个 AI</div>
        
          <div class="vs-desc">
        
            挑一只猫当自己。剩下的三只会随机分成：一个队友、两个敌人。<br>
        
            四人围坐成一圈 —— <b>距离</b>决定你能挠到谁，坐骑能改距离。
        
          </div>
        
        </div>
      </div>`
    : `
      <div class="vs-banner" style="--hero-color:${level.aiHeroColor}">
        
        <div>
        
          <div class="vs-label">第 ${level.id} 关 · 对手是</div>
        
          <div class="vs-hero">${level.aiHeroEmoji} ${esc(level.aiHeroName)}</div>
        
          <div class="vs-desc">${esc(level.desc)}</div>
        
        </div>
      </div>`;

  const cards = choices.map((h) => `
      <button class="hero-card" data-hero="${h.id}" style="--hero-color:${h.color}">
        
        <div class="hero-top">
        
          ${artSlot('hero-portrait', heroArt(h), h.emoji)}
        
          <div class="hero-info">
        
            <div class="hero-name">${esc(h.name)}</div>
        
            <div class="hero-title">${esc(h.title)}</div>
        
            <div class="hero-hp">气势值 ${h.maxHp}</div>
        
          </div>
        
        </div>
        
        <ul class="hero-skills">
        
          ${h.skills.map((s) => `<li><b>【${esc(s.name)}】</b>${esc(s.desc)}</li>`).join('')}
        
        </ul>
      </button>`).join('');

  return `
    ${renderAudioWidget(ui)}
    <div class="start-screen">
      ${banner}

      <h2>${teamMode ? '挑一只猫当自己' : '挑一只猫去打它'}</h2>
      <div class="hero-list">${cards}</div>

      <button class="btn btn-ghost back-btn" data-action="back">
        
        ← 返回${teamMode ? '模式选择' : '选关'}
      </button>
    </div>`;
}

// ============================================================
//  三、对局界面
// ============================================================
/**
 * ui.myIndex 指定"屏幕上这个人"是几号座位（默认 0）。
 *   单机模式1/3 → 永远是 0（你是 0 号位）
 *   联机模式2   → 每个客户端收到的是"以自己为视角"的视图，
 *        
                
         服务器已经把座位重排过了，所以也是 0
 * 所以实际上永远是 0，但留着这个参数是为了将来做"观战"和"同屏多人"。
 */
function renderGame(state, ui) {
  const meIndex = ui.myIndex || 0;
  const me = state.players[meIndex] || state.players[0];
  const others = state.players.filter((p) => p !== me);
  const pending = state.pending;
  const multi = others.length > 1;

  // 1v1：老布局（两个座位条夹着日志）
  const foeRow = multi
    ? '' // 2v2 的座位由下面的四宫格各自定位，不能包在一个 div 里
    : renderSeat(others[0], state, ui, { isFoe: true, me });

  // 2v2：座位按方位直接铺在格子里
  const foeSeats = multi
    ? others.map((p) => renderSeat(p, state, ui, { isFoe: true, me })).join('')
    : '';

  //  ★ v1.5.2（模式 5，玩家要求）：
  //    · 中间信息区只留**日志 + 提问栏 + 提示**
  //    · 「▶️ 出牌速度 / 🏳️ 逃跑」挪到**屏幕左下角**（见 .board-corner）
  //    · **身份局那条图例删掉了**（"🎭 身份局 · 座位号 1~5 · 主公明牌…"玩家说不要）
  const fiveSeats = state.players.length >= 5;

  // 中间那一列（日志 + 提问栏 + 提示）
  const middle = `
      ${fiveSeats ? '' : multi ? renderTeamLegend(state) : ''}
      ${fiveSeats ? '' : renderEscapeButton(state, ui)}
      ${renderLog(state)}
      ${pending ? renderPrompt(state, pending, ui) : ''}
      ${renderNotices(state, ui)}`;

  //  屏幕左下角那一小摞（只有五人局这么放，2v2 还是老样子在中间）
  const corner = fiveSeats
    ? `<div class="board-corner">${renderEscapeButton(state, ui)}</div>`
    : '';

  return `
    ${renderAudioWidget(ui)}
    ${corner}
    <div class="board ${multi ? 'multi' : ''} ${state.players.length >= 5 ? 'five' : ''}">
      ${multi ? foeSeats : foeRow}
      ${multi ? `<div class="mid-col">${middle}</div>` : middle}
      ${renderSeat(me, state, ui, { isFoe: false, me })}
      ${
        //  ★ v1.5.2（隐藏关卡）：打死第三阶段的耄耋之后，**先放结局动画**，
        //    放完再画结算画面（下一关 / 重打本关 / 返回）——
        //    所以 `ui.epilogueRunning` 为真时这里什么都不画（不然按钮会提前露出来）。
        state.over && !ui.epilogueRunning ? renderGameOver(state, ui) : ''
      }
    </div>`;
}

/**
 * ★ v1.5.2（模式 5）：中间那块**出牌区**（玩家要求：
 *   "出什么牌在中间信息区域集体显示"）。
 *
 * 【为什么要单独开一块】
 *   五人局里别人的座位是**缩略版** —— 不画手牌、不画"够得着/够不着"。
 *   那"刚刚谁出了什么牌"就得有一处**集中显示**的地方，不然四个人出牌
 *   只能靠翻日志。这一块就是"直播窗口"：谁 → 出了哪张牌 → 冲着谁。
 *
 * 【只给 5 人局画】
 *   2v2（模式 3 / 4）的座位上本来就画着对手的牌背，出牌时还有座位旁边
 *   "亮一下"的特效（fx），所以那边**一个字没改**。
 *
 * ⚠️ 数据来自引擎的 `state.playFeed`（见 core/engine.js 的 notePlay）：
 *    联机时它会跟着视图一起发过来（座位号已经转过视角了）。
 */
function renderPlayFeed() {
  //  ★ v1.5.2（玩家要求，最终版）：**中间那块"出牌区"撤掉了**。
  //    原因：它和战斗日志重复（日志本来就写着"电脑2 使用了「基米不识字」→ 谁"），
  //    而且是个可滚动的小盒子，挂在中间偏上方很碍事。玩家原话：
  //    "把 5v5 中游戏中心偏上方的可滑动的卡图显示（如电脑2 基米不识字的卡图）去掉"。
  //
  //    现在"谁出了什么牌"看这两处就够：
  //      · 中间的战斗日志（`renderLog`，一直都有）
  //      · 座位旁边"亮一下"那张牌（`fx.js`）—— ⚠️ 为了不重复，它在身份局里
  //        也一起关掉了（见 fx.js 里 `identityGame` 那段）
  //
  //    ⚠️ 引擎那边的 `state.playFeed`（`core/engine.js` 的 `notePlay`）**故意留着**：
  //       数据还在、自检也还在测它 —— 想把这个显示加回来，只要在这里写回渲染、
  //       挂到中间那一列就行。
  return '';
}

/**
 * 2v2 的阵营图例（放在中间信息栏最上面）。
 *
 * 玩家反馈：「为了更好区分敌我方，能不能有更好的优化方案」。
 * 光靠座位染个色，新玩家第一眼还是不确定"绿的是谁" ——
 * 所以直接在图例里写清楚：绿边 = 我和队友，红边 = 对面两个。
 */
function renderTeamLegend(state) {
  //  ★ v1.5.2（模式 5）：身份局的座位有 5 个、阵营有 3 家（主公方 / 反贼 / 内奸），
  //    照抄 2v2 那句"对面两个 / 座位号 1~4"是错的。
  //    ⚠️ 而且身份局里**绝不能提"我方 / 敌方"** —— 队伍是身份推出来的，
  //       写出来就等于报身份（玩家报的 bug：一看"1 队"就知道谁是反贼）。
  //       所以这里只说规矩：主公是明牌、别人藏着、谁都能打。
  const everyone = (state && state.players) || [];
  if (everyone.some((p) => p.role)) {
    return `
    <div class="team-legend">
      <span class="legend-item">🎭 身份局</span>
      <span class="legend-tip">座位号 1~${everyone.length} · 主公明牌，其余藏着 · <b>谁都能打</b>（打错人也是常有的事）</span>
    </div>`;
  }
  return `
    <div class="team-legend">
      <span class="legend-item mate">🐾 我方（你 + 队友）</span>
      <span class="legend-item foe">⚔️ 敌方（对面两个）</span>
      <span class="legend-tip">座位号 1~4 · 同队相邻</span>
    </div>`;
}

/**
 * 对局上方那条小工具行：「出牌速度」+「🏳️ 逃跑」。
 *
 * 逃跑：玩家反馈「想加一个返回键，逃跑算输，回到主界面」。
 *   打不过了想走人，总得有条正经的路 —— 不然只能关网页，
 *   联机时对方会一直干等（那才是最难受的）。
 *   逃跑 = **他自己出局**（引擎的 `api.resign()`）：
 *     1v1：他一个人就是一支队伍 → 当场判负（结算画面就是"你逃跑了"）
 *     2v2：队友还在场上 → 这一局接着打，一队全灭才结算
 *
 * 速度：玩家反馈「AI 出牌过快，看不清操作，能不能减慢一点速度」。
 *   毫秒数在 main.js 的 stepDelayOf() 里用，这里只管显示和点。
 */
const SPEEDS = {
  slow: { ms: 1000, label: '🐢 慢', hint: '每一步停 1 秒 —— 看得最清楚' },
  normal: { ms: 600, label: '▶️ 正常', hint: '默认速度' },
  fast: { ms: 280, label: '⚡ 快', hint: '打得爽，但可能看不清 AI 出了什么' },
};

function renderEscapeButton(state, ui) {
  if (state.over) return '';
  const sp = SPEEDS[(ui && ui.speed) || 'normal'] || SPEEDS.normal;
  return `
    <div class="board-bar">
      <button class="btn btn-ghost speed-btn" data-action="speed"
        
              title="出牌速度：${esc(sp.hint)}（点一下换下一档）">${sp.label}</button>
      <button class="btn btn-ghost escape-btn" data-action="escape"
        
              title="认输并回到主界面（这局算你输）">🏳️ 逃跑</button>
    </div>`;
}

/**
 * ★ v1.5.2（玩家要求）：**AI 出牌速度的选择器**，主界面上就能调。
 *
 * 玩家原话：「添加功能，在主界面就能调整 AI 的流速，就是"快""正常""慢"」。
 *
 * 【和棋盘上那颗按钮的关系】
 *   对局里那颗（`renderEscapeButton` 里的 `data-action="speed"`）是**轮换**：
 *   点一下慢 → 正常 → 快 → 慢…… 打牌的时候腾不出手，一颗按钮最省事。
 *   这个是**三颗并排**、点哪个是哪个 —— 在主界面（还没开打）的时候，
 *   你是有空挑的，直接选比轮换清楚。
 *   两边读写的是**同一个 `ui.speed`**（并且都存 localStorage），所以在哪边改都一样。
 *
 * @param ui     界面状态（读 ui.speed）
 * @param compact 紧凑版（选关界面用，一行三个小按钮）
 */
function renderSpeedPicker(ui, { compact = false } = {}) {
  const cur = (ui && ui.speed) || 'normal';
  const order = ['slow', 'normal', 'fast'];
  const buttons = order
    .map((id) => {
      const sp = SPEEDS[id];
      const on = id === cur;
      //  标签里的图标和字分开：图标给大字，说明放在小字里
      const [icon, ...rest] = sp.label.split(' ');
      return `
        <button class="speed-pick ${on ? 'picked' : ''}" data-speed="${id}"
                title="${esc(sp.hint)}">
          <span class="speed-pick-icon">${icon}</span>
          <span class="speed-pick-label">${esc(rest.join(' '))}</span>
        </button>`;
    })
    .join('');

  return `
    <div class="speed-picker ${compact ? 'compact' : ''}">
      <div class="speed-picker-title">🤖 AI 出牌速度<span class="speed-picker-hint">（${esc(
        (SPEEDS[cur] || SPEEDS.normal).hint
      )}）</span></div>
      <div class="speed-pick-list">${buttons}</div>
    </div>`;
}

// ------------------------------------------------------------
//  气势值显示
// ------------------------------------------------------------
function renderHp(player) {
  let pips = '';
  for (let i = 0; i < player.maxHp; i++) {
    pips += `<span class="pip ${i < player.hp ? 'on' : 'off'}"></span>`;
  }
  return `<div class="hp-bar">${pips}<span class="hp-num">${Math.max(0, player.hp)}/${player.maxHp}</span></div>`;
}

/**
 * ★ v1.5.2（玩家报的 bug）：**圈上的距离要从"真实座位号"算**。
 *
 * 为什么不能直接用 `distanceFrom(state.players, a, b)`？
 *   距离是按**座位号围成一圈**算的（挨着坐 = 1，绕近的那边走）。
 *   而联机视图里的 `players` 是**重排过的**（自己排第一）——
 *   拿这个顺序算出来的是"另一个圈"的邻接关系，于是：
 *     · 界面写着"够不着(距离2)"的人，服务器其实让你打（真距离是 1）
 *     · 反过来"够得着"的人，一点就报"够不着"
 *   玩家报的"4 号位居然距离 1 能打到 1 号位的我"就是这个。
 *
 * 所以：联机时**用服务器算好的矩阵**（`view.distMatrix` / `rangeMatrix`，
 * 按真实座位号索引）；单机时没有重排，直接算就行。
 */
function trueSeatOf(p) {
  return typeof p.seatIndexInGame === 'number' ? p.seatIndexInGame : p.index;
}

function seatDistance(state, a, b) {
  const m = state.distMatrix;
  if (m) {
    const ia = trueSeatOf(a);
    const ib = trueSeatOf(b);
    if (m[ia] && typeof m[ia][ib] === 'number') return m[ia][ib];
  }
  return distanceFrom(state.players, a, b);
}

function seatInRange(state, a, b) {
  const m = state.rangeMatrix;
  if (m) {
    const ia = trueSeatOf(a);
    const ib = trueSeatOf(b);
    if (m[ia] && typeof m[ia][ib] === 'boolean') return m[ia][ib];
  }
  return inRange(state.players, a, b);
}

// ------------------------------------------------------------
//  一个座位（你 或 对手）
// ------------------------------------------------------------
function renderSeat(player, state, ui, { isFoe, me = null }) {
  const isTurn = state.turnPlayerIndex === player.index && !state.over;
  const pending = state.pending;
  const playerCount = state.players.length;

  // ★ v1.5.2（模式 5，玩家要求）：五人局里**别人的座位画缩略版** ——
  //   "自己的 UI 显示最全，其他玩家 / AI 的 UI 是缩略版"：
  //     · 不画手牌（留座位头上那个"手牌 N"就够看了）
  //     · 不画"够得着 / 够不着"那串提示，**只留距离**
  //   自己那份照旧全画（手牌、范围、装备……）。
  const compact = isFoe && playerCount >= 5;

  // ★ v1.5.2（模式 5，玩家报的 bug）：身份局**一个字的队伍信息都不能露**。
  //   以前这里写着"🐾 我方 / ⚔️ 敌方"、左边还染一条绿/红的色带 ——
  //   而队伍是从身份推出来的：我要是忠臣，看到两个"1 队"的就知道
  //   那两个是反贼、剩下那个是内奸，**身份直接白给**。
  //   所以身份局里：不标队友、不染敌我色、不算"谁能打谁"。
  const identity = state.players.some((p) => p.role);
  const isTeammate = !identity && !!(me && me !== player && me.team === player.team);

  // 联机模式下别人手里的牌只有"张数"，没有实体 —— 所以画牌背
  const handKnown = !isFoe;

  // ---- 手牌 ----
  let handHtml = '';
  if (!handKnown) {
    handHtml = player.hand
      .map(() => `<div class="card-back">${artSlot('card-art', cardBackArt())}</div>`)
      .join('');
  } else {
    handHtml = player.hand
      .map((card) => {
        
        const selectable = !!(pending && pending.legal.includes(card));
        
        const selected = ui.selected.has(card.uid);
        
        return cardHtml(card, { selectable, selected });
      })
      .join('');
  }

  // ---- 判定区 ----
  //  玩家要求：「『大狗嚼（状态）』不要以文字显示，改成卡图形式」。
  //  所以先找有没有「XX（状态）」这张图（和卡图放同一个文件夹，
  //  文件名就是卡名 + （状态））；有就画图，没有就退回文字标签。
  //  这样以后给别的延时锦囊也画一张状态图，**不用改代码**就生效。
  const judgeHtml = player.judgeZone.length
    ? `<div class="judge-zone" title="判定区">
        
         ${player.judgeZone.map((c) => {
        
           // ① 优先用专门的「XX（状态）」图（宽条，比如「大狗嚼（状态）」）
        
           // ② 没放就用这张牌自己的卡图，也用宽条的显示方式
        
           //    —— 玩家要求：判定区三张延时锦囊的比例要统一
        
           // ③ 连卡图都没有（理论上不会）才退回文字
        
           const shot = anyArt(`${c.def.name}（状态）`) || cardArt(c.def);
        
           if (shot && !shot.includes('/undefined.')) {
        
             return `<span class="judge-card art" title="${esc(c.def.name)}"
        
                
                
          style="background-image:url('${shot}')"></span>`;
        
           }
        
           return `<span class="judge-card">${esc(c.def.name)}</span>`;
        
         }).join('')}
       </div>`
    : '';

  // （技能标签已经挪到座位头上了，见下面的 skillChips）

  // ---- 装备区 ----
  //  四个槽（武器 / 防具 / 进攻坐骑 / 防御坐骑）都画出来，空着也画 ——
  //  这样一眼就知道还能穿什么。装备是公开信息，所以双方都画。
  //
  //  ⚠️ 坐骑只在 2v2 的牌堆里出现。1v1 时这两个槽会一直是空的，
  //     所以界面在 2 人局里干脆不画它们，省得占地方（见下面的 onlySlots）。
  const slots = playerCount > 2
    ? EQUIP_SLOT_ORDER
    : [EQUIP_SLOT.WEAPON, EQUIP_SLOT.ARMOR];

  const equipHtml = slots
    .map((slot) => {
      const c = player.equip[slot];
      if (c) {
        
        return `<span class="equip-chip filled ${slot}"
        
                
              title="${esc(c.def.name)}：${esc(c.def.desc || '')}">
        
                
          ${EQUIP_SLOT_ICON[slot]} ${esc(c.def.name)}
        
                
        </span>`;
      }
      return `<span class="equip-chip empty ${slot}"
        
                
            title="这个槽还空着，抽到${EQUIP_SLOT_NAME[slot]}就能穿上">
        
                
        ${EQUIP_SLOT_ICON[slot]} 空${EQUIP_SLOT_SHORT[slot]}
        
              </span>`;
    })
    .join('');

  // ---- 距离 / 攻击范围 ----
  //  ★ v1.5.2（玩家要求，最终版）：
  //    "把距离显示删掉，只在主玩家视图的自己操作 UI 显示能够得着谁，够不着谁"
  //    · **别人（缩略版）那一格：一行距离都不画**（以前写"距离 N"，玩家不要了）
  //    · **只有我自己这一格**列"谁够得着 / 谁够不着"（加上我自己的攻击范围）
  //    · 身份局里**绝不出现"队友"两个字** —— 那是队伍信息（不过"够得着/够不着"
  //      现在是纯距离算的，不带队伍，见下面 `teamFree`）
  //  ⚠️ 1v1（2 人）还是什么都不画：距离恒为 1，写出来是废话。
  let rangeHtml = '';
  if (playerCount > 2 && me && !compact) {
    //  身份局里"够得着"只看距离 + 攻击范围，**不掺队伍**
    //  （引擎现在允许打任何人，见 core/engine.js 的 opponentsOf）
    const teamFree = identity;
    const chips = state.players
      .filter((p) => p.alive)
      .map((p) => {
        if (p === player) return `<span class="dist self">我 · 攻击范围 ${attackRange(player)}</span>`;
        const sameTeam = !teamFree && p.team === player.team;
        const iCanHit = !sameTeam && seatInRange(state, player, p);
        const canHitMe = !sameTeam && seatInRange(state, p, player);
        const d = seatDistance(state, player, p);
        const cls = sameTeam ? 'mate' : iCanHit ? 'can-hit' : 'far';
        const tag = sameTeam ? '队友' : iCanHit ? `够得着(距离${d})` : `够不着(距离${d})`;
        //  ★ v1.5.2（玩家反馈 3）：名字后面带上**猫名** ——
        //    线上局的名字是"电脑 4 / 玩家 2"，光看名字认不出是谁的猫，
        //    玩家的话是"'电脑4'后面应该跟着的是它用的猫"。
        //    单机局 name 本来就是猫名（engine 里 name: spec.name || hero.name），不会重复。
        const who = esc(p.name || p.hero.name);
        const whoFull = p.name && p.name !== p.hero.name ? `${who} · ${esc(p.hero.name)}` : who;
        return `<span class="dist ${cls}" title="${who} · ${esc(p.hero.name)} · 气势 ${p.hp}">${whoFull} ${tag}${
          canHitMe ? ' ⚠️' : ''
        }</span>`;
      })
      .join('');
    if (chips) rangeHtml = `<div class="dist-row">${chips}</div>`;
  }

  // ---- 计数器（小海的「拉」之类） ----
  //  放在**手牌数下面**单独一行：手牌数是"我手里有几张"，
  //  计数器是"我攒了几个资源"，两个都是"一眼要看到"的数字，
  //  挤在同一行又乱又容易看漏（玩家反馈要求挪到下面）。
  //  位置就是紧跟 `手牌 N` 之后，靠 CSS 的 flex-basis:100% 换行，
  //  这样它**永远**在手牌数正下方，不会被挤到别处。
  const counters = player.counters || {};
  const counterChips = Object.keys(counters)
    //  ★ v1.5.2：**只给引擎看的小本子不画徽章**（以前 `maodieAwakened × 1`
    //    这种英文 key 会原样漏到座位上）。见 constants.js 的 COUNTER_HIDDEN。
    .filter((k) => !COUNTER_HIDDEN.has(k) && (counters[k] || 0) > 0)
    .map((k) => {
      const label = COUNTER_LABEL[k] || k;
      const icon = COUNTER_ICON[k] ? `${COUNTER_ICON[k]} ` : '';
      return `<span class="seat-counter" title="攒下的${esc(label)}（技能消耗品）">${icon}${esc(
        
        label
      )} × ${counters[k]}</span>`;
    })
    .join('');
  const counterHtml = counterChips
    ? `<span class="seat-counter-row">${counterChips}</span>`
    : '';

  // ---- 阵营标签（2v2）----
  //  玩家反馈「为了更好区分敌我方，能不能有更好的优化方案」。
  //  所以这里不只是加两个字，而是**同一套视觉语言用三遍**：
  //    ① 座位左边一条粗色带（我方绿 / 敌方红）
  //    ② 背景淡淡地染一层同色（扫一眼就知道这半边是谁的人）
  //    ③ 头像旁边一枚带图标的徽章（🐾 我方 / ⚔️ 敌方）—— 色弱也分得清
  const sameTeam = !identity && !!(me && player.team === me.team);
  const teamTag = playerCount > 2 && me && !identity
    ? `<span class="team-badge t${sameTeam ? 0 : 1}">${
        
        sameTeam ? '🐾 我方' : '⚔️ 敌方'
      }</span>`
    : '';

  // ---- 武将技能 ----
  //  玩家反馈：「武将技能（如『无双』）能不能放在武将名称、
  //  你/我方/敌方/玩家X 的后面」。
  //  所以从下面单独一行挪到座位头上 —— 一行里把"这是谁、什么阵营、
  //  有什么技能"连着读完，不用眼睛上下跳。
  const skillChips = player.hero.skills
    //  ★ v1.5.2（隐藏关卡）：第三个技能**触发之前不画**
    //    （玩家要求"该技能在进入隐藏关卡还是不可见"）。
    //    技能自己带 `visible(player)` —— 没写这个字段的就是一直可见。
    .filter((s) => typeof s.visible !== 'function' || s.visible(player))
    .map((s) => `<span class="skill-chip" title="${esc(s.desc)}">${esc(s.name)}</span>`)
    .join('');

  // ---- 类名 ----
  //  ★ v1.5.2（模式 5）：身份局里**不染敌我色**（绿/红也是队伍信息）——
  //    别人的座位走中性的 `other`，只有**主公是明牌**，给他描一条金边。
  const seatCls = ['seat', isFoe ? (identity ? 'other' : 'foe') : 'me'];
  if (identity && player.role === 'lord') seatCls.push('lord-seat');
  if (isFoe && isTeammate) seatCls.push('mate');
  if (compact) seatCls.push('compact'); // ★ v1.5.2（模式 5）：缩略版座位
  if (isTurn) seatCls.push('active');
  if (!player.alive) seatCls.push('dead');
  // 这一帧刚挨了打 → 抖一下（见 src/ui/shake.js 的说明）
  if (ui.shake && ui.shake.has(player.index)) seatCls.push('shake');
  // 多人局：给方位格定位用（上 / 下 / 左 / 右）
  // ★ v1.5.2（玩家报的 bug）：方位要按**真实座位号**排（谁在圈上挨着我），
  //   不能按"视图里的位置" —— 视图把收件人排到了第一位，位置顺序和圈上顺序
  //   根本不是一回事。按位置排会出现"看不出谁挨着谁"，距离提示也就跟画面打架。
  if (playerCount >= 5) seatCls.push(`pos-${fivePad(trueSeatOf(player), me ? trueSeatOf(me) : 0)}`);
  else if (playerCount > 2) seatCls.push(`pos-${multiPad(trueSeatOf(player), me ? trueSeatOf(me) : 0)}`);

  // ---- 座位号 ----
  //  玩家反馈：「在模式3中以敌我方排序位，分好 1、2、3、4 号位（有数字显示）」。
  //  ★ v1.5.2（玩家报的 bug）：写**真实座位号**（局内那个），不是视图里的位置 ——
  //    不然同一张桌子，每个人看到的"3 号位"是不同的人，说都说不清楚。
  //  1v1 不显示（两个人不需要编号，画出来只是噪音）。
  const mySeatNo = trueSeatOf(player) + 1;
  const seatNo = playerCount > 2
    ? `<span class="seat-no" title="第 ${mySeatNo} 号位">${mySeatNo}</span>`
    : '';

  return `
    <section class="${seatCls.join(' ')}"
        
             data-seat="${player.index}"
        
             style="--hero-color:${player.hero.color}">
      <div class="seat-head">
        
        ${seatNo}
        
        ${
        
          // 「耄耋附体」之后，卡图也换成「耄耋（原初）」（玩家要求：
        
          // 名字和卡图一起变）
        
          artSlot(
        
            'seat-avatar',
        
            player.counters && player.counters.maodieAwakened
        
              ? anyArt('耄耋（原初）') || heroArt(player.hero)
        
              : heroArt(player.hero),
        
            player.hero.emoji
        
          )
        
        }
        
        <span class="seat-hero">${esc(player.name || player.hero.name)}</span>
        
        ${
        
          // ★ v1.5.2（玩家报的 bug「'电脑4'后面应该跟着的是它用的猫，而不是'电脑4'」）：
        
          //   这一行挂的是**猫名**（武将名），不是再念一遍"谁在打"。
        
          //   线上局里每个座位都有名字（`电脑 4` / `玩家 2`），跟猫名不一样，
        
          //   旧写法把 player.name 又贴了一遍，于是显示成"电脑4 电脑4"、猫名反而没地方出现。
        
          //   单机局 AI 的 name 本来就是猫名（engine 里 name: spec.name || hero.name），
        
          //   这时两者相同，不重复显示。
        
          player.name && player.name !== player.hero.name
        
            ? `<span class="seat-owner" title="用的是 ${esc(player.hero.name)}">${esc(player.hero.name)}</span>`
        
            : ''
        
        }
        
        ${teamTag}
        
        ${skillChips}
        
        <span class="seat-title">${esc(player.hero.title)}</span>
        
        ${
        
          // 用 flex 撑开：这样右边那组（回合中 / 手牌数）永远贴着右边缘，
        
          // 而"回合中"就稳稳待在**手牌数的左边**
        
          '<span class="seat-pad"></span>'
        
        }
        
        ${roleBadge(player)}
        ${player.drunk ? '<span class="turn-badge buff">扫尾中</span>' : ''}
        
        ${
        
          // v1.5.2：被「吴基之谈」（铁索连环）横置的人挂个链子 ——
        
          // 这是个**跨回合**的状态（不吃属性伤害就一直挂着），
        
          // 而且直接影响双方决策（该不该躲、要不要现在放火），
        
          // 所以必须一眼看得见，不能只写在日志里。
        
          player.chained ? '<span class="turn-badge chained">🔗 连环</span>' : ''
        
        }
        
        ${isTurn ? '<span class="turn-badge">回合中</span>' : ''}
        
        ${player.alive ? '' : '<span class="turn-badge dead">已倒下</span>'}
        
        <span class="seat-hand-count">手牌 ${player.hand.length}</span>
        
        ${counterHtml}
      </div>
      <div class="seat-hp">${renderHp(player)} ${judgeHtml}</div>
      ${rangeHtml}
      <div class="equip-row">${equipHtml}</div>
      ${
        //  ★ v1.5.2（模式 5）：缩略版座位**不画手牌**（"手牌 N" 在座位头上）
        compact ? '' : `<div class="hand">${handHtml}</div>`
      }
    </section>`;
}

/**
 * 2v2 的四宫格方位。
 *
 * 玩家反馈：「以敌我方排序位，分好 1、2、3、4 号位，而且同队的一定坐相邻；
 *   4 个玩家/AI 的界面 UI 分别位于上下左右较好，中间为信息栏」。
 *
 * 座位是 [我方, 我方, 敌方, 敌方]，所以**按座位顺序绕着桌子坐**，
 * 同队天然就挨着：
 *
 *        
          上：2 号（敌方）
 *    左：1 号（队友）  右：3 号（敌方）
 *        
          下：0 号（你自己）
 *
 * ⚠️ 别按"出手顺序"摆（那是 [0,2,1,3]）：那样你的队友会跑到对面，
 *    正好违反"同队相邻"。
 *
 * @param index   这个人的座位号
 * @param myIndex 你自己是几号位（永远是 0，联机时服务器已经把视角转好了）
 */
/** ★ v1.5.2：身份局的徽章（自己 / 主公 / 已出局的人才有 role，别人是 null） */
const ROLE_BADGE = {
  lord: { icon: '👑', name: '主公', cls: 'lord' },
  loyal: { icon: '🛡️', name: '忠臣', cls: 'loyal' },
  rebel: { icon: '🗡️', name: '反贼', cls: 'rebel' },
  spy: { icon: '🃏', name: '内奸', cls: 'spy' },
};
function roleBadge(player) {
  const r = ROLE_BADGE[player.role];
  if (!r) return '';
  return `<span class="turn-badge role ${r.cls}" title="身份：${r.name}">${r.icon} ${r.name}</span>`;
}

function multiPad(index, myIndex = 0) {
  const rel = (((index - myIndex) % 4) + 4) % 4;
  return ['bottom', 'left', 'top', 'right'][rel];
}

/**
 * ★ v1.5.2（模式 5）：五个人 = **一张圆桌，1~5 号位顺时针排**（玩家要求：
 *   "做成 1~5 号顺时针排列的那种，参考正版三国杀"）。
 *
 *   自己永远在**正下方**（本机视角），后面按座位号顺时针一个个排过去：
 *
 *        左上：3 号           右上：4 号
 *        左下：2 号   中间信息   右下：5 号
 *                  下：1 号（我）
 *
 *   ⚠️ "顺时针"是按钟表算的：从 6 点（正下）往下走是 7、8、9 点，
 *      也就是**先往左**。所以 +1 在左下、+2 在左上、+3 在右上、+4 在右下。
 *      想左右镜像（下一家改到右边）只要把下面这个数组反过来写就行。
 *
 * @param index   这个人的座位号
 * @param myIndex 你自己是几号位（永远是 0，联机时服务器已经把视角转好了）
 */
const FIVE_PADS = ['bottom', 'left-bot', 'left-top', 'right-top', 'right-bot'];
function fivePad(index, myIndex = 0) {
  const rel = (((index - myIndex) % 5) + 5) % 5;
  return FIVE_PADS[rel];
}

// ------------------------------------------------------------
//  一张手牌
// ------------------------------------------------------------
const TYPE_CLASS = {
  [CARD_TYPE.BASIC]: 'basic',
  [CARD_TYPE.TRICK]: 'trick',
  [CARD_TYPE.DELAYED]: 'delayed',
  [CARD_TYPE.EQUIP]: 'equip',
};

function cardHtml(card, { selectable, selected }) {
  const cls = ['card', TYPE_CLASS[card.def.type] || 'basic'];

  // 装备牌再按槽位分一层：武器是暖金色，防具是冷钢蓝色。
  // 光靠颜色区分对色弱的人不友好，所以右上角还挂一个 ⚔️/🛡️ 小徽章。
  const slot = card.def.type === CARD_TYPE.EQUIP ? card.def.slot : null;
  if (slot) cls.push('equip-' + slot);

  if (selectable) cls.push('selectable');
  else cls.push('locked');
  if (selected) cls.push('selected');

  const slotBadge = slot
    ? `<span class="card-slot ${slot}" title="${EQUIP_SLOT_NAME[slot]}">${EQUIP_SLOT_ICON[slot]}</span>`
    : '';

  return `
    <button class="${cls.join(' ')}" data-card-uid="${card.uid}"
        
            title="${esc(card.def.desc || card.def.name)}">
      <span class="card-corner ${isRed(card.suit) ? 'red' : 'black'}">${card.suit}${card.rank}</span>
      ${slotBadge}
      ${artSlot('card-art', cardArt(card.def))}
      <span class="card-name">${esc(card.def.name)}</span>
    </button>`;
}

// ------------------------------------------------------------
//  战斗日志
// ------------------------------------------------------------
function renderLog(state) {
  const lines = state.log
    .map((l) => `<div class="log-line ${l.cls}">${esc(l.text).replace(/[♥♦]/g, (m) => `<span class="suit-red">${m}</span>`)}</div>`)
    .join('');
  return `<section class="log" id="log"><div class="log-body">${lines}</div></section>`;
}

// ------------------------------------------------------------
//  提问栏（引擎在等你做决定时出现）
// ------------------------------------------------------------
function renderPrompt(state, pending, ui) {
  const q = pending.question;
  // ★ 正在被问的人刚挨了打 → 操作框（手牌区那一块）也抖一下。
  //   玩家反馈："座位整体抖看着不明显，改成武将卡图 + 操作框一起抖"。
  const shakeCls = ui.shake && ui.shake.has(pending.player.index) ? ' shake' : '';

  // ---- 联机时"不是问你"：只显示一句等待，不给任何按钮 ----
  //  以前这里会掉进下面那个"选牌问题"分支，画出一个空的、灰掉的确认按钮，
  //  看起来像"轮到我了但点不动"，很容易被误会成卡住了。
  if (q.kind === 'wait' || pending.waiting) {
    return `
      <section class="prompt waiting">
        
        <div class="prompt-text">⏳ ${esc(q.text || '等待对方……')}</div>
      </section>`;
  }

  // ---- 纯选择题：不选牌，只点一个选项 ----
  // （比如园区狗哥的"要不要把这张黑牌当作歪头用？"）
  if (q.kind === 'option') {
    return `
      <section class="prompt${shakeCls}">
        
        <div class="prompt-text">${esc(q.text)}</div>
        
        <div class="prompt-btns">
        
          ${q.options
        
            .map((o) => `<button class="btn btn-main" data-option="${esc(o.id)}">${esc(o.label)}</button>`)
        
            .join('')}
        
        </div>
      </section>`;
  }

  // ---- 普通选牌问题 ----
  const pickedCount = ui.selected.size;
  const canConfirm = pickedCount >= q.min && pickedCount <= q.max && pickedCount > 0;

  const cancelBtn = q.cancelText
    ? `<button class="btn btn-ghost" data-action="cancel">${esc(q.cancelText)}</button>`
    : '';

  // 武将的主动技能按钮（比如园区响尾蛇的「失道者」）
  const extraBtns = (q.extras || [])
    .map(
      (e) =>
        
        `<button class="btn btn-skill" data-extra="${esc(e.id)}" title="${esc(e.hint || '')}">${esc(e.label)}</button>`
    )
    .join('');

  let hint = '';
  if (q.min === q.max && q.min > 1) {
    hint = `（需要选 ${q.min} 张，已选 ${pickedCount} 张）`;
  } else if (q.min === 0) {
    hint = `（最多选 ${q.max} 张，已选 ${pickedCount} 张）`;
  }

  return `
    <section class="prompt${shakeCls}">
      <div class="prompt-text">${esc(q.text)} ${hint}</div>
      <div class="prompt-btns">
        
        ${extraBtns}
        
        <button class="btn btn-main" data-action="confirm" ${canConfirm ? '' : 'disabled'}>
        
          ${esc(q.confirmText || '确认')}
        
        </button>
        
        ${cancelBtn}
      </div>
    </section>`;
}

// ------------------------------------------------------------
//  临时提示（吐司）
// ------------------------------------------------------------
//  比如"你偷到了「抓挠」"。
//  这些提示会过几秒自动消失 —— 靠 ui.noticesHiddenAfterSeq 判断：
//  seq 小于等于它的都已经"过期"了，不再画出来。
function renderNotices(state, ui) {
  const hiddenAfter = ui.noticesHiddenAfterSeq || 0;
  const list = (state.notices || []).filter((n) => (n.seq || 0) > hiddenAfter);
  if (list.length === 0) return '';

  return `<div class="notices">${list
    .map((n) => `<div class="notice">${esc(n.text)}</div>`)
    .join('')}</div>`;
}

// ------------------------------------------------------------
//  结算画面
// ------------------------------------------------------------
function renderGameOver(state, ui) {
  const myIndex = ui.myIndex || 0;
  const me = state.players[myIndex] || state.players[0];
  const isDraw = !!state.isDraw || state.winnerTeam === null || state.winnerTeam === undefined;
  // ★ 按**队伍**判胜负，不是按"谁还活着" —— 2v2 里队友活着也算你赢
  const youWin = !isDraw && state.winnerTeam === me.team;
  const teamGame = state.players.length > 2;
  // ★ 联机对局（模式 2）：没有"关卡"这个概念。
  //   以前这里照样画「重打本关 / 进入第 N 关」，点了又没人接 —— 玩家反馈
  //   「房主无法返回房间，而是显示重打本关」。所以联机单独一套按钮：
  //   再来一局（回房间重开）+ 退出房间（回大厅）。
  const online = !!ui.online;

  //  ★ v1.5.2（隐藏关卡）：这一关是不是"完美通关"
  //    （第 7 关：连第三阶段的耄耋都打死了）—— 结算画面单独标一行出来。
  const perfectClear = !!(ui.perfect && ui.perfect.has(ui.levelId)) && youWin && !teamGame;

  const winners = state.players.filter((p) => p.alive);
  const winNames = winners.map((p) => p.name).join('、');

  //  ★ v1.5.2（模式 5）：身份局的结算要说清楚**是哪一边赢了** ——
  //    只写"我方获胜 / 我方落败"的话，反贼和内奸根本不知道最后是谁摘了果子。
  //    （队伍是从身份推出来的：0 主公方 / 1 反贼 / 2 内奸）
  const identityGame = state.players.some((p) => p.role);
  const identityWin = !isDraw && identityGame
    ? state.winnerTeam === 2
      ? '🃏 内奸获胜'
      : state.winnerTeam === 1
        ? '⚔️ 反贼获胜'
        : '👑 主公方获胜'
    : null;

  const emoji = isDraw ? '😼😼' : youWin ? '🎉🐱' : '💀🐈';

  const title = isDraw
    ? '平局'
    : identityGame
      ? `${identityWin}${youWin ? ' —— 你是赢家！' : ' —— 你输了……'}`
      : teamGame
      ? youWin ? '我方获胜！' : '我方落败……'
      : online && ui.resignedByMe === true
        
        ? '你逃跑了'
        
        : online && ui.resignedByMe === false
        
          ? `打服${winNames}了！`
        
          : youWin ? `打服${winNames}了！` : `你被${winNames}打服了`;

  const note = isDraw
    ? '大家都累瘫了，谁也没打赢谁。'
    : identityGame
      ? youWin
        ? '你这边的目标达成了。身份都亮出来了，回房间再来一局？'
        : '身份都亮出来了 —— 看看是谁坏了事。回房间再来一局？'
      : teamGame
      ? youWin
        
        ? `获胜的队伍：${winNames}`
        
        : `获胜的队伍：${winNames}。换个队友再试试？`
      : online
        
        ? youWin
        
          ? '这局你赢了。回房间再来一局？'
        
          : '这局你输了。回房间再来一局？'
        
        : youWin
        
          ? `第 ${ui.levelId} 关通关！`
        
          : '再来一次，换个猫也许更好打。';

  // 联机：没有关卡，也没有"下一关"
  if (online) {
    // 「认输」结束的这一局要说清楚是谁跑的（联机时两人看到的文案不一样）
    const resignNote =
      ui.resignedByMe === true
        
        ? '🏳️ 你逃跑了，这局算输。'
        
        : ui.resignedByMe === false
        
          ? '🎉 对方逃跑了，这局你赢！'
        
          : '';
    const peerNote = ui.peerLeft
      ? `<p class="pvp-error">${esc(ui.peerLeft)}</p>`
      : '';
    return `
    <div class="overlay">
      <div class="overlay-box">
        
        <div class="overlay-emoji">${emoji}</div>
        
        <h2>${title}</h2>
        
        ${resignNote ? `<p class="overlay-note">${resignNote}</p>` : ''}
        
        <p>${note}</p>
        
        ${peerNote}
        
        <p class="seed">种子：${state.seed}</p>
        
        <div class="overlay-btns">
        
          <button class="big-btn" data-action="rematch">🔁 再来一局</button>
        
          <button class="btn btn-ghost" data-action="leave">🚪 退出房间</button>
        
        </div>
      </div>
    </div>`;
  }

  // 只有"打 AI 的关卡模式"才有下一关
  const hasNext = youWin && !teamGame && LEVELS.some((l) => l.id === ui.levelId + 1);
  const nextBtn = hasNext
    ? `<button class="big-btn" data-action="next">进入第 ${ui.levelId + 1} 关 →</button>`
    : '';
  const retryBtn = youWin
    ? `<button class="btn btn-ghost" data-action="retry">${teamGame ? '再来一局' : '重打本关'}</button>`
    : `<button class="big-btn" data-action="retry">再来一次</button>`;

  return `
    <div class="overlay">
      <div class="overlay-box">
        
        <div class="overlay-emoji">${emoji}</div>
        
        <h2>${title}</h2>
        
        ${perfectClear ? '<p class="overlay-perfect">★ 完美通关</p>' : ''}
        
        <p>${note}</p>
        
        <p class="seed">种子：${state.seed}</p>
        
        <div class="overlay-btns">
        
          ${nextBtn}
        
          ${retryBtn}
        
          <button class="btn btn-ghost" data-action="back">返回</button>
        
        </div>
      </div>
    </div>`;
}

// ══════ src/ui/logscroll.js ══════
// ============================================================
//  logscroll.js —— 让战斗日志自动"跟着最新一条走"
// ============================================================
//
//  【要解决什么】
//  每次状态更新，界面都会把整块 HTML 重画一遍（见 render.js 的说明）。
//  重画 = 把 #log 整个元素扔掉换新的，而**新元素的 scrollTop 是 0**，
//  于是日志一下子跳回最上面（看到的是最老的那几行）。
//
//  【两种都要照顾】
//    · 玩家贴着底部看 → 自动跟到最新一条（不然新消息看不见）
//    · 玩家往上翻历史 → **保持他正在看的位置**，别动
//
//  ⚠️ 第二版才做对。第一版是这样的：
//
//        if (!wasAtBottom) return;   // 他正在翻历史，别打扰
//
//      —— 看着很合理，其实**什么都没保住**：新元素还在 scrollTop = 0，
//      也就是"最上面"。表现就是玩家一往上翻，紧接着引擎一刷新，
//      内容"啪"地被推到最上方。模式 3（2v2）里日志长、翻历史的场景多，
//      这个毛病就特别明显（模式 2 当年也是同一个坑）。
//
//  【为什么要记"离底部多少像素"而不是 scrollTop】
//  日志是**往下长**的：新消息加在末尾，太老的会从头上丢掉。
//  所以同一个 scrollTop 在不同时刻指的是不同的行 ——
//  直接还原 scrollTop 会让画面随着新消息不断往上滑。
//  记住"离底部多远"就稳了：新消息加在下面，你看的那几行原地不动。
// ============================================================

/** 距离底部多少像素以内，算"他还贴着底部" */
const NEAR_BOTTOM = 48;

/**
 * 画一帧，并且按需把日志钉在底部 / 还原位置。
 * @param paint 真正去改 innerHTML 的那个函数
 */
function withLogAtBottom(paint) {
  const before = document.getElementById('log');

  // 上一帧：他贴着底部吗？离底部多少像素？
  const nearBottom =
    !before ||
    before.scrollHeight - before.scrollTop - before.clientHeight <= NEAR_BOTTOM;
  const fromBottom = before ? before.scrollHeight - before.scrollTop : 0;

  // ★ 顺便把"整页"的滚动位置也记下来。
  //   2v2 座位多、版面高，某些窗口尺寸下整页会滚动；
  //   重画之后整页跳回顶部同样会让人觉得"内容被推到最上面"。
  const pageTop =
    typeof window !== 'undefined' && typeof window.scrollY === 'number'
      ? window.scrollY
      : 0;

  paint();

  const after = document.getElementById('log');
  if (after) {
    if (nearBottom) {
      // 贴着底部 → 跟到最新一条
      after.scrollTop = after.scrollHeight;
    } else {
      // 正在翻历史 → 让他看的那几行**原地不动**
      // （日志往下长，所以按"离底部的距离"还原，而不是照抄 scrollTop）
      after.scrollTop = Math.max(0, after.scrollHeight - fromBottom);
    }
  }

  // 整页滚动也还原（有 window.scrollTo 才做，测试环境里没有就跳过）
  if (pageTop && typeof window !== 'undefined' && typeof window.scrollTo === 'function') {
    window.scrollTo(0, pageTop);
  }
}

// ══════ src/ui/noticefade.js ══════
// ============================================================
//  noticefade.js —— 临时提示（吐司）的自动消失
// ============================================================
//
//  【要解决什么】
//  引擎会推"你偷到了「抓挠」"这种只有自己看得到的提示。
//  它们是**一次性吐司**：过几秒必须自己消失，不然会一直挂在屏幕上。
//
//  【为什么要单独抽成一个模块？】
//  这段逻辑原来只写在单机的 main.js 里，联机的 pvp.js **漏抄了** ——
//  结果联机时偷完牌，"你偷到了XX"的绿色悬浮窗就一直挂着不走。
//
//  所以抽出来放这儿，两个客户端共用同一份。谁也别再抄一遍。
//
//  【为什么要防"重复计时"】
//  引擎每变一次状态就推一次视图，一秒能推好几次。
//  如果每次推都 clearTimeout + 重新计时，计时器会被无限延后，
//  提示就永远不消失了（这个坑踩过两次）。
//  所以：**同一条提示只计一次时**。
// ============================================================

const NOTICE_MS = 5000;

/**
 * 造一个"吐司管理器"。
 * @param onFade 到点了要重画界面，传 render 进来
 * @param ms 停留多久（测试时可以调短）
 */
function createNoticeFader(onFade, ms = NOTICE_MS) {
  let timer = null;
  let timerFor = 0;        // 当前这个计时器是为哪条提示（seq）计的
  let hiddenAfter = 0;     // seq <= 它的提示，已经过期不显示了
  let duration = ms;

  /**
   * 每收到一份新状态就调一次。
   * @param notices 状态里的 notices 数组（可能只有自己那几条）
   */
  function schedule(notices) {
    const list = notices || [];
    const latest = list.length ? list[list.length - 1].seq : 0;

    if (!latest) return;
    if (latest <= hiddenAfter) return;   // 这条已经藏起来了
    if (latest === timerFor) return;     // 已经在为这条计时了，别重来

    // 只有真的来了新提示，才重新计时（让最后一条也待满 duration）
    timerFor = latest;
    clearTimeout(timer);
    timer = setTimeout(() => {
      hiddenAfter = latest;
      timerFor = 0;
      onFade();
    }, duration);
  }

  function reset() {
    clearTimeout(timer);
    timer = null;
    timerFor = 0;
    hiddenAfter = 0;
  }

  return {
    schedule,
    reset,
    get hiddenAfter() { return hiddenAfter; },
    /** 仅供自动化测试：把停留时间调短，好在测试里真的等一次 */
    setMs(v) { duration = v; },
    /** 仅供自动化测试：看计时器现在的状态 */
    state() { return { hiddenAfter, timerFor }; },
  };
}

// ══════ src/ui/shake.js ══════
// ============================================================
//  src/ui/shake.js —— "谁刚刚挨了打"（座位抖动用）
// ============================================================
//
//  【要解决什么】
//    玩家反馈：「受到伤害时能不能做个动画抖动」。
//
//    听起来是个纯 CSS 的事，其实难点在**时机**：
//    整个界面是"状态一变就整块重画 innerHTML"，所以元素每 500ms 就会被
//    重新创建一次。如果无条件给座位挂上 `shake` 类，那就是**一直在抖**。
//
//    所以必须先回答一个问题：**这一帧里，谁刚挨了打？**
//
//  【怎么回答】
//    引擎在"受伤"那条日志上带了一个 `victim`（座位号）。
//    这里记住"上一帧看到哪一条日志了"（用 seq，日志数组满了会从头丢，
//     所以不能用下标），每次重画前把新日志扫一遍，
//    把其中的 victim 收集起来交给界面 —— 只给这一帧挂类名，
//    下一帧自然就没有了，动画正好放一次。
//
//  【为什么单独一个文件】
//    单机和联机都要用，而且**必须只有一份**：
//    以前"提示淡出""日志滚动"都因为两边各写一遍而出现"一边有一边没有"，
//    所以这次一开始就抽成共享模块。
// ============================================================

function createShakeTracker() {
  let seenSeq = 0;

  return {
    /**
     * 重画之前调用一次。
     * @returns {Set<number>} 这一帧需要抖动的座位号
     */
    collect(state) {
      const hit = new Set();
      const log = (state && state.log) || [];

      for (const line of log) {
        const seq = line.seq || 0;
        if (seq <= seenSeq) continue;         // 上次已经看过了
        if (line.cls !== 'damage') continue;  // 只有"受伤"才抖
        if (typeof line.victim === 'number') hit.add(line.victim);
      }

      // 把水位推到最新一条（不管它是不是伤害），下次不再重复扫
      if (log.length) {
        const last = log[log.length - 1].seq || 0;
        if (last > seenSeq) seenSeq = last;
      }
      return hit;
    },

    /** 新的一局：重新开始数 */
    reset() {
      seenSeq = 0;
    },

    /** 仅供自动化测试：水位现在到哪了 */
    state() {
      return { seenSeq };
    },
  };
}

// ══════ src/ui/audio.js ══════
// ============================================================
//  audio.js —— 背景音乐 + 音效
// ============================================================
//
//  【音频放这里】
//
//      assets/audio/bgm/     背景音乐（循环）
//      assets/audio/sfx/     音效（播一次）
//
//  具体要哪些文件、文件名怎么起，看 assets/audio/README.md
//
//  【没放音频会怎样】
//  完全静音，不报错。一个文件都不放也能正常玩。
//
//  【背景音乐会不会盖住音效】
//  靠**基准音量**拉开差距：BGM 默认 0.3，音效默认 0.85。
//  右上角那个 🔊 面板还能自己拖。
//  （早先做过"闪避"——音效响时自动压低 BGM 再涨回来，
//    但那样 BGM 忽大忽小，听感很怪，已去掉。）
//
//  右下角/右上角那个 🔊 开关可以调两个音量，会记在本地。
//
//  【浏览器自动播放限制】
//  用户没点过页面之前，浏览器不允许自动播放声音 —— 这是绕不过去的。
//  所以这里的策略是：播放被拒绝就静默记住，等用户第一次点击时再补播。
// ============================================================



// ------------------------------------------------------------
//  音量
// ------------------------------------------------------------
/** 默认音量（0~1）。界面上那个 🔊 面板拖动的就是这两个。 */
//  想让音效更突出，就把 bgm 调小、sfx 调大 —— 而不是让 BGM 忽大忽小。
const BGM_VOLUME = 0.3; // 背景音乐
const SFX_VOLUME = 0.85; // 音效

const VOL_KEY = 'jimidou.volume';

const DEFAULT_VOLUMES = { bgm: BGM_VOLUME, sfx: SFX_VOLUME };
let volumes = { ...DEFAULT_VOLUMES };

try {
  const saved = JSON.parse(localStorage.getItem(VOL_KEY) || 'null');
  if (saved && typeof saved === 'object') {
    volumes = { ...DEFAULT_VOLUMES, ...saved };
  }
} catch {
  /* 隐私模式下 localStorage 可能不可用，忽略 */
}

function getVolumes() {
  return { ...volumes };
}

/**
 * 设置音量。
 * @param kind 'bgm' | 'sfx'
 * @param v 0 ~ 1
 */
function setVolume(kind, v) {
  if (kind !== 'bgm' && kind !== 'sfx') return volumes[kind];
  volumes[kind] = Math.max(0, Math.min(1, Number(v) || 0));
  try {
    localStorage.setItem(VOL_KEY, JSON.stringify(volumes));
  } catch {
    /* 忽略 */
  }
  if (kind === 'bgm' && bgmAudio) {
    bgmAudio.volume = volumes.bgm;
  }
  return volumes[kind];
}

// ------------------------------------------------------------
//  文件名别名表

//  匹配还会自动忽略「音效」「战斗曲」这类装饰词，
//  所以「扣血音效.mp3」「响尾蛇战斗曲.mp3」都能直接认出来。

  lightning: ['大狗嚼命中', '闪电命中', '大狗嚼', '闪电', 'lightning', 'dagou'],
  // 哈气打断拍成功时（放了文件才响，没放就安静跳过）
  hissStop: ['哈气打断命中', 'hissStop'],
  // 刚打开页面时放一次（「开启游戏音效.mp3」）
  start: ['开启游戏', '开始游戏', '进入游戏', '启动游戏', 'start', 'boot'],
};

/** 选关界面的 BGM 候选名 */
const MENU_BGM_KEYS = [
  '选关',
  '主界面',
  '主菜单',
  '菜单',
  'menu',
  'title',
];

/**
 * 「模式 2 / 模式 3」各自的战斗曲。
 *
 * 关卡模式（模式 1）是按**对手武将名**挑歌的（见下面的 levelBgmKeys），
 * 但联机对战和组队模式没有"一个固定的对手武将"这个概念，
 * 所以这两种模式各有一首专属的。
 *
 * 文件名 `模式2战斗曲.mp3` → 去掉装饰词「战斗曲」→ `模式2` → 认出来。
 */
const MODE_BGM_KEYS = {
  pvp1v1: ['模式2', '模式二', '联机', '对战', 'pvp', 'mode2'],
  team2v2: ['模式3', '模式三', '组队', '2v2', 'mode3', 'team'],
  // ★ v1.4.4：联机 2v2（模式 4）也有自己的战斗曲（`模式4音乐.mp3`）。
  //   以前没列在这儿，于是打包时它掉进了兜底的 `unknown.mp3`
  //   （`check-standalone` 会红），联机页也一直借用模式 2 那首。
  //   别名里 `模式4` 必须排在最前面：`pick()` 会先按"去掉装饰词后的精确匹配"找，
  //   `模式4音乐` 去掉「音乐」正好是 `模式4`。
  mode4: ['模式4', '模式四', 'mode4', '联机2v2'],
};

/**
 * ★ v1.5.2（隐藏关卡）：耄耋进入第三阶段之后的**固定** BGM。
 *
 * 玩家原话：「bgm 固定切换为"最终之战"」—— 不是随机轮播、也不是接着放，
 * 就是这一首一直循环到这一局结束（打完还有结局动画，那段用自己的声音）。
 */
const FINAL_BGM_KEYS = ['最终之战', '最终战', '决战', 'final', 'finalbattle'];

/**
 * 「选将 / 等别人」界面的 BGM。
 *
 * 玩家新加的 `等待玩家中与选择武将界面音效.mp3`：选猫那一屏、
 * 以及联机等对方选猫 / 等对方连上来的时候放。
 *
 * 为什么要单独一首：选将和等待是"没有对手、没有战斗"的时刻，
 * 用战斗曲太吵，用主菜单曲又太"已经开始了"。
 */
const WAIT_BGM_KEYS = [
  '等待玩家',
  '选择武将',
  '选将',
  '等待',
  'wait',
];

/**
 * 某一关的 BGM 候选名。
 * 按顺序找，找到哪个用哪个：
 *   第N关 / levelN / 对手武将名（响尾蛇）/ 去掉「园区」的名字 / 对手 id（rattler）
 */
function levelBgmKeys(level) {
  const short = level.aiHeroName ? level.aiHeroName.replace(/^园区/, '') : null;
  return [
    `第${level.id}关`,
    `level${level.id}`,
    level.aiHeroName,
    short,
    level.aiHeroId,

// ------------------------------------------------------------
//  静音状态（记在 localStorage 里，刷新后还记得）
// ------------------------------------------------------------
const MUTE_KEY = 'jimidou.muted';

let muted = false;
try {
  muted = localStorage.getItem(MUTE_KEY) === '1';
} catch {
  /* 忽略 */
}

function isMuted() {
  return muted;
}

function toggleMute() {
  muted = !muted;
  try {
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
  } catch {
    /* 忽略 */
  }
  if (bgmAudio) bgmAudio.muted = muted;
  return muted;
}

// ------------------------------------------------------------
//  背景音乐
// ------------------------------------------------------------
let bgmAudio = null;
let currentBgmUrl = null;

/** ★ v1.5.2：正在"随机轮播"吗？（模式 4 用，见 playBgmShuffle） */
let shuffleMode = false;
/** 这一轮的播放顺序（洗过的 key）和播到哪儿了 */
let shuffleQueue = [];
let shuffleIndex = 0;

/**
 * ★ v1.5.2：**当前挂在 `bgmAudio` 上的那个 `ended` 处理函数**。
 *
 * 【为什么必须记着它】
 *   同一首歌可能被三种模式先后接管：
 *     · 单曲循环（`playBgm`，loop = true，不需要 ended）
 *     · 自己洗牌轮播（`playBgmShuffle`，loop = false + ended 换下一首）
 *     · **服务器指挥**（`playBgmKey`，loop = false + ended 回报 `bgm-done`）
 *   换模式时要是**只换 loop 不换监听**，就会出现两种 bug：
 *     · 从轮播切回单曲循环时 loop 还是 false → 这首放完就静音了
 *     · 从单曲循环切成"服务器指挥"时 loop 还是 true → **永远不回报**，
 *       全房间只能等 4 分钟的兜底换歌（音乐就不"同步"了）
 *   所以这里存一份，换歌 / 换模式时先摘掉旧的再挂新的。
 */
let bgmEndedHandler = null;

/** 换掉当前这一首的 `ended` 监听（传 null 就是"这一首不需要 ended"） */
function armBgmEnded(fn) {
  if (bgmAudio && bgmEndedHandler) {
    try {
      bgmAudio.removeEventListener('ended', bgmEndedHandler);
    } catch {
      /* 忽略 */
    }
  }
  bgmEndedHandler = fn || null;
  if (bgmAudio && bgmEndedHandler) bgmAudio.addEventListener('ended', bgmEndedHandler);
}

/**
 * ★ v1.5.2（玩家要求）：`assets/audio/bgm/` 里**所有**背景音乐的 key。
 *
 * 模式 4 不再固定放某一首，而是随机轮播全部 BGM —— 见 playBgmShuffle。
 * 返回的是清单里的 key（比如 `模式4音乐`、`第1关`……），交给 pick 之外的
 * "按 key 直接取"那条路用（下面的 bgmUrlByKey）。
 */
function allBgmKeys() {
  return Object.keys(getAssets().bgm || {});
}

/** 按 key 直接取 BGM 的地址（pick 是"按候选名找"，这里是"已经知道 key 了"） */
function bgmUrlByKey(key) {
  const map = getAssets().bgm || {};
  return map[key] || null;
}

/** 洗牌（Fisher–Yates；不依赖 Math.random 之外的东西） */
function shuffleList(list) {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

/**
 * 播放背景音乐（循环）。
 * @param keys 候选文件名数组，按优先级排
 */
function playBgm(keys) {
  shuffleMode = false; // 换回"单曲循环"就退出随机轮播
  shuffleQueue = [];
  shuffleIndex = 0;

  const url = pick(getAssets().bgm, keys);

  // 这关没配 BGM → 静音，但别把上一首留着
  if (!url) {
    stopBgm();
    return;
  }

  // 已经在放同一首了，别从头开始 ——
  //  ⚠️ 但**必须把播放模式改回来**：这首可能是刚才"随机轮播 / 服务器指挥"
  //     放着的那一首（loop = false），不改的话这首放完就静音了。
  if (url === currentBgmUrl && bgmAudio && !bgmAudio.paused) {
    bgmAudio.loop = true;
    armBgmEnded(null); // 单曲循环不需要 ended
    return;
  }

  stopBgm();

  bgmAudio = new Audio(url);
  bgmAudio.loop = true;
  bgmAudio.volume = volumes.bgm;
  bgmAudio.muted = muted;
  armBgmEnded(null);

  // play() 返回 Promise，被浏览器拒绝时要接住，不然控制台会报未捕获错误
  bgmAudio.play().catch(() => {
    // 大概率是"用户还没点过页面"。
    // 不用管 —— armBgmRetry() 会在第一次点击时自动补播。
  });

  currentBgmUrl = url;
}

/**
 * ★ v1.5.2（玩家要求）：**随机轮播**——一首接一首随机放，放完一轮重新洗。
 *
 * 【为什么单独一个函数】
 *   `playBgm(keys)` 是"挑一首、单曲循环"，模式 1/2/3 一直是这样；
 *   模式 4 的玩家要求"直接随机播放 bgm 文件夹里的所有音乐"，
 *   所以这里做成**播放列表**：所有 BGM 洗一遍，放完一首自动切下一首
 *   （`loop = false` + `onended`），一轮放完重新洗牌继续。
 *
 * ⚠️ 已经在轮播时**直接返回**：这样界面在"大厅 → 选将 → 开打"之间切换
 *    不会把当前这首打断重放（切屏只是切界面，音乐该连着放）。
 * ⚠️ 洗牌时避免"刚放完的这首又排在第一个"，不然听着像卡带了。
 */
function playBgmShuffle(keys = null) {
  if (shuffleMode) return; // 已经在本轮播放里了，别重来

  const pool = (keys && keys.length ? keys : allBgmKeys()).filter((k) => bgmUrlByKey(k));
  if (pool.length === 0) {
    stopBgm();
    return;
  }

  shuffleMode = true;
  shuffleQueue = pool.length === 1 ? [...pool] : shuffleList(pool);
  shuffleIndex = 0;
  playShuffleHead(null);
}

/** 播当前这一首；放完切下一首（一轮放完就重新洗） */
function playShuffleHead(lastUrl = null) {
  if (!shuffleMode) return;

  if (shuffleIndex >= shuffleQueue.length) {
    // 一轮放完：重新洗，顺便保证不会"上一首刚完又是它"
    shuffleQueue = shuffleList(shuffleQueue);
    shuffleIndex = 0;
    if (shuffleQueue.length > 1 && bgmUrlByKey(shuffleQueue[0]) === lastUrl) {
      [shuffleQueue[0], shuffleQueue[1]] = [shuffleQueue[1], shuffleQueue[0]];
    }
  }

  const url = bgmUrlByKey(shuffleQueue[shuffleIndex]);
  if (!url) {
    // 这个 key 没有文件（清单是空的）→ 跳过它
    shuffleIndex++;
    playShuffleHead(lastUrl);
    return;
  }

  stopBgm();
  bgmAudio = new Audio(url);
  bgmAudio.loop = false; // ★ 关键：放完要能走到 onended，我们才好换下一首
  bgmAudio.volume = volumes.bgm;
  bgmAudio.muted = muted;
  armBgmEnded(() => {
    if (!shuffleMode) return;
    shuffleIndex++;
    playShuffleHead(url);
  });
  bgmAudio.play().catch(() => {
    // 被自动播放策略拦下 —— armBgmRetry() 会在第一次点击时补播
  });

  currentBgmUrl = url;
}

/**
 * ★ v1.5.2：**按 key 播一首**（不循环），放完调 `onEnded`。
 *
 * 为什么需要它：模式 4 / 5 的背景音乐由**服务器指挥轮播**
 * （见 `net/pvp.js` 的 startBgmRotation）—— 客户端只负责"放这一首、放完回报"。
 * 以前每个客户端自己洗牌，四个人听到的歌都不一样（玩家报的 bug）。
 *
 * @param key      BGM 的 key（= 文件名去掉扩展名，和 assets.js 的约定一致）
 * @param onEnded  放完那一首时回调（客户端拿它去回报服务器）
 * @returns {boolean} 有没有真的开始播（清单里找不到这首歌就 false）
 */
function playBgmKey(key, onEnded = null) {
  // 退出"自己洗牌"的模式：现在是服务器说了算
  shuffleMode = false;
  shuffleQueue = [];
  shuffleIndex = 0;

  const url = bgmUrlByKey(key);
  if (!url) return false;

  // 已经在放同一首了，别从头开始（重连时服务器会再推一遍当前这首）——
  //  ⚠️ 同上：这首可能正被 `playBgm` 单曲循环放着（loop = true）。
  //     服务器要的是"放完回报"，所以必须切成 loop = false 并挂上回报回调，
  //     不然 ended 永远不来 → 全房间只能等 4 分钟兜底换歌。
  if (url === currentBgmUrl && bgmAudio && !bgmAudio.paused) {
    bgmAudio.loop = false;
    armBgmEnded(onEnded ? () => onEnded(key) : null);
    return true;
  }

  stopBgm();
  bgmAudio = new Audio(url);
  bgmAudio.loop = false;
  bgmAudio.volume = volumes.bgm;
  bgmAudio.muted = muted;
  armBgmEnded(onEnded ? () => onEnded(key) : null);
  bgmAudio.play().catch(() => {
    // 被自动播放策略拦下 —— armBgmRetry() 会在第一次点击时补播
  });
  currentBgmUrl = url;
  return true;
}

function stopBgm() {
  if (bgmAudio) {
    try {
      bgmAudio.pause();
    } catch {
      /* 忽略 */
    }
    bgmAudio = null;
  }
  bgmEndedHandler = null; // 换掉的那一首的 ended 监听跟着一起作废
  currentBgmUrl = null;
}

/**
 * 挂一个"一次性"的补播钩子。
 * 浏览器的自动播放限制只认用户手势，所以第一次点击 / 按键时再试一次。
 */
function armBgmRetry() {
  const retry = () => {
    if (bgmAudio && bgmAudio.paused && !muted) {
      bgmAudio.play().catch(() => {});
    }
    document.removeEventListener('pointerdown', retry);
    document.removeEventListener('keydown', retry);
  };
  document.addEventListener('pointerdown', retry);
  document.addEventListener('keydown', retry);
}

/**
 * 开机音效：「开启游戏音效.mp3」，刚打开页面时放一次。
 *
 * ⚠️ 和 BGM 一样会被浏览器的自动播放策略拦下来（用户还没点过页面）。
 *    所以这里不能"放一次就完事"：
 *      · 放成功了 → 结束
 *      · 被拦了   → 挂一次性手势补播，等玩家第一次点击 / 按键盘时补上
 *    这也是为什么不用 playSfx()：那个函数会把失败吞掉，
 *    这里需要知道"到底响没响"，才知道要不要补。
 */
function playStartSfx() {
  const url = pick(getAssets().sfx, SFX_ALIASES.start);
  if (!url || muted) return;

  let done = false;
  const attempt = () => {
    const a = new Audio(url);
    a.volume = volumes.sfx;
    a.muted = muted;
    return a.play();
  };

  attempt().then(
    () => { done = true; },
    () => {
      // 被自动播放策略拦下了 → 等第一次用户手势再放一次
      const retry = () => {
        document.removeEventListener('pointerdown', retry);
        document.removeEventListener('keydown', retry);
        if (done) return;
        done = true;
        attempt().catch(() => { /* 还是不行就算了，开机音效不值得报错 */ });
      };
      document.addEventListener('pointerdown', retry);
      document.addEventListener('keydown', retry);
    }
  );
}

// ------------------------------------------------------------
//  音效
// ------------------------------------------------------------
// 同一个 url 只解码一次，之后用 cloneNode 复制来播，这样能重叠播放
//（比如连续两次扣血，两个音效可以同时响）。
const sfxCache = new Map();

/**
 * 播放一个音效。
 * @param key 'select' | 'use' | 'damage' | 'heal'
 *
 * 注意：这里**不动背景音乐的音量**。
 * 曾经做过"闪避"（音效响时把 BGM 压低再涨回来），
 * 但那样 BGM 会忽大忽小，听感很怪。改成靠基准音量拉开差距：
 * BGM 0.3 / 音效 0.85，右上角面板还能自己调。
 */
function playSfx(key) {
  if (muted) return;

  const aliases = SFX_ALIASES[key] || [key];
  const url = pick(getAssets().sfx, aliases);
  if (!url) return; // 没放这个音效就安静地跳过

  let base = sfxCache.get(url);
  if (!base) {
    base = new Audio(url);
    base.preload = 'auto';
    sfxCache.set(url, base);
  }

  const hit = base.cloneNode(true);
  hit.volume = volumes.sfx;

  hit.play().catch(() => {
    // 播放失败就算了，音效不值得打断游戏
  });
}

// ------------------------------------------------------------
//  调试
// ------------------------------------------------------------
/** 浏览器控制台敲 __audio() 能看到认出来的音频清单 */
function getAudioManifest() {
  const a = getAssets();
  return { bgm: a.bgm, sfx: a.sfx };
}

/** 仅供自动化测试 */
function __resetForTest() {
  stopBgm();
  sfxCache.clear();
}

// ══════ src/ui/fx.js ══════
// ============================================================
//  src/ui/fx.js —— 屏幕中间的大特效（圆环扩散 + 卡图炸开）
// ============================================================
//
//  【做什么】
//    「大狗嚼」炸中、以及「哈气打断」拍成功的时候，
//    屏幕正中间放一下：
//
//      ① 一圈**彩色圆环**从中心扩散出去
//      ② 那张牌的卡图从中心冒出来：
//         不透明度 0 → 100（极快，和圆环同步）
//         尺寸 小 → 大（**加速度逐渐变小**，也就是先快后慢）
//         然后不透明度 100 → 0（较快），同时尺寸缩回去直到消失
//
//  【为什么不用"重画 HTML"那套】
//    整个界面是"状态一变就整块重画 innerHTML"。特效必须比一次重画活得久
//    （一次重画可能就发生在 100ms 之后，动画会被当场掐断），
//    所以这里**绕开重画**：自己 createElement、挂到 <body> 上，
//    动画放完自己删掉。这样引擎刷多少次界面都不影响它。
//
//  【连锁的哈气打断只放最后一次】
//    两张牌连着互相打断时，引擎只把 fx 挂在"真的拍成功"的那一下上；
//    这里再补一层保险：**同一种特效同时只留一个** ——
//    新的来了就把旧的立刻删掉，于是屏幕上只剩最后那一下。
//
//  【联机】
//    日志是服务器推给两个人的，fx 就挂在日志上（座位号已经跟着视角转好了），
//    所以两边看到的是同一件事。动画本身纯装饰，不同步也不影响对局。
// ============================================================





/**
 * 每种牌用哪套颜色、放多久、配什么图、配什么音效。
 *
 * 【图】
 *   优先用**专门的"命中"图**（比如「闪电（命中）」「哈气打断（命中）」，
 *   它们在 assets/cards/art/ 里和卡图放一起）；没放就退回那张牌的卡图。
 *
 * 【音效】
 *   名字自己认（见 audio.js 的别名表）：
 *   `闪电命中音效.mp3` 这种文件名会被认成"闪电命中"。
 */
const FX_STYLE = {
  dagou: {
    color: '#8b5cf6',
    glow: '#c4b5fd',
    ms: 900,
    artNames: ['闪电（命中）', '大狗嚼'],
    sfx: 'lightning',
  },
  hissStop: {
    color: '#0ea5e9',
    glow: '#7dd3fc',
    ms: 850,
    artNames: ['哈气打断（命中）', '哈气打断'],
    sfx: 'hissStop',
  },
  // 「耄耋附体」：屏幕中间的卡图是**耄耋（原初）**，
  // 音效用「使用装备牌和坐骑牌音效」（玩家指定，别用闪电那个）
  maodie: {
    color: '#e08a3c',
    glow: '#f7d9a8',
    ms: 1100,
    artNames: ['耄耋（原初）'],
    sfx: 'equip',
  },
  // ★ v1.5.2（隐藏关卡）：第三阶段耄耋打出的每一张杀都用这一套
  //（和「哈气打断」同款动画，**光环颜色由引擎传进来** = 耄耋的毛色）。
  //  这里的颜色只是"没传就用它"的兜底。
  hissFur: {
    color: '#e08a3c',
    glow: '#f7d9a8',
    ms: 850,
    artNames: ['哈气打断（命中）', '哈气打断'],
    sfx: 'hissStop',
  },
};

/** 没有配色的牌：给个通用的金色 */
const DEFAULT_STYLE = { color: '#f59e0b', glow: '#fde68a', ms: 850 };

/** 「打出的牌」亮多久（毫秒）—— 慢档底下也够看清了 */
const PLAYED_MS = 1100;

/** 「耄耋附体」那句台词的停留时间（玩家要求 5 秒） */
const AWAKEN_MS = 5000;
const AWAKEN_TEXT = '我回来了，你很惊喜吗？';

/**
 * ★ v1.5.2（隐藏关卡）：第三阶段那句台词的**停留时间**。
 * 比附体那句长一点（12 秒）—— 这是全游戏最后一段文字，玩家要看清楚。
 */
const APOCALYPSE_MS = 12000;
const APOCALYPSE_TEXT = '雕栏玉砌应犹在，只是朱颜改。。。';

/** 转义（这里只需要处理 < & ，够用了） */
function escText(s) {
  return String(s).replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

/**
 * 「命中」特效图 → 打包时用的 ASCII 名字。
 *
 * 为什么要导出这个？
 *   打包脚本要把素材改成 ASCII 文件名（`闪电（命中）.jpg` → `dagou-hit.jpg`）。
 *   它靠"图名 ↔ 牌名"来猜，但「闪电」是**原版三国杀**的名字，
 *   我们这张牌叫「大狗嚼」—— 猜不出来，就会掉进兜底的 unknown.jpg。
 *   所以这里把对应关系写死一份，让打包脚本照着用。
 *   ⚠️ 改了 FX_STYLE 里的 artNames，这里不用动（它就是从那儿推出来的）。
 */
const FX_ART_ALIASES = Object.entries(FX_STYLE).map(([cardId, s]) => ({
  cardId,
  // ⚠️ 只取**「命中」那张**：artNames 里排在后面的是"没放命中图就用普通卡图"
  //    的兜底项（比如「大狗嚼」），拿它去改名会把真正的卡图也改名成 -hit。
  names: (s.artNames || []).filter((n) => n.includes('命中')),
}));

function createFxPlayer() {
  let seenSeq = 0;
  /** cardId → 正在播的那个元素（同一种只留最新的一个） */
  const live = new Map();

  /** 有没有真的浏览器环境（自动化测试里是假 DOM，直接跳过） */
  function canShow() {
    return (
      typeof document !== 'undefined' &&
      !!document.body &&
      typeof document.createElement === 'function' &&
      typeof document.body.appendChild === 'function'
    );
  }

  function show(fx) {
    if (!canShow()) return;
    const cardId = fx.cardId;
    const def = CARD_DB[cardId];
    //  ★ v1.5.2：`fx.color` / `fx.glow` 可以**覆盖**配色 ——
    //    隐藏关卡里"耄耋的哈气"要用它自己的毛色（引擎把颜色一起发过来了）。
    const base = FX_STYLE[cardId] || DEFAULT_STYLE;
    const style = fx.color ? { ...base, color: fx.color, glow: fx.glow || base.glow } : base;

    // 同一种牌连着放 → 把上一个立刻删掉（连锁只留最后一下）
    const old = live.get(cardId);
    if (old && old.parentNode) old.parentNode.removeChild(old);

    const box = document.createElement('div');
    box.className = 'fx-burst';
    box.style.setProperty('--fx-color', style.color);
    box.style.setProperty('--fx-glow', style.glow);

    // 彩色圆环（conic-gradient + mask 挖空中间 → 一圈彩带）
    const ring = document.createElement('div');
    ring.className = 'fx-ring';
    box.appendChild(ring);

    // 单色光圈（让颜色更明确、也顺便当 glow）
    const halo = document.createElement('div');
    halo.className = 'fx-halo';
    box.appendChild(halo);

    // 卡图（优先用"命中"专用图；都没有就退回那张牌的卡图，最后是占位图）
    //  fx.artNames 可以覆盖（「耄耋附体」要显式指定「耄耋（原初）」）
    const names = (fx.artNames && fx.artNames.length ? fx.artNames : style.artNames) || [];
    // anyArt：卡图和武将图都查（「耄耋（原初）」是武将图）
    const artUrl = names.map((n) => anyArt(n)).find(Boolean) || (def ? cardArt(def) : '');
    if (artUrl) {
      const card = document.createElement('div');
      card.className = 'fx-card';
      card.style.backgroundImage = `url("${artUrl}")`;
      box.appendChild(card);
    }

    document.body.appendChild(box);
    live.set(cardId, box);

    // 音效（没放文件就静默，不影响画面）
    if (style.sfx) playSfx(style.sfx);

    // 动画放完自己删（用定时器而不是 animationend：
    // 三种动画时长不一样，而且动画被浏览器降级时 animationend 不一定来）
    setTimeout(() => {
      if (box.parentNode) box.parentNode.removeChild(box);
      if (live.get(cardId) === box) live.delete(cardId);
    }, style.ms + 200);
  }

  /**
   * 「打出的牌亮一下」——贴着那个人的座位显示。
   *
   * 需求原文：「使用卡牌时能不能有相应卡图出现的时间特效，
   *   放在使用者临近其界面UI的空余区域显示（没有如闪电命中等的花里胡哨，
   *   就只是为了让人看清 AI 使用了什么）」。
   *
   * 所以这个特效是**最朴素**的一种：卡图淡入 → 停一下 → 淡出。
   * 没有圆环、没有旋转、没有音效。
   * 位置是照着座位元素的当前位置算的（窗口大小会变，所以每次现算）。
   */
  function showPlayed(fx) {
    if (!canShow()) return;
    const def = CARD_DB[fx.cardId];
    if (!def) return;

    // render.js 会给每个座位挂 data-seat="座位号"
    const seat =
      typeof document.querySelector === 'function'
        ? document.querySelector(`[data-seat="${fx.who}"]`)
        : null;
    const rect =
      seat && typeof seat.getBoundingClientRect === 'function'
        ? seat.getBoundingClientRect()
        : null;

    const box = document.createElement('div');
    box.className = 'fx-played';
    if (rect && rect.width) {
      // 「临近他的界面 UI」：横向对着他座位的中间，
      // 纵向压在他座位靠中间那一侧（别挡住手牌区）
      const mine = !!(seat.classList && seat.classList.contains('me'));
      box.style.left = `${Math.round(rect.left + rect.width / 2)}px`;
      box.style.top = `${Math.round(mine ? rect.top + 44 : rect.bottom - 44)}px`;
    }

    const card = document.createElement('div');
    card.className = 'fx-played-card';
    card.style.backgroundImage = `url("${cardArt(def)}")`;
    box.appendChild(card);
    const name = document.createElement('div');
    name.className = 'fx-played-name';
    name.textContent = def.name;
    box.appendChild(name);

    // 同一个人连着出牌 → 把上一个立刻换掉，别叠在一起
    const key = `played:${fx.who}`;
    const old = live.get(key);
    if (old && old.parentNode) old.parentNode.removeChild(old);

    document.body.appendChild(box);
    live.set(key, box);

    setTimeout(() => {
      if (box.parentNode) box.parentNode.removeChild(box);
      if (live.get(key) === box) live.delete(key);
    }, PLAYED_MS + 150);
  }

  /**
   * ★ v1.5.2：**整页抖一下**（屏幕震动）。
   *
   * 原本只有「耄耋附体」用这段；玩家要求"猫将受伤时也要有跟耄耋附体
   * 发动时相同的屏幕震动"，所以抽成一个函数、两处共用。
   *
   * ⚠️ 用的是**同一个 CSS 动画**（`awaken-quake`），只是类名分开：
   *    · `awaken-shake` —— 耄耋附体那一发
   *    · `hit-shake`    —— 挨打
   *    类名分开是为了以后想单独调其中一个的时长/幅度时不用动另一个。
   *
   * @param cls 类名（默认 hit-shake）
   */
  function screenShake(cls = 'hit-shake', ms = 900) {
    const rootEl = document.documentElement || document.body;
    if (!rootEl || !rootEl.classList) return; // 自动化测试的假 DOM：什么都不做
    rootEl.classList.remove(cls);
    // 强制重排一下：这样**连着触发**（比如一张全场牌打好几个人）也会重放动画，
    // 而不是因为"类名没变"被浏览器当成没变化、一动不动
    void rootEl.offsetWidth;
    rootEl.classList.add(cls);
    setTimeout(() => rootEl.classList.remove(cls), ms);
  }

  /**
   * ★ v1.5.2：屏幕下方那行"逐字波浪"的台词（附体 / 最终之战共用）。
   *
   * 【为什么要抽出来】
   *   两处只差三个东西：文字、CSS 类名、停留多久。
   *   而且第二处的字**更大、还会摆 + 抽搐**（玩家要求），
   *   那些全在 CSS 里（`.fx-awaken-line` / `.fx-apocalypse-line`），
   *   这里只负责"逐字拆开、错开动画延迟"。
   */
  function showLine(text, cls, ms) {
    if (!canShow()) return;
    const line = document.createElement('div');
    line.className = cls;
    // 逐字拆开，每个字错开一点动画延迟 —— 这就是"波浪"的来源
    line.innerHTML = [...text]
      .map((ch, i) => `<span style="animation-delay:${(i * 0.09).toFixed(2)}s">${escText(ch)}</span>`)
      .join('');
    document.body.appendChild(line);

    setTimeout(() => {
      if (line.parentNode) line.parentNode.removeChild(line);
    }, ms + 300);
  }

  /**
   * ★ v1.5.2（隐藏关卡）：「你。。。看到我了？」发动时的大特效。
   *
   * 玩家要求（原话）：
   *   ① "会有跟技能2一样的视觉效果，不过**屏幕震动得更厉害**，
   *      之后屏幕会一直处于微震动且摆动的状态"
   *      → 形状还是那一套（圆环 + 卡图炸开），但换 `apocalypse-shake`，
   *        而且**这一发之后**的持续抖动由 main.js 挂到 <body> 上（`.final-quake`）。
   *   ② "底下的文字……改为「雕栏玉砌应犹在，只是朱颜改。。。」，
   *      且字体更大，摆动而有抽搐"
   *      → `.fx-apocalypse-line`
   *
   * ⚠️ 音效照旧由 show() 放（FX_STYLE.maodie.sfx = 'equip'），这里不重复放。
   */
  function showApocalypse(fx) {
    if (!canShow()) return;

    // ① 和「耄耋附体」同款的形状（圆环 + 「耄耋（原初）」卡图炸开）
    show({ kind: 'burst', cardId: 'maodie', who: fx.who, color: fx.color });

    // ② 更狠的一下震动（1.6 秒，比附体那 0.9 秒更剧烈）
    screenShake('apocalypse-shake', 1600);

    // ③ 底下那行诗
    showLine(APOCALYPSE_TEXT, 'fx-apocalypse-line', APOCALYPSE_MS);
  }

  /**
   * 「耄耋附体」专用的大特效。
   *
   * 玩家要求（原话）：
   *   · 卡图换成「耄耋（原初）」，**和闪电命中同款**（圆环 + 卡图炸开）
   *   · 画面**突然剧烈震动**
   *   · 音效「使用装备牌和坐骑牌音效」
   *   · 再加一段**持续 5 秒**的文字："我回来了，你很惊喜吗？"
   *     偏大但不过分遮挡 UI；字色跟「耄耋（原初）」的毛色一样、文字发光、
   *     以**波浪形**悬浮飘动
   */
  function showAwaken(fx) {
    if (!canShow()) return;

    // ① 和"闪电命中"同款的**形状**（圆环 + 卡图炸开），
    //    但卡图是「耄耋（原初）」、音效是"使用装备牌和坐骑牌"——
    //    这两样由 FX_STYLE.maodie 决定（别复用 dagou，那会带上闪电的图和音）
    show({ kind: 'burst', cardId: 'maodie', who: fx.who });

    // ② 画面剧烈震动（挂到 <html> 上，连整页一起抖）
    screenShake('awaken-shake');

    // ③ 音效已经在 show() 里放了（FX_STYLE.maodie.sfx = 'equip'），
    //    这里不能再放一次，会叠成两声。

    // ④ 5 秒的波浪文字（★ v1.5.2：抽成了共用的 showLine）
    showLine(AWAKEN_TEXT, 'fx-awaken-line', AWAKEN_MS);
  }

  return {
    /**
     * 每次重画之前调一次：把"上次之后新出现的特效"放出来。
     * 和 shake.js 一样用 seq 当水位（日志数组满了会从头丢，不能用下标）。
     */
    play(state) {
      const log = (state && state.log) || [];
      for (const line of log) {
        const seq = line.seq || 0;
        if (seq <= seenSeq) continue;
        //  ★ v1.5.2（玩家要求）：**猫将受伤 → 屏幕也震一下**
        //    （和「耄耋附体」发动时**同一个动画**，见 screenShake）
        if (line.cls === 'damage') screenShake('hit-shake');
        if (!line.fx) continue;
        //  ⚠️ 出牌时"贴着座位亮一下那张牌"—— **身份局照样要亮**。
        //     曾经因为"中间有出牌区了，两边都画重复"而在身份局关掉过一阵子，
        //     后来玩家把中间那块（可滑动的卡图列表）也要求撤了，于是
        //     玩家发现"使用卡牌的卡图显示怎么不见了" —— 所以又亮回来了。
        //     现在它是**全模式唯一**的"出了什么牌"的图形提示（文字看战斗日志）。
        if (line.fx.kind === 'played') showPlayed(line.fx);
        else if (line.fx.kind === 'awaken') showAwaken(line.fx);
        //  ★ v1.5.2（隐藏关卡）
        else if (line.fx.kind === 'apocalypse') showApocalypse(line.fx);
        else if (line.fx.kind === 'hissFur') show({ kind: 'burst', cardId: 'hissFur', ...line.fx });
        else show(line.fx);
      }
      if (log.length) {
        const last = log[log.length - 1].seq || 0;
        if (last > seenSeq) seenSeq = last;
      }
    },

    /** 新的一局：水位归零，顺便清掉还在飘的特效 */
    reset() {
      seenSeq = 0;
      for (const el of live.values()) {
        if (el.parentNode) el.parentNode.removeChild(el);
      }
      live.clear();
    },

    /** 仅供自动化测试 */
    state() {
      return { seenSeq, live: [...live.keys()] };
    },
    /** 仅供自动化测试：手动放一个 */
    __showForTest: show,
  };
}

// ============================================================
//  src/ui/joinurl.js —— "朋友要往哪儿跳" 的纯逻辑
// ============================================================
//
//  单文件版首页有个输入框：「朋友邀请你联机？」
//  朋友可能会往里粘三种东西：
//
//    ① 房主发来的完整链接   http://192.168.1.5:5173/pvp.html?room=ABCD
//    ② 只有地址没有房间号   http://192.168.1.5:5173
//    ③ **只有房间码**       ABCD        ← 最容易卡住人的一种
//
//  第 ③ 种为什么要单独处理？
//    房间码（比如 ABCD）本身**不含任何地址信息** —— 它是房主那台电脑
//    内存里的一个编号。光有它，浏览器不可能知道去哪台机器找人。
//
//    所以分两种情况：
//      · 这个页面本身就是"从房主那台电脑打开的"（http + 端口）
//        → 说明已经在房主那台机器上了，直接拼 /pvp.html?room=XXXX 就行
//      · 页面是本地文件（file://），且从没连过房主
//        → 认不出来，必须明确告诉朋友"让房主把完整链接发过来"，
//          而不是默默失败（以前就是这样，朋友会以为程序坏了）
//
//  这一小段逻辑单独放一个文件，是为了**能脱离浏览器测**（见
//  tools/uicheck.mjs 里的"朋友怎么进房间"那一节）。
//  DOM 相关的部分（读写输入框、跳转）留在 main.js。
// ============================================================

/** 上次成功连上的那台房主电脑，存在浏览器本地 */
const JOIN_ORIGIN_KEY = 'jmd-pvp-origin';

/** 房间码长这样：4~6 位大写字母数字（服务器发的是 4 位） */
function isRoomCode(raw) {
  return /^[A-Z0-9]{4,6}$/.test(String(raw || '').trim().toUpperCase());
}

/** 从一段字符串里挑出"能用的 http 地址"，挑不出就返回空串 */
function cleanOrigin(v) {
  const s = String(v || '').trim().replace(/\/+$/, '');
  return /^https?:\/\/[^\s/]+$/.test(s) ? s : '';
}

/**
 * 该往哪儿跳？
 *
 * @param raw   输入框里的原文
 * @param ctx   { protocol, origin, port, remembered }
 *              —— 对应 location.protocol / location.origin / location.port
 *                 以及上次记住的房主地址
 * @returns {{ ok: true, href: string } | { ok: false, message: string }}
 *          ok:false 时 message 是要显示在输入框下面的红字
 */
function resolveJoinTarget(raw, ctx = {}) {
  const text = String(raw || '').trim();
  if (!text) return { ok: false, message: '把房主发给你的网址粘进来吧' };

  const { protocol = '', origin = '', port = '', remembered = '' } = ctx;

  // ---- 情况 ③：只输入了房间码 ----
  if (isRoomCode(text)) {
    const code = text.toUpperCase();

    // 这个页面本身就跑在房主那台电脑上（http + 端口）
    if (/^https?:$/.test(protocol) && port) {
      return { ok: true, href: `${origin}/pvp.html?room=${code}` };
    }

    // 之前成功进过一次 → 记得那台机器的地址，这回直接用
    const known = cleanOrigin(remembered);
    if (known) {
      return { ok: true, href: `${known}/pvp.html?room=${code}` };
    }

    return {
      ok: false,
      message:
        `光有房间码 ${code} 认不出房主在哪台电脑上。` +
        `让房主把他屏幕上那条链接整个发给你（形如 ` +
        `http://192.168.1.5:5173/pvp.html?room=${code}）—— ` +
        `要粘**整条链接**，只打房间码是不行的`,
    };
  }

  // ---- 情况 ① / ②：粘的是网址（可能没带 http://） ----
  let url = text;
  if (!/^https?:\/\//i.test(url)) url = 'http://' + url;

  let parsed;
  try {
    parsed = new URL(url);
  } catch {
    return {
      ok: false,
      message: '这个看起来不是网址……要形如 http://192.168.1.5:5173/pvp.html?room=ABCD',
    };
  }

  // http 一定要带端口 —— 房主的服务器跑在 5173 之类的端口上，
  // 少了端口号浏览器会去敲 80 端口，一定是打不开的。
  if (!parsed.port && parsed.protocol === 'http:') {
    return {
      ok: false,
      message: '网址里少了端口号，应该是 :5173 结尾（例如 http://192.168.1.5:5173/pvp.html）',
    };
  }

  // 只粘了 ip:端口（没带 /pvp.html）也帮他补上
  if (!/pvp\.html/.test(parsed.pathname)) parsed.pathname = '/pvp.html';

  return { ok: true, href: parsed.toString(), origin: parsed.origin };
}
