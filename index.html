// ============================================================
//  src/ui/video.js —— 视频：隐藏关卡的背景 / 结局动画
// ============================================================
//
//  【两段视频，两种用法】
//
//    ① **背景**（`assets/video/background/`）
//       触发隐藏技能之后，整局游戏的背景换成它，**循环、无声**。
//       （需求原文："视频背景改为 assets/video/background 中的画面背景，
//         你自己把视频改成无声并把比例调整为 1920*1080"）
//       ⚠️ 必须无声：它要一直放着，而这时候还有 BGM 和音效 ——
//          背景视频自带的声音会和它们打架。
//       ⚠️ 转码交给 `tools/prepare-video.mjs`（这台机器上装了 ffmpeg）。
//
//    ② **结局**（`assets/video/the end/耄耋的梦该醒了.mp4`）
//       打死第三阶段的耄耋、从胜利画面回主菜单时放一次，**放完自动回主菜单**。
//       这一段**保留原声**：那是结局的一部分（放它之前引擎那边已经把 BGM 停了，
//       所以不会和 BGM 打架）。音量跟着"背景音乐"那条滑杆走，静音开关也认。
//
//  【为什么元素挂在 <body> 上，而不是画进 #app】
//    和 fx.js 一个道理：`#app` 是"状态一变就整块 innerHTML 重画"的，
//    视频要是画在里面，每 600ms 被重画一次 = 一直从头开始播。
//    所以它们自己 createElement、挂到 <body>，重画多少次都不受影响。
// ============================================================




/** 背景视频的候选名（文件名随便起，能认出来就行） */
const BG_VIDEO_KEYS = ['画面背景', '背景视频', '战场背景', '古战场', 'background', 'arena'];

/** 结局视频的候选名 */
const ENDING_VIDEO_KEYS = ['耄耋的梦该醒了', '梦该醒了', '结局', 'ending', 'theend'];

/**
 * ★ 打包时的"中文名 → ASCII 文件名"对照表。
 *
 * 为什么需要它：单文件版（file:// 双击打开）里，中文文件名会因为百分号编码
 * 而加载失败（这个坑在卡图那边踩过，见 README）。所以打包时把视频重命名成
 * ASCII，**清单的 key 仍然保留中文原名**（匹配逻辑靠它）。
 *
 * ⚠️ 打包脚本（tools/build-standalone.mjs）直接 import 这个表，
 *    所以这里加一条，打包那边不用动。没写进来的会掉进 unknown-N.mp4
 *    （`check-standalone` 会因此报"名字没有意义"）。
 */
const VIDEO_ASCII_NAMES = {
  画面背景: 'apocalypse-bg',
  耄耋的梦该醒了: 'ending',
};

/** 按候选名找视频地址（清单由 server.mjs / 打包脚本生成） */
function findVideo(keys) {
  return pick(getAssets().video, keys);
}

/** 有没有真的浏览器环境（自动化测试里是假 DOM，全部跳过） */
function canUseDom() {
  return (
    typeof document !== 'undefined' &&
    !!document.body &&
    typeof document.createElement === 'function' &&
    typeof document.body.appendChild === 'function'
  );
}

// ------------------------------------------------------------
//  ① 背景视频（循环 + 无声）
// ------------------------------------------------------------
let bgEl = null;

/**
 * 打开 / 关掉"最终之战"的背景视频。
 * @param on true = 换成本关的背景视频；false = 撤掉（回到正常背景）
 */
function setFinalBackground(on) {
  if (!on) {
    if (bgEl && bgEl.parentNode) bgEl.parentNode.removeChild(bgEl);
    bgEl = null;
    if (typeof document !== 'undefined' && document.body && document.body.classList) {
      document.body.classList.remove('has-final-bg');
    }
    return;
  }

  if (!canUseDom() || bgEl) return; // 已经有了就别重来（重画会调很多次）

  const url = findVideo(BG_VIDEO_KEYS);
  if (!url) return; // 没放视频就什么都不做（不报错）

  const v = document.createElement('video');
  v.className = 'final-bg';
  v.src = url;
  v.loop = true;
  v.muted = true; // ★ 无声：需求明确要求
  v.autoplay = true;
  v.setAttribute('playsinline', '');
  v.setAttribute('aria-hidden', 'true');
  document.body.appendChild(v);
  // 浏览器可能拦自动播放（虽然 muted 一般不会被拦）—— 拦了就等下一次点击补一下
  const p = typeof v.play === 'function' ? v.play() : null;
  if (p && typeof p.catch === 'function') p.catch(() => {});
  if (document.body.classList) document.body.classList.add('has-final-bg');

  bgEl = v;
}

// ------------------------------------------------------------
//  ② 黑屏 + 一行白字（结局的入场）
// ------------------------------------------------------------
/**
 * 铺一层黑屏，中间一行静止的白色小字。
 * @returns {{ remove: () => void }} 拿它收场
 */
function showBlackoutLine(text) {
  if (!canUseDom()) return { remove() {} };

  const box = document.createElement('div');
  box.className = 'ending-blackout';
  const line = document.createElement('p');
  line.className = 'ending-line';
  line.textContent = text;
  box.appendChild(line);
  document.body.appendChild(box);

  return {
    remove() {
      if (box.parentNode) box.parentNode.removeChild(box);
    },
    el: box,
  };
}

// ------------------------------------------------------------
//  ③ 结局视频（放一次，放完 resolve）
// ------------------------------------------------------------
/**
 * 放结局视频。
 *
 * 【返回值】一个 Promise：放完了 / 播不了 / 玩家点了画面 → 都会 resolve。
 *   ⚠️ 一定要有"播不了也 resolve"的兜底 —— 素材缺失、编码不支持、
 *      浏览器拦截……任何一种都可能发生，而这里挂着的是"回主菜单"，
 *      卡住就等于游戏结束了还回不去。
 *
 * @returns {Promise<'ended'|'skipped'|'failed'>}
 */
function playEndingVideo() {
  if (!canUseDom()) return Promise.resolve('failed');

  const url = findVideo(ENDING_VIDEO_KEYS);
  if (!url) return Promise.resolve('failed');

  return new Promise((resolve) => {
    const v = document.createElement('video');
    v.className = 'ending-video';
    v.src = url;
    v.autoplay = true;
    v.setAttribute('playsinline', '');
    // 音量跟着"背景音乐"那条滑杆（它现在是唯一的声源）
    try {
      v.volume = getVolumes().bgm;
      v.muted = isMuted();
    } catch {
      /* 假 DOM / 隐私模式，忽略 */
    }

    let done = false;
    const finish = (how) => {
      if (done) return;
      done = true;
      if (v.parentNode) v.parentNode.removeChild(v);
      resolve(how);
    };

    v.addEventListener('ended', () => finish('ended'));
    v.addEventListener('error', () => finish('failed'));
    // 点一下跳过（万一播放卡住，玩家不至于被锁在结局里）
    v.addEventListener('click', () => finish('skipped'));

    document.body.appendChild(v);

    const attempt = v.play();
    if (attempt && typeof attempt.catch === 'function') {
      attempt.catch(() => {
        // 有声音的自动播放被拦了 → 退成静音再试一次（至少画面能放完）
        try {
          v.muted = true;
          const again = v.play();
          if (again && typeof again.catch === 'function') {
            again.catch(() => finish('failed'));
          }
        } catch {
          finish('failed');
        }
      });
    }

    // 兜底：视频长度未知 / ended 事件不来（有些浏览器 file:// 下会这样）
    // 就按"最多 3 分钟"收场，绝不让玩家卡在结局里
    setTimeout(() => finish('ended'), 180000);
  });
}

/** 仅供自动化测试：现在有没有背景视频挂着 */
function __bgStateForTest() {
  return { hasBg: !!bgEl };
}

// ══════ src/ui/main.js ══════
// ============================================================
//  main.js —— 网页的入口：把引擎、AI、界面接在一起
// ============================================================
//
//  数据流向是这样的：
//
//     你点击一张牌
//          ↓
//     main.js 收集你的选择
//          ↓
//     engine.js 继续推进规则
//          ↓
//     状态变了 → 调用 onUpdate → render.js 重画界面
//          ↓
//     你又看到新的画面
//
//  main.js 是唯一同时认识"引擎"和"界面"的文件。
//  引擎不认识界面，界面也不认识引擎 —— 这样才好维护。
//
//  【三个界面】
//     levels   选关：看这一关的对手是哪只猫
//     heroPick 选猫：你从剩下三只里挑一只
//     playing  对局
// ============================================================













// ★ v1.5.2（隐藏关卡）：背景视频 + 结局动画


const root = document.getElementById('app');

// ------------------------------------------------------------
//  界面自己的状态（引擎不关心这些）
// ------------------------------------------------------------
// ============================================================
//  出牌速度（三档）
// ============================================================
//  玩家反馈：「AI 出牌过快，看不清操作，能不能减慢一点速度」。
//
//  这里的数字就是引擎的 stepDelay —— 引擎每走一步都会等这么久，
//  所以它同时决定了"AI 出完一张牌之后停多久"。
//  慢档还给"打出的牌亮一下"（见 fx.js）留出了看清的时间。
//  （三档的名字和说明在 render.js 的 SPEEDS 里，纯展示的东西不放在这边）
const SPEED_KEY = 'jmd-speed';

function readSpeed() {
  try {
    const v = localStorage.getItem(SPEED_KEY);
    return SPEEDS[v] ? v : 'normal';
  } catch {
    return 'normal';
  }
}

/** 当前档位对应的 stepDelay（毫秒） */
function stepDelayOf(speed = ui.speed) {
  return (SPEEDS[speed] || SPEEDS.normal).ms;
}

/**
 * 切换出牌速度（慢 → 正常 → 快 → 慢…），存到本地，下次打开还记得。
 * ⚠️ 这是**对局里**那颗按钮用的（轮换）。主界面上的速度选择器是
 *    "点哪个是哪个"（见 setSpeed），两边改的是同一个 `ui.speed`。
 */
function cycleSpeed() {
  const order = ['slow', 'normal', 'fast'];
  const i = order.indexOf(ui.speed);
  ui.speed = order[(i + 1) % order.length];
  saveSpeed();
  render();
}

/**
 * ★ v1.5.2（玩家要求）：**直接指定**出牌速度（主界面那三颗按钮用）。
 * 玩家原话：「在主界面就能调整 AI 的流速，就是"快""正常""慢"」。
 */
function setSpeed(id) {
  if (!SPEEDS[id]) return;
  ui.speed = id;
  saveSpeed();
  render();
}

/** 把当前速度记到本地（两个入口共用） */
function saveSpeed() {
  try {
    localStorage.setItem(SPEED_KEY, ui.speed);
  } catch {
    /* 隐私模式写不进去，无所谓 */
  }
}

const ui = {
  //  三种模式（见 render.js 的 MODES）  //    'pve1v1'  模式 1：1v1 打 AI（原来的玩法）
  //    'pvp1v1'  模式 2：1v1 联机，两台设备
  //    'team2v2' 模式 3：你 + AI 队友  vs  两个 AI
  mode: 'pve1v1',
  // 联机模式要用：服务器能不能用（单文件版双击打开时用不了）
  pvpAvailable: false,

  screen: 'mode',          // 'mode' | 'levels' | 'heroPick' | 'playing'
  levelId: 1,              // 当前第几关（模式 1 用）
  playerHeroId: null,      // 你挑了哪只猫
  teammateHeroId: null,    // 模式 3：给你配的队友
  difficulty: 'normal',
  cleared: new Set(),      // 已通关的关卡
  //  ★ v1.5.2（隐藏关卡）：
  //    · perfect          —— "完美通关"的关卡（第 7 关：连第三阶段的耄耋都打死了）
  //    · hiddenBoss       —— **这一局**打的是不是隐藏 Boss（每次开局重算）
  //    · epilogueRunning  —— 结局动画正在放（界面**先不画结算画面**）
  //    · epilogueDone     —— 这一局的结局已经放过了（只放一次）
  //    · finalBgmStarted  —— 「最终之战」这首已经切过去了没（只切一次）
  perfect: new Set(),
  hiddenBoss: false,
  epilogueRunning: false,
  epilogueDone: false,
  finalBgmStarted: false,
  selected: new Set(),     // 当前选中的牌（存 uid）
  audioOpen: false,        // 右上角声音面板开着没
  noticesHiddenAfterSeq: 0, // seq 小于等于它的临时提示，已经过期不显示了
  myIndex: 0,              // "屏幕上的你"是几号座位
  firstSeat: 0,            // 猜拳赢的人先手（座位号）
  rps: null,               // 猜拳的临时状态（1v1）
  dice: null,              // 摇骰子的临时状态（2v2）
  pendingSeats: null,      // 2v2 摇骰子时先算好的座位表（开局直接复用）
  speed: readSpeed(),      // 出牌速度：'slow' | 'normal' | 'fast'（见 SPEEDS）

  // 下面两个的真身都在 audio.js 里，这里只是给界面读的
  get muted() {
    return isMuted();
  },
  get volumes() {
    return getVolumes();
  },
};

let game = null;
let lastPending = null;    // 用来发现"引擎换新问题了"，换了就清空选择
let gameSeq = 0;           // 对局编号：返回选关时 +1，让还在跑的旧对局失效

// ============================================================
//  音效：靠"新日志"来驱动
// ============================================================
//  引擎每写一条日志都会带一个递增的 seq。
//  这里记住上次处理到哪了，只对**新出现的**日志播声音。
//
//  为什么不直接让引擎调 playSfx？
//    那样规则引擎就要认识 audio.js 了，破坏"引擎不认识界面"的分层。
//    日志已经是引擎对外的唯一播报渠道，顺着它走最干净。
let lastLogSeq = 0;

// 哪几种日志对应哪个音效
const LOG_SFX = {
  damage: 'damage', // 受到气势伤害
  heal: 'heal',     // 回复气势值
  use: 'use',       // 打出一张牌
  equip: 'equip',   // 穿装备 / 坐骑（有自己的音效，没放就退回"使用卡牌"）
  steal: 'use',     // 大号老鼠偷牌也出个声
};

function playLogSounds(state) {
  const fresh = state.log.filter((l) => (l.seq || 0) > lastLogSeq);
  if (fresh.length === 0) return;

  lastLogSeq = fresh[fresh.length - 1].seq;

  // 一次可能冒出好几条同类日志（比如歪头连打），同一种音效只播一次，
  // 不然会糊成一团。
  const keys = new Set();
  for (const l of fresh) {
    const k = LOG_SFX[l.cls];
    if (k) keys.add(k);
  }
  for (const k of keys) playSfx(k);
}

// ============================================================
//  临时提示：过几秒自动消失
// ============================================================
//  比如"你偷到了「抓挠」"。它是吐司，不是常驻信息。
//  引擎只负责塞进 state.notices 并带上 seq，什么时候藏起来是界面的事。
//
//  ⚠️ 这里踩过一个坑，值得写清楚：
//
//  第一版是"每次界面刷新就 clearTimeout + 重新 setTimeout(5000)"，
//  看着没问题，其实是坏的 —— 引擎每 ~600ms 就会刷新一次界面，
//  于是这个 5 秒计时器**每次都被重置，永远等不到触发**，
//  提示就一直挂在屏幕上。
//
//  而且当时的自动化测试只测了"过滤逻辑"（手动把 hiddenAfter 设成 1 看还画不画），
//  没有测"计时器到底会不会触发"，所以测试全绿、bug 还在。
//
//  现在：只在**出现新提示（seq 变了）**时才重新计时。
//
//  这段逻辑现在住在一个共享模块里（ui/noticefade.js），
//  单机和联机共用同一份 —— 联机那边就是漏抄了这段，
//  才出现"偷牌提示一直挂在屏幕上"的 bug。
const noticeFader = createNoticeFader(() => render());

// "谁刚挨了打" —— 每次重画前扫一遍新日志，给那个座位挂一帧 shake 类名
const shakeTracker = createShakeTracker();

// 屏幕中间的大特效（大狗嚼炸中 / 哈气打断拍成功）
const fxPlayer = createFxPlayer();

function scheduleNoticeFade(state) {
  noticeFader.schedule(state.notices);
  ui.noticesHiddenAfterSeq = noticeFader.hiddenAfter;
}

// 仅供自动化测试：把停留时间调短，好在测试里真的等一次
function __setNoticeMsForTest(ms) {
  noticeFader.setMs(ms);
}
function __scheduleNoticeFadeForTest(state) {
  scheduleNoticeFade(state);
}

/** 仅供自动化测试：看看计时器现在的状态 */
function __getNoticeStateForTest() {
  ui.noticesHiddenAfterSeq = noticeFader.hiddenAfter;
  return noticeFader.state();
}

// ============================================================
//  重画
// ============================================================
function render() {
  try {
    renderInner();
  } catch (e) {
    // 画面崩了别装死：直接把错误显示出来，比"一片空白/卡住不动"好排查得多。
    // （联机那边就是因为 render 抛异常静默失败，害得玩家以为是"数据没同步"。）
    console.error('[界面] 渲染出错：', e);
    root.innerHTML = `
      <div class="start-screen">
        <h1>😿 画面出错了</h1>
        <p class="pvp-error">${esc(e && e.message ? e.message : String(e))}</p>
        <p class="join-note">
          按 <b>F12</b> 打开控制台，把红色的报错截图发给我。
        </p>
        <button class="btn btn-main" data-action="back">返回</button>
      </div>`;
  }
}

function renderInner() {
  // 引擎换了新问题 → 清空上次的选择
  const currentPending = game ? game.state.pending : null;
  if (currentPending !== lastPending) {
    lastPending = currentPending;
    ui.selected.clear();
  }

  if (ui.screen === 'mode') {
    root.innerHTML = renderModeSelect(ui);
    return;
  }
  if (ui.screen === 'levels') {
    root.innerHTML = renderLevelSelect(ui);
    return;
  }
  if (ui.screen === 'rps') {
    root.innerHTML = renderRps(ui);
    return;
  }
  if (ui.screen === 'dice') {
    root.innerHTML = renderDice(ui);
    return;
  }
  if (ui.screen === 'heroPick' || !game) {
    ui.shake = new Set();     // 不在对局里，谁也不抖
    root.innerHTML = renderHeroPick(ui);
    return;
  }

  // ★ 顺序很重要：**先**收这一帧该抖谁（会推进内部水位），再画。
  //   画完这一帧水位就过去了，下一帧自然不抖 —— 动画正好放一次。
  ui.shake = shakeTracker.collect(game.state);
  // 屏幕特效是**独立于重画**的（挂在 <body> 上），什么时候调都行
  fxPlayer.play(game.state);

  // ★ v1.5.2（隐藏关卡）：第三阶段（"最终之战"）的**持续**视觉状态
  applyFinalPhase(game.state);

  // 战斗日志：只在"他本来就贴着底部"时才跟着最新一条走。
  // 不能无脑 scrollTop = scrollHeight —— 那样他一往上翻看历史，
  // 引擎每 600ms 刷新一次就把他拽回底部。
  withLogAtBottom(() => {
    root.innerHTML = renderGame(game.state, ui);
  });
}

// ============================================================
//  ★ v1.5.2（隐藏关卡）："最终之战"形态的持续视觉
// ============================================================
//  玩家要求（触发技能 3 之后）：
//    · "之后屏幕会一直处于微震动且摆动的状态"        → #app 挂 .final-quake
//    · "视频背景改为 assets/video/background 中的画面背景" → 循环播放（无声）
//    · "bgm 固定切换为「最终之战」"                  → 切一次就够，之后别再动
//  这三件事都是"状态"，不是"一下子的特效"，所以每帧照着 counters 同步一次；
//  状态没了（新的一局 / 退了）就全部撤掉。
//
//  ⚠️ 判定用的是 `counters.maodieFinal`（引擎进入第三阶段时种下的标记）：
//     联机视图也会带上 counters，所以这套写法在两边都成立。
//
//  ★ 但还要**再看一眼 `state.over`** —— 这是玩家报的一个 bug：
//    「耄耋被打死进入动画后仍然会有『最终之战』的音乐」。
//    原因：第三阶段那个标记**死了也还在身上**，而结局流程里 `clearFinalPhase()`
//    把 `finalPhaseOn` 清成了 false；等结局放完 render() 一跑，
//    `isFinalPhase` 又说"是第三阶段" → **把「最终之战」重新放了一遍**。
//    所以：**这一局已经结束了 → 就没有"最终之战"状态了**（背景视频、持续抖动、
//    固定 BGM 一起收掉）。玩家死了（打输）也走这一条，一样合理：仗打完了。
function isFinalPhase(state) {
  if (!state || state.over) return false;
  return (state.players || []).some((p) => p.counters && p.counters.maodieFinal);
}

let finalPhaseOn = false;

function applyFinalPhase(state) {
  const on = isFinalPhase(state);
  if (on === finalPhaseOn) {
    //  状态没变，但"第一次"那一帧还没切 BGM 的话补一次
    if (on && !ui.finalBgmStarted) switchToFinalBgm();
    return;
  }
  finalPhaseOn = on;

  //  ★ 持续抖动挂在 **#app** 上（不是 <body>）：背景视频是 body 的孩子，
  //    给 body 加 transform 会让它变成新的包含块，视频/黑屏那些 fixed 元素
  //    就会改成相对 body 定位（见 style.css 里 final-quake 的说明）。
  if (root && root.classList) root.classList.toggle('final-quake', on);
  setFinalBackground(on);

  if (on) switchToFinalBgm();
  else ui.finalBgmStarted = false;
}

/** 「bgm 固定切换为『最终之战』」—— 一局只切一次 */
function switchToFinalBgm() {
  ui.finalBgmStarted = true;
  playBgm(FINAL_BGM_KEYS);
}

/** 离开对局 / 开新局：把"最终之战"的那些持续视觉收拾干净 */
function clearFinalPhase() {
  finalPhaseOn = false;
  ui.finalBgmStarted = false;
  if (root && root.classList) root.classList.remove('final-quake');
  setFinalBackground(false);
}

// ============================================================
//  点击一张手牌
// ============================================================
function onCardClick(uid) {
  const pending = game && game.state.pending;
  if (!pending) return; // 现在没在问你，点了也没用

  const card = pending.player.hand.find((c) => c.uid === uid);
  // 不合法的牌不许选（引擎也会再挡一层，双保险）
  if (!card || !pending.legal.includes(card)) return;

  const { max } = pending.question;

  if (ui.selected.has(uid)) {
    ui.selected.delete(uid);
  } else if (max === 1) {
    ui.selected.clear();
    ui.selected.add(uid);
  } else if (ui.selected.size < max) {
    ui.selected.add(uid);
  } else {
    // 选满了，把最早选的挤掉（防止卡住没法改）
    const oldest = ui.selected.values().next().value;
    ui.selected.delete(oldest);
    ui.selected.add(uid);
  }

  playSfx('select'); // 选中 / 取消选中的音效
  render();
}

// ============================================================
//  开一局
// ============================================================
/** 开局前把公共状态收拾干净（三种模式都要走一遍） */
function prepareNewGame() {
  ui.screen = 'playing';
  ui.selected.clear();
  lastPending = null;
  lastLogSeq = 0;              // 新的一局，日志序号从头数
  ui.noticesHiddenAfterSeq = 0; // 提示也重新开始
  // ★ v1.5.2：上一局要是打过"最终之战"，这一局开头得把那些持续视觉撤掉
  clearFinalPhase();
  // ★ v1.5.2：结局是"一局一次"的，新的一局把标记清掉
  ui.epilogueDone = false;
  ui.epilogueRunning = false;
  // ⚠️ 这里以前写的是 `clearTimeout(noticeTimer)` —— 但那个变量早就没有了
  //    （提示淡出的逻辑后来抽成了 noticefade.js 的 noticeFader）。
  //    于是这一行每次都会抛 `ReferenceError: noticeTimer is not defined`，
  //    而它正好在"开局"的第一步 —— **三个模式全都开不了局**。
  //    现在改叫共享模块自己的 reset()，从根上不会再走丢。
  noticeFader.reset();
  shakeTracker.reset();       // 新的一局，没有"上一帧的伤"要补抖
  fxPlayer.reset();           // 也不该有上一局的圆环还在飘
  return ++gameSeq;
}

/** 这一局的 onUpdate：三种模式共用 */
function makeOnUpdate(mySeq) {
  return (state) => {
    if (mySeq !== gameSeq) return; // 这局已经被放弃了，别再画了
    // 模式 1 才记"通关"（组队和对战没有关卡概念）
    if (
      ui.mode === 'pve1v1' &&
      state.over &&
      !state.isDraw &&
      state.winnerTeam === 0
    ) {
      ui.cleared.add(ui.levelId);

      //  ★ v1.5.2（隐藏关卡）：打死的是**第三阶段**的耄耋 → 记"完美通关"，
      //    并且**立刻**放结局动画（放完才画结算画面 —— 玩家要求：
      //    "打赢隐藏关卡的耄耋后应该直接进入 the end 的动画，再显示下一关/重打/返回"）。
      //    判定：这一局是隐藏 Boss、而且那个进入过第三阶段的人已经死了。
      const finalOneDead =
        ui.hiddenBoss &&
        state.players.some((p) => p.counters && p.counters.maodieFinal && !p.alive);
      if (finalOneDead) {
        ui.perfect.add(ui.levelId);
        startEpilogue();
      }
    }
    playLogSounds(state);
    scheduleNoticeFade(state);
    render();
  };
}

/** 模式 3：把双方四个座位排出来 */
function buildTeamSeats(myHeroId) {
  // 剩下的猫随机分给"队友 / 敌人 A / 敌人 B"
  const rest = HEROES.map((h) => h.id).filter((id) => id !== myHeroId);
  const shuffled = [];
  const pool = [...rest];
  while (pool.length > 0) {
    shuffled.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }

  return [
    { heroId: myHeroId, isAI: false, team: 0, name: '你' },
    { heroId: shuffled[0], isAI: true, team: 0 },
    { heroId: shuffled[1], isAI: true, team: 1 },
    { heroId: shuffled[2], isAI: true, team: 1 },
  ];
}

/** 模式 3：2v2（你 + AI 队友 vs 两个 AI） */
function startTeamGame() {
  const mySeq = prepareNewGame();
  // 组队模式有自己的战斗曲（没放就静音）
  playBgm(MODE_BGM_KEYS.team2v2);

  // 座位表在摇骰子那一步就定下来了（要拿它显示"谁是谁"），
  // 没有就现造一份
  const seats = ui.pendingSeats || buildTeamSeats(ui.playerHeroId);
  ui.pendingSeats = null;
  ui.teamHeroIds = seats.map((s) => s.heroId);

  game = createGame({
    seats,
    deckRecipeId: 'team', // 2v2 专用的牌堆（有坐骑）
    firstSeat: ui.firstSeat,
    seed: Math.floor(Math.random() * 1e9),
    stepDelay: stepDelayOf(),
    aiDecider: createJimidou({ difficulty: ui.difficulty }),
    onUpdate: makeOnUpdate(mySeq),
  });

  render();

  game.start().catch((err) => {
    if (mySeq !== gameSeq) return;
    console.error(err);
    alert('游戏出错了：' + err.message + '\n\n请按 F12 打开控制台，把红色的报错发给我。');
  });
}

/** 模式 1：1v1 打 AI（原来的玩法，一点没改） */
function startGame() {
  const level = LEVELS.find((l) => l.id === ui.levelId) || LEVELS[0];

  // ★ v1.5.2（隐藏关卡）：**先把吕布打服、再回来打耄耋** → 对面的不是园区那只了。
  //   条件判断在 core/heroes.js 的 hiddenBossFor()（纯函数，测试直接调）。
  const boss = hiddenBossFor(level.id, ui.cleared);
  ui.hiddenBoss = !!boss;

  // 防御：不能选 AI 正在用的那只猫。
  //  ⚠️ 隐藏关卡里选猫名单也不一样（吕布 → S1吕布），所以这个开关必须和上面**同一个**判断。
  const allowed = heroesForLevel(level.id, { hiddenBoss: ui.hiddenBoss }).map((h) => h.id);
  if (!allowed.includes(ui.playerHeroId)) ui.playerHeroId = allowed[0];

  const mySeq = prepareNewGame();

  // 换这一关的背景音乐（没配就静音）
  playBgm(levelBgmKeys(level));

  game = createGame({
    playerHeroId: ui.playerHeroId,
    aiHeroId: boss ? boss.id : level.aiHeroId,
    firstSeat: ui.firstSeat, // 猜拳赢的人先手
    seed: Math.floor(Math.random() * 1e9),
    stepDelay: stepDelayOf(),   // 出牌速度（右上角那个 🐢/▶️/⚡ 按钮改它）
    aiDecider: createJimidou({ difficulty: ui.difficulty }),
    onUpdate: makeOnUpdate(mySeq),
  });

  render();

  // start() 会一直跑到游戏结束，所以不用 await
  game.start().catch((err) => {
    if (mySeq !== gameSeq) return;
    console.error(err);
    alert(
      '游戏出错了：' + err.message +
      '\n\n请按 F12 打开控制台，把红色的报错发给我。'
    );
  });
}

// ============================================================
//  「朋友邀请你联机？」—— 把房主发来的网址粘进来就能进
// ============================================================
//  联机时**朋友一个文件都不需要**，只要浏览器能打开房主给的地址。
//  但朋友手里往往只有那个压缩包，看到「联机 · 暂不可用」会以为自己缺东西，
//  所以给了这个输入框。粘进来 → 直接跳过去。
function goToJoinUrl() {
  const el = root.querySelector('#joinUrl');
  const raw = (el && el.value ? el.value : '').trim();
  const hint = root.querySelector('#joinHint');
  const say = (msg, bad) => {
    if (hint) {
      hint.textContent = msg;
      hint.style.color = bad ? '#a83232' : '#1f7a53';
    }
  };

  // 真正"该往哪儿跳"的判断在这个纯函数里（能脱离浏览器测）：
  // 完整链接、只有 ip:端口、只有房间码，三种都认。
  const r = resolveJoinTarget(raw, {
    protocol: location.protocol,
    origin: location.origin,
    port: location.port,
    remembered: readJoinOrigin(),
  });

  if (!r.ok) return say(r.message, true);

  // 记下这台房主电脑的地址：下次朋友只打房间码也能进
  if (r.origin) rememberJoinOrigin(r.origin);

  say('正在进入房间……');
  location.href = r.href;
}

// ------------------------------------------------------------
//  "上次去过的那台房主电脑" —— 存本地，用来支持"只输房间码"
// ------------------------------------------------------------
//  ⚠️ 注意这里是**浏览器本地存储**：file:// 打开的单文件版和
//     http:// 打开的房主页面属于不同的源，存储不互通。
//     所以这条记忆只在"同一台机器、同一个页面"里有用，
//     它是个锦上添花，光靠它解决不了"朋友第一次怎么进"的问题。
function readJoinOrigin() {
  try {
    return cleanOrigin(localStorage.getItem(JOIN_ORIGIN_KEY));
  } catch {
    return '';
  }
}

function rememberJoinOrigin(origin) {
  const clean = cleanOrigin(origin);
  if (!clean) return;
  try {
    localStorage.setItem(JOIN_ORIGIN_KEY, clean);
  } catch {
    /* 隐私模式下写不进去，无所谓 */
  }
}

/** 猜拳的三种手势，以及谁克谁 */
const RPS_CHOICES = ['rock', 'scissors', 'paper'];
const RPS_BEATS = { rock: 'scissors', scissors: 'paper', paper: 'rock' };

/**
 * 摇骰子：2v2 专用（1v1 还是猜拳）。
 *
 * 玩家反馈：「模式 3 不应该使用剪刀石头布，而是使用摇骰子，
 *   1~4 的点数来决定谁开始，再按照数字顺序来进行回合」。
 * 后来又明确：「摇骰子只用房主摇就可以了」。
 *
 * 所以就是**摇一次**：骰子出 1~4 点，**点数就是先手的座位号**
 * （1=你、2=队友、3=敌方 A、4=敌方 B），然后从他开始 1→2→3→4 转圈。
 *
 * 为什么不四个人各摇一个：那样得多摇三次、还得处理"点数一样大怎么办"，
 * 而结果其实一样 —— 谁先手本来就是随机的，摇一次就够。
 */
const DICE_SIDES = 4;

function rollDice() {
  return 1 + Math.floor(Math.random() * DICE_SIDES);
}

function startDice() {
  // 座位表先定下来（骰子那一屏要显示"几号位是谁"），开局直接复用
  ui.pendingSeats = buildTeamSeats(ui.playerHeroId);
  ui.dice = { value: null, winner: null, spinning: true };
  ui.screen = 'dice';
  render();

  // 先乱跳 0.9 秒再定下来 —— 直接出结果看着不像"摇"
  const t0 = Date.now();
  const spin = () => {
    if (!ui.dice || ui.screen !== 'dice') return; // 玩家按了返回
    if (Date.now() - t0 < 900) {
      ui.dice.value = rollDice();
      render();
      setTimeout(spin, 80);
      return;
    }
    const v = rollDice();
    // 点数 = 先手座位号（1 号位 → seats[0]）
    ui.dice = { value: v, winner: v - 1, spinning: false };
    ui.firstSeat = v - 1;
    render();
    setTimeout(() => {
      if (ui.screen === 'dice') startCurrentMode();
    }, 1700);
  };
  spin();
}

/**
 * 进猜拳界面（1v1 用）。
 *
 * 为什么开打前要插这一步？
 *   先手方实测约 53~55% 胜率 —— 白赚一个回合。写死"玩家先手"
 *   对 AI 来说是送分，对两个人来说就是不公平。
 *   所以猜一拳，赢的先手；后手的人第一个回合多摸一张补回来。
 */
function startRps() {
  ui.rps = { myPick: null, aiPick: null, result: null };
  ui.screen = 'rps';
  render();
}

function pickRps(pick) {
  const r = ui.rps;
  if (!r || r.myPick) return; // 已经出过了

  r.myPick = pick;
  r.aiPick = RPS_CHOICES[Math.floor(Math.random() * RPS_CHOICES.length)];
  r.result =
    r.aiPick === pick ? 'tie'
      : RPS_BEATS[pick] === r.aiPick ? 'win' : 'lose';
  render();

  if (r.result === 'tie') {
    // 平局看一眼结果，然后重来
    setTimeout(() => {
      if (ui.screen === 'rps') startRps();
    }, 1300);
    return;
  }

  // 我方是座位 0；组队模式下敌方那一队的第一个座位是 2
  ui.firstSeat = r.result === 'win' ? 0 : (ui.mode === 'team2v2' ? 2 : 1);
  setTimeout(() => {
    if (ui.screen === 'rps') startCurrentMode();
  }, 1500);
}

/**
 * 「🏳️ 逃跑」：认输，然后回主界面。
 *
 * 单机这边"算输"其实没什么可记的（通关记录只记赢的），
 * 所以主要是两件事：
 *   ① 让引擎按正常结算判对方赢 —— 这样结算画面/日志是对的，
 *      而且万一以后要记录败场，这里已经是对的了
 *   ② 停掉这一局（gameSeq++ 让后台的 start() 不再画界面）并回主界面
 *
 * ⚠️ 必须先问一句，不能点一下就没了 —— 手滑点到的代价太大。
 */
function escapeGame() {
  const ok = confirm('要逃跑吗？\n\n这局算你输，然后回到主界面。');
  if (!ok) return;

  if (game && !game.state.over) {
    try {
      game.api.resign(game.state.players[0]);
    } catch (err) {
      console.warn('[逃跑] 结算时出错（不影响退出）：', err);
    }
  }

  gameSeq++;      // 让还在后台跑的这一局失效（它的 onUpdate 不会再画）
  game = null;
  lastPending = null;
  // ★ v1.5.2：逃跑回主界面时，也把"最终之战"的背景视频 / 持续抖动撤掉
  clearFinalPhase();
  ui.screen = 'mode';
  playBgm(MENU_BGM_KEYS);
  render();
}

// ============================================================
//  ★ v1.5.2（隐藏关卡）：结局动画
// ============================================================
//  玩家要求（原话）：
//    "在玩家成功击杀耄耋后（指打死第三阶段的耄耋）……暂停所有 bgm，屏幕黑屏 3s，
//     同时中间显示一行白色的静止小文字'耄耋的梦，该醒了。。。'，
//     随后播放 assets/video/the end 中的视频'耄耋的梦该醒了'，
//     观看结束后，自动回到主菜单，并在关卡7标注'完美通关'而不是'已通关'"
//
//  ★ 后来玩家又改了一次顺序（现在是这样）：
//    "打赢隐藏关卡的耄耋后应该**直接进入 the end 的动画**，**再显示下一关/重打/返回**"
//    所以：打死第三阶段的耄耋 → **立刻**黑屏 + 放结局视频 → 放完**才**画出胜利画面
//    （下一关 / 重打本关 / 返回 三颗按钮），不再是"先看结算、点返回才放动画"。
//
//  【流程】停止一切声音 → 撤掉"最终之战"的背景视频/抖动 → 黑屏 + 一行白字（3 秒）
//          → 结局视频（原声）→ （不管放没放成功）画出结算画面
//
//  ⚠️ 这一段是**异步**的：视频 29 秒，中间玩家会点来点去。
//     所以黑屏 / 视频那两层是**铺在 <body> 上盖住全屏**的（见 style.css），
//     玩家的点击落不到下面的按钮上 —— 不会出现"一边放结局一边开新局"。
//     ⚠️ 结算画面也是**这时候才开始画**的（`ui.epilogueRunning` 为真时先不画），
//        所以那三颗按钮不会提前露出来。
//  ⚠️ 无论如何都要画结算：播不了（素材缺失 / 浏览器拦截）也得往下走，
//     不然玩家就被锁在结局里了。兜底写在 ui/video.js 里。
const EPILOGUE_TEXT = '耄耋的梦，该醒了。。。';
const EPILOGUE_BLACK_MS = 3000;

/** 结局正在放（界面据此**先不画结算画面**） */
let epilogueRunning = false;

/** 什么时候开始放结局：**打死第三阶段的耄耋那一刻**（见 makeOnUpdate） */
function startEpilogue() {
  if (epilogueRunning || ui.epilogueDone) return;
  epilogueRunning = true;
  ui.epilogueRunning = true;
  runEpilogue().catch((e) => {
    //  兜底：无论如何都不能把玩家锁在结局里（下面 finally 一定会跑）
    console.warn('[结局] 出错了（不影响结算）：', e);
  });
}

async function runEpilogue() {
  // ① 暂停所有 bgm（玩家要求）
  stopBgm();
  // 顺便把"最终之战"的背景视频和持续抖动撤掉 —— 黑屏要真的黑
  clearFinalPhase();

  let black = null;
  try {
    // ② 黑屏 3 秒 + 中间一行白色小字（静止的）
    black = showBlackoutLine(EPILOGUE_TEXT);
    await sleepMs(EPILOGUE_BLACK_MS);
    black.remove();
    black = null;

    // ③ 结局视频（放完 / 播不了都会 resolve）
    await playEndingVideo();
  } catch (e) {
    console.warn('[结局] 播放过程出错（照样往下走）：', e);
  } finally {
    //  ⚠️ 黑屏那一层一定要收掉：万一上面 await 抛了，玩家会被一块黑布永久盖住
    if (black) black.remove();
    ui.epilogueDone = true;   // 这一局只放一次
    epilogueRunning = false;
    ui.epilogueRunning = false;
    // ④ 现在才画结算画面（下一关 / 重打本关 / 返回）
    render();
  }
}

/** 小睡一下（结局那 3 秒黑屏用） */
function sleepMs(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

/** 按当前模式开局（重开局也走这里） */
function startCurrentMode() {  // ★ 联机模式**不在这里开局** —— 它有自己的页面（pvp.html）。
  //   万一哪天又被路由到这里，宁可明确跳回去，也绝不悄悄退回单机：
  //   那正是"点了联机却跟 AI 打起来"这个 bug 的成因。
  //   判断方式直接查模式表（next === 'page' 的都是联机页），
  //   这样以后再加联机玩法也不会漏。
  const m = findMode(ui.mode);
  if (m.next === 'page') {
    console.warn(`[${m.id}] 联机玩法不该走单机的开局流程，正在跳回联机页`);
    location.href = m.page;
    return;
  }
  if (ui.mode === 'team2v2') return startTeamGame();
  return startGame();
}

// ============================================================
//  按钮
// ============================================================
function onAction(action) {
  if (action === 'audio-panel') {
    ui.audioOpen = !ui.audioOpen;
    return render();
  }

  if (action === 'mute') {
    toggleMute();
    return render();
  }

  if (action === 'back') {
    gameSeq++;      // 让还在后台跑的旧对局失效
    game = null;
    lastPending = null;
    //  ★ v1.5.2：退出对局时把"最终之战"的持续视觉（背景视频 / 持续抖动）撤掉
    clearFinalPhase();
    // 组队模式没有关卡，直接退回模式选择；打 AI 就退回选关
    // 猜拳 / 摇骰子界面按返回 → 回到选猫；其它情况按模式回去
    ui.screen = ui.screen === 'rps' || ui.screen === 'dice'
      ? 'heroPick'
      : ui.mode === 'pve1v1' ? 'levels' : 'mode';
    playBgm(MENU_BGM_KEYS); // 换回菜单 BGM
    return render();
  }

  if (action === 'modes') {
    gameSeq++;
    game = null;
    lastPending = null;
    ui.screen = 'mode';
    playBgm(MENU_BGM_KEYS);
    return render();
  }

  // 重开一局也重新定先手（1v1 猜拳 / 2v2 摇骰子）
  if (action === 'retry') return ui.mode === 'team2v2' ? startDice() : startRps();

  // 「🏳️ 逃跑」：认输 → 回主界面（模式选择）
  if (action === 'escape') return escapeGame();

  // 出牌速度：慢 → 正常 → 快 → 慢……
  if (action === 'speed') return cycleSpeed();

  // 「朋友邀请你联机？」输入框 → 跳到房主给的网址
  if (action === 'goto-url') return goToJoinUrl();

  if (action === 'next') {
    ui.levelId = Math.min(LEVELS[LEVELS.length - 1].id, ui.levelId + 1);
    gameSeq++;
    game = null;
    lastPending = null;
    ui.screen = 'heroPick';
    playBgm(WAIT_BGM_KEYS); // 选猫那一屏有自己的曲子（没放就静音）
    return render();
  }

  const pending = game && game.state.pending;
  if (!pending) return;

  if (action === 'confirm') {
    const cards = pending.player.hand.filter((c) => ui.selected.has(c.uid));
    ui.selected.clear();
    pending.resolve(cards);   // 把答案交回给引擎
  } else if (action === 'cancel') {
    ui.selected.clear();
    pending.resolve([]);      // 空数组 = 放弃 / 结束出牌阶段
  }
}

// ============================================================
//  事件绑定（只在根节点绑一次，靠 data-* 属性分辨点到了什么）
// ============================================================
root.addEventListener('click', (e) => {
  // --- 选模式 ---
  const modeEl = e.target.closest('[data-mode]');
  if (modeEl) {
    const id = modeEl.dataset.mode;
    const mode = findMode(id);

    // 需要服务器的模式（联机），在"单文件版"（双击 index.html）里用不了
    if (mode.needsServer && !ui.pvpAvailable) {
      alert(
        '联机模式需要一个本地服务器。\n\n' +
        '请用「启动游戏.cmd」启动，或者在装了 Node.js 的机器上跑 node server.mjs。\n' +
        '（双击 index.html 打开的单文件版用不了联机模式）'
      );
      return;
    }

    ui.mode = mode.id;
    ui.playerHeroId = null;

    // ★ 去哪由模式和 build 脚本里的 next 字段决定 —— 以前这里是
    //   `id === 'pve1v1' ? 'levels' : 'heroPick'`，
    //   结果"联机对打"被当成组队模式，掉进本页的单机选猫流程，
    //   选完猫就直接跟第 1 关的小海打起来了。所以改成查表，
    //   而且 uicheck.mjs 会检查"每个模式都必须有去向"。
    if (mode.next === 'page') {
      // 联机是**另一个页面**（大厅、选猫、对局都在那边）
      location.href = mode.page;
      return;
    }

    ui.screen = mode.next; // 'levels' | 'heroPick'
    // 直接进选猫（组队模式）的话，这里就该放"选将 / 等待"那首
    if (ui.screen === 'heroPick') playBgm(WAIT_BGM_KEYS);
    return render();
  }

  // --- 选关 ---
  const levelEl = e.target.closest('[data-level]');
  if (levelEl) {
    ui.levelId = Number(levelEl.dataset.level);
    ui.playerHeroId = null;
    ui.screen = 'heroPick';
    playBgm(WAIT_BGM_KEYS); // 选猫那一屏
    return render();
  }

  // --- 选猫 ---
  const heroEl = e.target.closest('[data-hero]');
  if (heroEl) {
    ui.playerHeroId = heroEl.dataset.hero;
    // 2v2 有四个人，摇骰子比大小定先手；1v1 两个人猜拳
    return ui.mode === 'team2v2' ? startDice() : startRps();
  }

  // --- 猜拳 ---
  const rpsEl = e.target.closest('[data-rps]');
  if (rpsEl) return pickRps(rpsEl.dataset.rps);

  // --- 难度 ---
  const diffEl = e.target.closest('[data-diff]');
  if (diffEl) {
    ui.difficulty = diffEl.dataset.diff;
    return render();
  }

  // --- ★ v1.5.2：AI 出牌速度（主界面 / 选关界面那三颗）---
  //     对局里那颗是轮换（data-action="speed"），这个是"点哪个是哪个"
  const speedEl = e.target.closest('[data-speed]');
  if (speedEl) return setSpeed(speedEl.dataset.speed);

  // --- 手牌 ---
  const cardEl = e.target.closest('[data-card-uid]');
  if (cardEl) return onCardClick(Number(cardEl.dataset.cardUid));

  // --- 纯选择题的某个选项（比如"当作歪头使用"）---
  const optionEl = e.target.closest('[data-option]');
  if (optionEl) {
    const pending = game && game.state.pending;
    if (pending) {
      ui.selected.clear();
      pending.resolve([], optionEl.dataset.option);
    }
    return;
  }

  // --- 武将主动技能按钮 ---
  const extraEl = e.target.closest('[data-extra]');
  if (extraEl) {
    const pending = game && game.state.pending;
    if (pending) {
      ui.selected.clear();
      pending.resolve([], extraEl.dataset.extra);
    }
    return;
  }

  // --- 各种按钮 ---
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) return onAction(actionEl.dataset.action);

  // --- 点了别的地方 → 关掉声音面板 ---
  if (ui.audioOpen && !e.target.closest('.audio-widget')) {
    ui.audioOpen = false;
    render();
  }
});

// ------------------------------------------------------------
//  拖音量滑块
// ------------------------------------------------------------
//  注意这里用的是 input 事件，而且**不重画整个界面** ——
//  一旦 innerHTML 被换掉，滑块就会失去焦点，拖到一半就断了。
//  所以只手动更新旁边那个百分比数字。
let lastSfxPreview = 0;

root.addEventListener('input', (e) => {
  const el = e.target.closest('[data-volume]');
  if (!el) return;

  const kind = el.dataset.volume; // 'bgm' | 'sfx'
  const value = Number(el.value) / 100;
  setVolume(kind, value);

  const label = root.querySelector(`[data-volume-label="${kind}"]`);
  if (label) label.textContent = `${el.value}%`;

  // 拖音效滑块时放一声，让你直接听到调到多大了（限流，别太吵）
  if (kind === 'sfx') {
    const now = Date.now();
    if (now - lastSfxPreview > 250) {
      lastSfxPreview = now;
      playSfx('select');
    }
  }
});

// 键盘快捷键：回车 = 确认，Esc = 放弃
document.addEventListener('keydown', (e) => {
  // 「朋友邀请你联机？」那个输入框：回车直接进
  if (e.key === 'Enter' && ui.screen === 'mode') {
    const el = root.querySelector('#joinUrl');
    if (el && document.activeElement === el) return void goToJoinUrl();
  }

  const pending = game && game.state.pending;
  if (!pending) return;
  if (e.key === 'Enter') {
    const btn = root.querySelector('[data-action="confirm"]');
    if (btn && !btn.disabled) onAction('confirm');
  } else if (e.key === 'Escape') {
    if (pending.question.cancelText) onAction('cancel');
  }
});

window.__game = () => game;           // 敲 __game()  看整个游戏状态
window.__art = () => getArtManifest(); // 敲 __art()   看认出了哪些卡图 / 武将图
window.__audio = () => getAudioManifest(); // 敲 __audio() 看认出了哪些音频
/**
 * ★ v1.5.2（隐藏关卡）：**一键解锁隐藏关卡**。
 *
 * 隐藏关卡的门槛是"先把第 8 关的吕布打服"，正常玩要打一整局。
 * 想直接看隐藏内容（或者自动化测）的话，在浏览器控制台敲：
 *
 *     __unlockHidden()
 *
 * 它把"吕布那一关通关了"记进通关记录，然后回选关界面 ——
 * 第 7 关卡片上会出现那行提示，点进去就是「耄耋」本尊。
 * （只影响这一次会话，刷新就回到正常状态。和 `__game()` 那几个一样，
 *   是给开发者/好奇的玩家留的口子，游戏流程本身不依赖它。）
 */
window.__unlockHidden = () => {
  ui.cleared.add(HIDDEN_LEVEL.afterLevelId);
  ui.screen = 'levels';
  render();
  return `已解锁：去选关界面点第 ${HIDDEN_LEVEL.levelId} 关（对面会是「耄耋」）`;
};

// 先问服务器"现在有哪些图片和音频"，再画第一屏。
// 只是个本地请求，很快；拿不到也没关系，会全部退回占位图 / 静音。
await loadAssets();

// 顺便问一句"这台机器上能不能开联机"。
//   单文件版（双击 index.html）→ 没有服务器，fetch 被浏览器拒绝 → false
//   用 启动游戏.cmd 跑的       → 服务器会答 → true
// 结果给模式选择界面用：不能联机时那张卡片显示"暂不可用"。
async function detectPvp() {
  // 单文件版：连素材清单都是打包写死的，肯定没有服务器
  if (globalThis.__ASSETS__) return false;
  try {
    const r = await fetch('/api/pvp/info', { cache: 'no-store' });
    if (!r.ok) return false;
    const info = await r.json();
    return !!info.enabled;
  } catch {
    return false;
  }
}
ui.pvpAvailable = await detectPvp();

// 模式选择界面的背景音乐。
// 注意：浏览器不允许"用户还没点过页面就自动播放"，
// 所以这里大概率会被拒绝 —— armBgmRetry() 会在你第一次点击时补播。
playBgm(MENU_BGM_KEYS);
armBgmRetry();

// 开机音效（「开启游戏音效.mp3」）——刚打开页面放一次。
// 同样会被自动播放策略拦，函数内部已经处理好"等第一次点击补播"。
playStartSfx();

render();

})().catch(function (err) {
  // 出错的时候别让朋友看到一片白屏，把错误直接写在页面上
  console.error(err);
  var box = document.createElement('div');
  box.style.cssText =
    'position:fixed;left:0;right:0;top:0;z-index:999;background:#7f1d1d;color:#fff;' +
    'padding:14px 18px;font:13px/1.7 Consolas,monospace;white-space:pre-wrap;';
  box.textContent = '游戏启动失败：\n' + (err && err.stack ? err.stack : err);
  document.body.appendChild(box);
});

</script>
</body>
</html>
